.tab{border:none;border-radius:22px;padding:9px 17px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,.09);color:#c8d2e4;transition:background .16s,color .16s,transform .1s,box-shadow .16s}

.tab.active{background:linear-gradient(135deg,#D4AF37,#C9A227);color:#1A1A2E;box-shadow:0 3px 12px rgba(212,175,55,.42)}
.tab.active:hover{background:linear-gradient(135deg,#DBB84A,#D4AF37);color:#1A1A2E;transform:translateY(-1px)}
/* MAIN */
.main{padding:18px 22px;max-width:1200px;margin:0 auto}

.stat-val{font-size:22px;font-weight:800;margin-bottom:2px}
.stat-lbl{font-size:11px;color:#888}

.tbl{width:100%;border-collapse:collapse;font-size:12px}

.tbl tr:hover td{background:#FAFAFA}

.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}

function genQuarters(){
  const qs=[];
  const now=new Date();
  const endYear=now.getFullYear()+5;
  for(let y=2023;y<=endYear;y++)
    for(let q=1;q<=4;q++) qs.push(`Q${q}/${y}`);
  return qs;
}

function currentQuarter(){const n=new Date();return `Q${Math.ceil((n.getMonth()+1)/3)}/${n.getFullYear()}`;}

  for(let y=2020;y<=endYear;y++){
    for(let m=1;m<=12;m++) months.push(`T${m}/${y}`);

  return months;
}

function loadObjectives(){return ls_get("ta_objectives")||DEFAULT_OBJECTIVES;}
function saveObjectives(o){ls_set("ta_objectives",o);pushObjectivesToSheets(o);}
async function pushObjectivesToSheets(o){
  try{
    const arr=o||OBJECTIVES;
    const snap=await qldb.collection("ql_objectives").get();
    const keep=new Set(arr.map(x=>String(x.id)));
    for(const doc of snap.docs){ if(!keep.has(doc.id)) await doc.ref.delete(); }
    for(let i=0;i<arr.length;i++){ const x=arr[i];
      await qldb.collection("ql_objectives").doc(String(x.id)).set({
        id:x.id, icon:x.icon||"🎯", title:x.title, order:i+1,
        krs:(x.krs||[]).map(k=>({id:k.id,text:k.text,unit:k.unit||"",target:Number(k.target)||0,ownerRole:k.ownerRole||""}))
      });
    }
  }catch(e){ console.error("pushObjectives(FB)",e); }
}

function loadUsers(){
  const saved = ls_get("ta_users");
  if(!Array.isArray(saved) || saved.length===0) return DEFAULT_USERS.map(u=>({...u}));
  const map = {};
  saved.forEach(u=>{ if(u && u.username) map[u.username] = u; });
  // CHỐT AN TOÀN: tài khoản quản trị LUÔN tồn tại, dù bộ nhớ máy hay Sheets có mất.
  DEFAULT_USERS.filter(d=>d.isAdmin).forEach(d=>{
    if(!map[d.username]) map[d.username] = {...d};
    else map[d.username].isAdmin = true;
    if(!map[d.username].password) map[d.username].password = d.password;
  });
  // ƯU TIÊN tài khoản admin do Thầy tự đổi trong app (thay thế tài khoản mặc định)
  const _ov = ls_get("ta_admin_override");
  if(_ov && _ov.username){
    Object.keys(map).forEach(k=>{ if(map[k] && map[k].isAdmin) delete map[k]; });
    map[String(_ov.username)] = {username:String(_ov.username), password:String(_ov.password||""), name:_ov.name||"Thầy Ngọc Cương", role:"admin", isAdmin:true, luong:0};
  }
  return Object.values(map);
}
function saveUsers(u){
  // LỚP BẢO VỆ: dù ghi danh sách nào, tài khoản quản trị cũng không bao giờ bị mất
  const map = {};
  (Array.isArray(u)?u:[]).forEach(x=>{ if(x && x.username) map[x.username] = x; });
  DEFAULT_USERS.filter(d=>d.isAdmin).forEach(d=>{
    if(!map[d.username]) map[d.username] = {...d};
    else map[d.username].isAdmin = true;
    if(!map[d.username].password) map[d.username].password = d.password;
  });
  ls_set("ta_users", Object.values(map));
}

function _tenGon(s){

// Hiển thị ngày dạng dd/mm/yyyy (xử lý cả chuỗi ISO từ Google Sheets, theo giờ VN)
function fmtDate(v){
  if(!v) return "-";
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);           // 2026-07-11
  if(m) return m[3]+"/"+m[2]+"/"+m[1];
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) return s;      // đã là dd/mm/yyyy
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.toLocaleDateString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit",year:"numeric"});
  return s;
}
// Chuyển về yyyy-mm-dd cho ô <input type="date">
function toInputDate(v){
  if(!v) return "";
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);   // dd/mm/yyyy
  if(m) return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.toLocaleDateString("en-CA",{timeZone:"Asia/Ho_Chi_Minh"});
  return "";
}

async function apiGet(p){
  try{
    const a=p.action;
    if(a==="getAllData"){
      const [objS,txS,plS,luS,ltS] = await Promise.all([
        qldb.collection("ql_objectives").get(),
        qldb.collection("ql_thuchi").get(),
        qldb.collection("ql_plans").get(),
        qldb.collection("ql_luong").get(),
        qldb.collection("ql_lotrinh").doc("main").get()
      ]);
      const objectives=objS.docs.map(d=>d.data()).sort((x,y)=>(x.order||0)-(y.order||0));
      const thuchi=txS.docs.map(d=>d.data());
      const plans=plS.docs.map(d=>d.data());
      const luong={}; luS.docs.forEach(d=>{const x=d.data(); luong[(x.user||"")+"__"+(x.month||"")]=x;});
      const lotrinh=ltS.exists?ltS.data():null;
      return {thuchi,luong,plans,lotrinh,objectives};
    }
    if(a==="getUsers"){ const s=await qldb.collection("ql_users").get(); return s.docs.map(d=>d.data()); }
    if(a==="getObjectives"){ const s=await qldb.collection("ql_objectives").get(); return {objectives:s.docs.map(d=>d.data()).sort((x,y)=>(x.order||0)-(y.order||0))}; }
    if(a==="getThuChi"){ const s=await qldb.collection("ql_thuchi").get(); return s.docs.map(d=>d.data()); }
    if(a==="getPlans"){ const s=await qldb.collection("ql_plans").get(); return s.docs.map(d=>d.data()); }
    if(a==="getLuong"){ const s=await qldb.collection("ql_luong").get(); const luong={}; s.docs.forEach(d=>{const x=d.data(); luong[(x.user||"")+"__"+(x.month||"")]=x;}); return luong; }
    if(a==="getLoTrinh"){ const d=await qldb.collection("ql_lotrinh").doc("main").get(); return {lotrinh:d.exists?d.data():null}; }
    if(a==="getActuals"){ const s=await qldb.collection("ql_actuals").where("quarter","==",p.quarter).get(); const m={}; s.forEach(d=>{const x=d.data(); m[x.krId]={actual:Number(x.actual)||0};}); return m; }
    if(a==="getAllActuals"){ const s=await qldb.collection("ql_actuals").get(); const m={}; s.forEach(d=>{const x=d.data(); (m[x.quarter]=m[x.quarter]||{})[x.krId]={actual:Number(x.actual)||0};}); return m; }
    return {};
  }catch(e){ console.error("apiGet(FB)",p.action,e); return {}; }
}
async function apiPost(d){
  try{
    const a=d.action;
    if(a==="batchUsers"){
      const arr=d.users||[];
      const snap=await qldb.collection("ql_users").get();
      const keep=new Set(arr.map(u=>String(u.username)));
      for(const doc of snap.docs){ const u=doc.data(); if(!u.isAdmin && !keep.has(String(u.username))) await doc.ref.delete(); }
      for(const u of arr){ await qldb.collection("ql_users").doc(String(u.username)).set({username:u.username,password:String(u.password||""),name:u.name||"",role:u.role||"",isAdmin:!!u.isAdmin,luong:Number(u.luong)||0}); }
      return {saved:true};
    }
    if(a==="batchThuChi"){ for(const x of (d.items||[])){ await qldb.collection("ql_thuchi").doc(String(x.id||Date.now())).set(x);} return {saved:true}; }
    if(a==="batchLuong"){ for(const x of (d.items||[])){ await qldb.collection("ql_luong").doc(((x.user||"")+"__"+(x.month||"")).replace(/\//g,"-")).set(x);} return {saved:true}; }
    return {};
  }catch(e){ console.error("apiPost(FB)",d.action,e); return {}; }
}

async function syncGet(params){
  try{

    if(a==="deletePlanGet"){ await qldb.collection("ql_plans").doc(String(params.id)).delete(); return {deleted:true}; }
    if(a==="saveThuChiGet"){ await qldb.collection("ql_thuchi").doc(String(params.id)).set({id:params.id,type:params.type,cat:params.cat,amount:Number(params.amount)||0,note:params.note||"",date:params.date||"",month:params.month||"",nguoi:params.nguoi||"",httt:params.httt||""}); return {saved:true}; }
    if(a==="deleteThuChiGet"){ await qldb.collection("ql_thuchi").doc(String(params.id)).delete(); return {deleted:true}; }
    if(a==="saveLuongGet"){ const key=((params.user||"")+"__"+(params.month||"")).replace(/\//g,"-"); await qldb.collection("ql_luong").doc(key).set({user:params.user,name:params.name||"",month:params.month,base:Number(params.base)||0,bonus:Number(params.bonus)||0,note:params.note||"",status:params.status||"",total:Number(params.total)||0}); return {saved:true}; }
    if(a==="saveStudentGet"){ const o=Object.assign({},params); delete o.action; if(o.name) o.name=decodeURIComponent(o.name); if(o.note) o.note=decodeURIComponent(o.note); await qldb.collection("ql_students").doc(String(o.id||Date.now())).set(o); return {saved:true}; }
    if(a==="deleteStudentGet"){ await qldb.collection("ql_students").doc(String(params.id)).delete(); return {deleted:true}; }
    if(a==="saveAttendanceGet"){ const o=Object.assign({},params); delete o.action; await qldb.collection("ql_attendance").doc(String(o.key||Date.now())).set(o); return {saved:true}; }
    return {};
  }catch(e){ console.error("syncGet(FB)",params.action,e); return {}; }
}

// Load toàn bộ dữ liệu từ Sheets khi đăng nhập
// Google Sheets = NGUỒN SỰ THẬT DUY NHẤT cho danh sách kế hoạch.
// Kế hoạch đã xóa ở máy khác sẽ biến mất ở đây (không "sống lại" như trước).
// Chỉ lấy từ máy các trường mà Sheets trả về rỗng (phòng khi backend chưa cập nhật).
function mergePlans(sheetPlans){
  const local = ls_get("ta_plans") || [];
  const localMap = {};
  local.forEach(p=>{ localMap[p.id.toString()] = p; });
  return sheetPlans.map(sp=>{
    const lp = localMap[sp.id.toString()];
    if(!lp) return sp;
    const has = v => v!==undefined && v!==null && v!=="";
    return {
      ...sp,
      okrObj: has(sp.okrObj) ? sp.okrObj : (lp.okrObj||""),
      okrKr:  has(sp.okrKr)  ? sp.okrKr  : (lp.okrKr ||""),
      actual: has(sp.actual) ? sp.actual : (has(lp.actual)?lp.actual:0)
    };
  });
}

      if(Array.isArray(data.thuchi)){

        state.transactions = data.thuchi;

      if(data.luong && typeof data.luong==="object"){
        ls_set("ta_luong", data.luong);
        state.luongData = data.luong;
      }
      // Merge Plans — Sheets là nguồn sự thật (chấp nhận cả mảng rỗng)
      if(Array.isArray(data.plans)){
        const merged = mergePlans(data.plans);
        ls_set("ta_plans", merged);
        state.plans = merged;
      }
      // Lộ trình đào tạo — Sheets là nguồn sự thật (null = chưa có -> dùng mặc định)
      if(data.lotrinh){
        ls_set("ta_lotrinh", data.lotrinh);
        state.lotrinh = data.lotrinh;
      }
      // OKR (Objective/KR) — Sheets là nguồn sự thật, đồng bộ đa thiết bị
      if(data.objectives && Array.isArray(data.objectives) && data.objectives.length){
        // Sheets có dữ liệu -> áp dụng (KHÔNG gọi saveObjectives để tránh đẩy ngược)
        OBJECTIVES = data.objectives;
        ls_set("ta_objectives", data.objectives);
      } else {
        // Sheets trống -> chỉ máy nào có chỉnh sửa (khác mặc định) mới seed lên, tránh ghi đè bằng bản mặc định
        try{
          if(JSON.stringify(OBJECTIVES)!==JSON.stringify(DEFAULT_OBJECTIVES)){
            pushObjectivesToSheets(OBJECTIVES);
          }
        }catch(e){}
      }
    }
  }catch(e){ console.log("Load all error:", e); }
}

async function loadUsersFromSheets(){
  try{
    const sheetUsers = await apiGet({action:"getUsers"});
    const localUsers = loadUsers();
    if(Array.isArray(sheetUsers) && sheetUsers.length > 0){
      // Sheet có data thật (không phải default) - merge
      const isDefault = sheetUsers.length <= 7 && sheetUsers.every(u=>
        ["cuong","piano","guitar","vocal","dance","recording","marketing"].includes(u.username));
      if(!isDefault){
        // Sheets = NGUỒN SỰ THẬT: sửa/xóa nhân sự ở máy nào cũng đồng bộ sang máy khác.
        const map = {};
        sheetUsers.forEach(u=>{
          if(!u || u.username==null || u.username==="") return;
          // Ép về CHỮ: Sheets trả tài khoản/mật khẩu toàn số về dạng số -> gây lỗi so sánh khi đăng nhập
          u.username = String(u.username).trim();
          u.password = String(u.password==null?"":u.password).trim();
          map[u.username] = u;
        });
        // CHỐT AN TOÀN: tài khoản quản trị lấy từ danh sách CỨNG trong code
        // (không lấy từ bộ nhớ máy — vì bộ nhớ máy có thể đã bị ghi đè và mất admin).
        DEFAULT_USERS.filter(d=>d.isAdmin).forEach(d=>{
          if(!map[d.username]) map[d.username] = {...d};      // thiếu thì khôi phục
          else map[d.username].isAdmin = true;                 // có thì luôn giữ quyền admin
          if(!map[d.username].password) map[d.username].password = d.password;
        });
        const merged = Object.values(map);
        saveUsers(merged);
        USERS = merged;
        return merged;
      }
    }
    // Dùng local
    USERS = localUsers;
  }catch(e){
    USERS = loadUsers();
  }
  return USERS;
}

function saveObjective(){
  const title=state.okr_obj_title.trim(),icon=state.okr_obj_icon;
  if(!title){setState({okr_error:"Vui lòng nhập tên mục tiêu!"});return;}
  const objs=[...OBJECTIVES];
  if(state.okr_editObj==="new"){
    const id="O"+(objs.length+1)+"_"+Date.now();
    objs.push({id,icon,title,krs:[]});
  } else {
    const i=objs.findIndex(o=>o.id===state.okr_editObj);
    if(i>=0){objs[i]={...objs[i],icon,title};}
  }
  OBJECTIVES=objs;saveObjectives(objs);
  setState({showOKREditor:false,okr_editObj:null,okr_obj_title:"",okr_error:""});
}
function deleteObjective(oid){
  if(!confirm("Xóa mục tiêu này và tất cả KR bên trong?"))return;
  OBJECTIVES=OBJECTIVES.filter(o=>o.id!==oid);saveObjectives(OBJECTIVES);setState({});
}
function saveKR(){
  const text=state.okr_kr_text.trim(),unit=state.okr_kr_unit,target=Number(state.okr_kr_target),role=state.okr_kr_role;
  if(!text||!target){setState({okr_error:"Vui lòng điền đầy đủ KR!"});return;}
  const objs=[...OBJECTIVES];
  const oi=objs.findIndex(o=>o.id===state.okr_editKR?.oid);
  if(oi<0)return;
  const krs=[...objs[oi].krs];
  if(!state.okr_editKR.kid){
    krs.push({id:"kr_"+Date.now(),text,unit,target,ownerRole:role});
  } else {
    const ki=krs.findIndex(k=>k.id===state.okr_editKR.kid);
    if(ki>=0)krs[ki]={...krs[ki],text,unit,target,ownerRole:role};
  }
  objs[oi]={...objs[oi],krs};
  OBJECTIVES=objs;saveObjectives(objs);
  setState({okr_editKR:null,okr_kr_text:"",okr_kr_target:0,okr_error:""});
}
function deleteKR(oid,kid){
  if(!confirm("Xóa Key Result này?"))return;
  const objs=OBJECTIVES.map(o=>o.id!==oid?o:{...o,krs:o.krs.filter(k=>k.id!==kid)});
  OBJECTIVES=objs;saveObjectives(objs);setState({});
}

function processImportFile(file){
  if(!file) return;
  setState({importing:true, importResult:null});
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});

      if(state.importType==="nhansu") importNhanSu(rows);
      else if(state.importType==="thu") importThuChi(rows,"thu");
      else if(state.importType==="chi") importThuChi(rows,"chi");
      else if(state.importType==="luong") importLuong(rows);
    }catch(err){
      setState({importing:false, importResult:{error:"Lỗi đọc file: "+err.message}});
    }
  };
  reader.readAsArrayBuffer(file);
}

function importNhanSu(rows){
  let added=0, skipped=0, errors=[];
  const users=[...USERS];
  rows.forEach((r,i)=>{
    const name=(r["Họ và Tên *"]||r["Họ và Tên"]||"").toString().trim();
    const username=(r["Tên Đăng Nhập *"]||r["Tên Đăng Nhập"]||"").toString().trim().toLowerCase();
    const password=(r["Mật Khẩu *"]||r["Mật Khẩu"]||"").toString().trim();
    const role=(r["Bộ Môn *"]||r["Bộ Môn"]||"piano").toString().trim().toLowerCase();
    const luong=Number(r["Lương CB (VND) *"]||r["Lương CB (VND)"]||0);
    if(!name||!username||!password){skipped++;return;}
    if(users.find(u=>u.username===username)){
      // Update existing
      const i=users.findIndex(u=>u.username===username);
      users[i]={...users[i],name,password,role,luong};
      added++;
    } else {
      users.push({username,password,name,role,isAdmin:false,luong});
      added++;
    }
  });
  saveUsers(users); USERS=loadUsers();
  // Sync toàn bộ lên Google Sheets
  apiPost({action:"batchUsers",users:users.filter(u=>!u.isAdmin)}).catch(()=>{});
  setState({importing:false, importResult:{type:"nhansu",added,skipped,errors}});
}

// Chuyển số serial Excel sang ngày dd/mm/yyyy
function excelDateToStr(val){
  if(!val) return "";
  // Nếu đã là chuỗi ngày hợp lệ thì giữ nguyên
  if(typeof val === "string" && val.includes("/")) return val;
  // Nếu là số serial Excel
  if(typeof val === "number" || !isNaN(Number(val))){
    const n = Number(val);
    if(n > 10000 && n < 100000){
      // Excel epoch: ngày 1 = 1/1/1900, nhưng có lỗi leap year 1900
      const d = new Date((n - 25569) * 86400 * 1000);
      const day = String(d.getUTCDate()).padStart(2,"0");
      const mon = String(d.getUTCMonth()+1).padStart(2,"0");
      const yr = d.getUTCFullYear();
      return `${day}/${mon}/${yr}`;
    }
  }
  return String(val);
}

function importThuChi(rows, type){
  let added=0, skipped=0;
  const txs=[...state.transactions];
  rows.forEach(r=>{
    const thang=(r["Tháng *"]||r["Tháng"]||"").toString().trim();
    const ngay=excelDateToStr(r["Ngày *"]||r["Ngày"]||"");
    const cat=(r["Danh Mục *"]||r["Danh Mục"]||"Khác").toString().trim();
    const amount=Number(r["Số Tiền (VND) *"]||r["Số Tiền (VND)"]||0);
    const note=(r["Ghi Chú"]||"").toString().trim();
    const nguoi=(r["Người Thực Hiện"]||"").toString().trim();
    const httt=(r["Hình Thức TT"]||"").toString().trim();
    if(!thang||!amount){skipped++;return;}
    txs.push({id:Date.now()+Math.random(),type,cat,amount,note,date:ngay,month:thang,nguoi,httt});
    added++;
  });
  ls_set("ta_tx",txs);
  // Sync lên Google Sheets
  const newItems=txs.slice(-added);
  if(newItems.length>0) apiPost({action:"batchThuChi",items:newItems}).catch(()=>{});
  setState({importing:false, transactions:txs, importResult:{type,added,skipped}});
}

function importLuong(rows){
  let added=0, skipped=0;
  const luongData={...state.luongData};
  rows.forEach(r=>{
    const thang=(r["Tháng *"]||r["Tháng"]||"").toString().trim();
    const username=(r["Tên ĐN *"]||r["Tên Đăng Nhập"]||"").toString().trim();
    const base=Number(r["Lương CB (VND) *"]||r["Lương CB (VND)"]||0);
    const bonus=Number(r["Thưởng (VND)"]||0);
    const phuCap=Number(r["Phụ Cấp (VND)"]||0);
    const khauTru=Number(r["Khấu Trừ (VND)"]||0);
    const note=(r["Ghi Chú"]||"").toString().trim();
    const status=(r["Trạng Thái"]||"Chưa thanh toán").toString().trim();
    const name=(r["Họ và Tên *"]||r["Họ và Tên"]||"").toString().trim();
    if(!thang||!username){skipped++;return;}
    const key=username+"__"+thang;
    luongData[key]={user:username,name,month:thang,base,bonus:bonus+phuCap,note,status,total:base+bonus+phuCap-khauTru};
    added++;
  });
  ls_set("ta_luong",luongData);
  // Sync lên Google Sheets
  const luongItems=Object.values(luongData).slice(-added);
  if(luongItems.length>0) apiPost({action:"batchLuong",items:luongItems}).catch(()=>{});
  setState({importing:false, luongData, importResult:{type:"luong",added,skipped}});
}

  } else if(type==="thu"){
    headers=["Tháng *","Ngày *","Danh Mục *","Số Tiền (VND) *","Ghi Chú","Người Thực Hiện","Hình Thức TT"];

      "Người Thực Hiện":t.nguoi||"","Hình Thức TT":t.httt||""
    }));
    filename="ThienAn_Thu.xlsx";
  } else if(type==="chi"){
    headers=["Tháng *","Ngày *","Danh Mục *","Số Tiền (VND) *","Ghi Chú","Người Thực Hiện","Hình Thức TT"];
    data=state.transactions.filter(t=>t.type==="chi").map(t=>({
      "Tháng *":t.month,"Ngày *":t.date,"Danh Mục *":t.cat,
      "Số Tiền (VND) *":t.amount,"Ghi Chú":t.note||"",
      "Người Thực Hiện":t.nguoi||"","Hình Thức TT":t.httt||""
    }));
    filename="ThienAn_Chi.xlsx";
  } else if(type==="luong"){
    headers=["Tháng *","Họ và Tên *","Tên ĐN *","Lương CB (VND) *","Thưởng (VND)","Khấu Trừ (VND)","Tổng Lương (VND)","Trạng Thái","Ghi Chú"];

      "Tháng *":l.month,"Họ và Tên *":l.name||"","Tên ĐN *":l.user,
      "Lương CB (VND) *":l.base,"Thưởng (VND)":l.bonus||0,"Khấu Trừ (VND)":0,
      "Tổng Lương (VND)":l.total||l.base,"Trạng Thái":l.status||"","Ghi Chú":l.note||""
    }));
    filename="ThienAn_Luong.xlsx";
  }
  // Add example row if empty
  if(data.length===0){
    const ex={};
    if(type==="nhansu") Object.assign(ex,{"Họ và Tên *":"Nguyễn Văn A","Tên Đăng Nhập *":"gv_piano","Mật Khẩu *":"piano2025","Bộ Môn *":"piano","Lương CB (VND) *":5000000});
    else if(type==="thu"||type==="chi") Object.assign(ex,{"Tháng *":"T7/2025","Ngày *":"01/07/2025","Danh Mục *":type==="thu"?"Học phí":"Thuê mặt bằng","Số Tiền (VND) *":type==="thu"?21500000:8000000,"Ghi Chú":"Ví dụ - xóa dòng này","Người Thực Hiện":"Thầy Ngọc Cương","Hình Thức TT":"Chuyển khoản"});
    else if(type==="luong") Object.assign(ex,{"Tháng *":"T7/2025","Họ và Tên *":"Nguyễn Văn A","Tên ĐN *":"gv_piano","Lương CB (VND) *":5000000,"Thưởng (VND)":0,"Khấu Trừ (VND)":0,"Tổng Lương (VND)":5000000,"Trạng Thái":"Chưa thanh toán","Ghi Chú":""});
    data=[ex];
  }
  const ws=XLSX.utils.json_to_sheet(data,{header:headers});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Data");
  XLSX.writeFile(wb,filename);
}

function loadStudents(){
  const saved = ls_get("ta_students");
  if(saved && saved.length > 0) return saved;
  // Lần đầu: lưu data mặc định vào localStorage
  ls_set("ta_students", DEFAULT_STUDENTS);
  return DEFAULT_STUDENTS;
}
function saveStudents(s){ ls_set("ta_students",s); }
function loadAttData(){ return ls_get("ta_attendance")||{}; }
function saveAttData(d){ ls_set("ta_attendance",d); }

function attKey(studentId, date, session){
  return studentId+"__"+date+"__"+session;
}

function markAttendance(studentId, status){
  const key = studentId+"__"+state.att_date+"__"+state.att_session;
  const current = loadAttData();
  // Toggle: nếu bấm lại trạng thái đang chọn thì bỏ
  if(current[key]?.status === status){
    delete current[key];
  } else {
    current[key] = {studentId, date:state.att_date, session:state.att_session, status, markedBy:state.user.name, markedAt:new Date().toISOString()};
  }
  saveAttData(current);
  // Sync Sheets
  syncGet({action:"saveAttendanceGet", key, studentId, date:state.att_date, session:state.att_session, status, markedBy:encodeURIComponent(state.user.name)});
  setState({att_data:current});
}

function getAttStatus(studentId){
  const key = studentId+"__"+state.att_date+"__"+state.att_session;
  return state.att_data[key]?.status || null;
}



function saveStudent(data){
  const students = loadStudents();
  if(data.id){
    const i = students.findIndex(s=>s.id===data.id);
    if(i>=0) students[i]={...students[i],...data};
    else students.push(data);
  } else {
    data.id = "hs_"+Date.now();
    students.push(data);
  }
  saveStudents(students);
  syncGet({action:"saveStudentGet", ...data, name:encodeURIComponent(data.name||""), note:encodeURIComponent(data.note||"")});
  return data;
}

function deleteStudent(id){
  if(!confirm("Xóa học sinh này?")) return;
  const students = loadStudents().filter(s=>s.id!==id);
  saveStudents(students);
  syncGet({action:"deleteStudentGet", id});
  setState({students});
}

// Tính thống kê điểm danh tháng
function getAttStats(studentId, month){
  const data = state.att_data;
  const keys = Object.keys(data).filter(k=>k.startsWith(studentId+"__")&&k.includes(month.replace("T","").replace("/","/")));
  let present=0, permAbsent=0, absent=0;
  keys.forEach(k=>{
    const s=data[k]?.status;
    if(s==="Đi học") present++;
    else if(s==="Nghỉ có phép") permAbsent++;
    else if(s==="Nghỉ không phép") absent++;
  });
  return {present, permAbsent, absent, total:keys.length};
}

function doImportStudents(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      let added=0;
      rows.forEach(r=>{
        const name=(r["Họ và Tên"]||r["Tên"]||"").toString().trim();
        if(!name)return;
        saveStudent({
          name, class:r["Bộ Môn"]||r["Lớp"]||"Piano",
          phone:(r["SĐT PH"]||r["Điện Thoại"]||"").toString(),
          startDate:"", note:(r["Ghi Chú"]||"").toString()
        });
        added++;
      });
      setState({students:loadStudents()});
      alert("✅ Đã import "+added+" học sinh!");
    }catch(err){alert("Lỗi đọc file: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

async function doLogin(){
  const inputUser = state.uname.trim().toLowerCase();
  const inputPass = state.upass.trim();
  // QUAN TRỌNG: Google Sheets trả tên/mật khẩu toàn số về dạng SỐ (123),
  // còn ô nhập luôn là CHỮ ("123") -> phải ép cùng kiểu, nếu không sẽ luôn báo sai mật khẩu.
  const norm = v => String(v==null?"":v).trim();
  const findUser = list => (Array.isArray(list)?list:[]).find(
    x => x && x.username!=null &&
         norm(x.username).toLowerCase()===inputUser &&
         norm(x.password)===inputPass);

  USERS = loadUsers();
  let u = findUser(USERS);

  // Chưa thấy trong máy -> HỎI GOOGLE SHEETS.
  // (Tài khoản giáo viên tạo ở máy khác chỉ nằm trên Sheets, máy này chưa có.)
  if(!u){
    setState({loginError:"⏳ Đang kiểm tra tài khoản..."});
    showLoading("Đang kiểm tra tài khoản…");
    try{
      await loadUsersFromSheets();
      await loadAdminOverride();
      USERS = loadUsers();
      u = findUser(USERS);
    }catch(e){ console.log("Kiểm tra tài khoản:",e); }
    hideLoading();
  }

  // CỬA HẬU: tài khoản quản trị gốc luôn đăng nhập được, kể cả khi bộ nhớ máy hỏng
  if(!u){
    u = DEFAULT_USERS.find(d => d.isAdmin && d.username.toLowerCase() === inputUser && d.password === inputPass);
    if(u){ USERS = [...USERS.filter(x=>x.username!==u.username), u]; saveUsers(USERS); }
  }

  if(u){
    enterApp(u);
  } else {
    setState({loginError:"Sai tên đăng nhập hoặc mật khẩu!"});
  }
}

function savePlan(){
  const plans=[...state.plans];
  const item={
    // GIỮ NGUYÊN ID khi sửa. (Trước đây luôn tạo ID mới -> Sheets tưởng là kế hoạch khác
    // nên thêm dòng mới, gây nhân đôi kế hoạch sau khi tải lại.)
    id: (state.editPlan!==null && state.editPlan!==undefined) ? state.editPlan : Date.now(),
    title:state.pf_title,
    month:state.pf_month,
    target:Number(state.pf_target)||0,
    actual:Number(state.pf_actual)||0,
    owner:state.pf_owner,
    status:state.pf_status,
    okrObj:state.pf_okr_obj,   // ID của Objective
    okrKr:state.pf_okr_kr,     // ID của Key Result
  };
  if(state.editPlan!==null && state.editPlan!==undefined){
    const key=String(state.editPlan);
    const i=plans.findIndex(p=>String(p.id)===key);
    if(i>=0) plans[i]={...plans[i],...item};
    else plans.unshift(item);
  }
  else plans.unshift(item);
  ls_set("ta_plans",plans);
  // Sync lên Google Sheets qua GET
  syncGet({action:"savePlanGet", id:item.id, title:item.title,
    month:item.month, target:item.target||"", actual:item.actual||"",
    owner:item.owner||"", status:item.status||"",
    okrObj:item.okrObj||"", okrKr:item.okrKr||""});
  if(!(state.editPlan!==null && state.editPlan!==undefined)){
    try{ postNotif("Giao việc mới", (item.title||"Công việc")+(item.owner?(" → "+item.owner):"")+(item.month?(" • "+item.month):""), "giaoviec"); }catch(e){}
  }
  setState({plans,showPlanForm:false,editPlan:null,pf_title:"",pf_target:"",pf_owner:"",pf_status:"Chưa bắt đầu"});
}

function saveUserForm(){
  const name=state.um_name.trim();
  // Làm sạch tên đăng nhập: bỏ khoảng trắng, chữ thường, bỏ dấu
  const username=state.um_username.trim().toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"");
  const password=state.um_password.trim();
  const role=state.um_role;
  const luong=Number(state.um_luong)||0;
  if(!name||!username||!password){setState({um_error:"Vui lòng điền đầy đủ họ tên, tên đăng nhập và mật khẩu!"});return}
  if(username.length<3){setState({um_error:"Tên đăng nhập phải có ít nhất 3 ký tự!"});return}
  let users=[...USERS];
  if(state.editingUser==="new"){
    if(users.find(u=>u.username===username)){setState({um_error:"Tên đăng nhập '"+username+"' đã tồn tại!"});return}
    users.push({username,password,name,role,isAdmin:false,luong});
  }else{
    const i=users.findIndex(u=>u.username===state.editingUser);
    if(i>=0)users[i]={...users[i],name,username,password,role,luong};
  }
  // Lưu vào localStorage ngay
  saveUsers(users);
  USERS = users;
  setState({showUserModal:false,editingUser:null,um_name:"",um_username:"",um_password:"",um_luong:0,um_error:"",
    um_success:"✅ Đã lưu! Đăng nhập: "+username+" / MK: "+password});
  // Sync lên Google Sheets để dùng được trên mọi thiết bị
  // Lưu lên Google Sheets qua GET
  const syncUrl = API_URL
    + "?action=saveUserGet"
    + "&username=" + encodeURIComponent(username)
    + "&password=" + encodeURIComponent(password)
    + "&name=" + encodeURIComponent(name)
    + "&role=" + encodeURIComponent(role)
    + "&isAdmin=false"
    + "&luong=" + (luong||0);
  fetch(syncUrl)
    .then(r=>r.json())
    .then(r=>{ console.log("✅ Synced to Sheets:", r); })
    .catch(e=>console.log("Sync error:", e));
}

let _notifUnsub=null;
function startNotifListener(){
  if(_notifUnsub) return;
  try{
    _notifUnsub = qldb.collection("ql_thongbao").onSnapshot(function(snap){
      var arr = snap.docs.map(function(d){ return d.data(); });
      arr.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
      state.notifs = arr.slice(0,100);
      if(state.screen==="app" && !anyModalOpen() && !isTypingNow()) render();
    }, function(err){ console.log("notif listener:", err); });
  }catch(e){ console.log("startNotifListener:", e); }
}

// Dùng doc ql_config/dailyReminder để chỉ đăng 1 lần/ngày dù nhiều máy cùng mở.
async function maybePostDailyReminder(){
  try{
    if(!qldb) return;
    var t=new Date();
    var ymd=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    var ref=qldb.collection("ql_config").doc("dailyReminder");
    var d=await ref.get();
    var last=d.exists?(d.data().date||""):"";
    if(last===ymd) return; // hôm nay đã nhắc rồi
    await ref.set({date:ymd}); // "xí chỗ" trước để tránh trùng
    var mon=(typeof currentMonth==="function")?currentMonth():"";
    var pend=(state.plans||[]).filter(function(p){
      return p && String(p.status||"").indexOf("Hoàn thành")<0 && (!p.month || p.month===mon);
    });
    if(!pend.length) return;
    var lines=pend.slice(0,12).map(function(p){ return "• "+(p.title||"Việc")+(p.owner?(" → "+p.owner):"")+(p.status?(" ["+p.status+"]"):""); });
    if(pend.length>12) lines.push("…và "+(pend.length-12)+" việc khác");
    await postNotif("📋 Việc cần làm hôm nay ("+t.getDate()+"/"+(t.getMonth()+1)+")", lines.join("\n"), "nhacviec");
  }catch(e){ console.log("dailyReminder:", e); }
}
async function postNotif(title, body, type){
  var rec={ id:"TB"+Date.now()+Math.floor(Math.random()*900+100), title:String(title||""), body:String(body||""), from:(state.user&&state.user.name)||"", type:type||"thongbao", date:new Date().toISOString() };
  try{ await qldb.collection("ql_thongbao").doc(rec.id).set(rec); }catch(e){ console.error("postNotif:", e); }
}
// ---- THÔNG BÁO ĐẨY (Web Push / FCM) ----
function pushReady(){ return !!(window.qlmsg && ("Notification" in window) && window.VAPID_KEY && String(window.VAPID_KEY).indexOf("PASTE")!==0); }
function pushStatus(){ if(!("Notification" in window)) return "unsupported"; return Notification.permission; } // default | granted | denied
async function enablePush(silent){
  try{
    if(!pushReady()){ if(!silent) alert("Chưa cấu hình khóa VAPID trên Firebase (xem hướng dẫn). Thông báo đẩy chưa bật được."); return; }
    var perm = Notification.permission;
    if(perm!=="granted"){ perm = await Notification.requestPermission(); }
    if(perm!=="granted"){ if(!silent) alert("Bạn chưa cho phép thông báo. Vào Cài đặt trình duyệt để bật lại."); return; }
    var reg=null;
    try{ reg = await navigator.serviceWorker.register("firebase-messaging-sw.js"); }catch(e){ console.log("SW messaging:", e&&e.message); }
    var token = await qlmsg.getToken({ vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg||undefined });
    if(token){
      await qldb.collection("ql_pushtokens").doc(token).set({ token:token, user:(state.user&&state.user.username)||"", name:(state.user&&state.user.name)||"", date:new Date().toISOString() });
      if(!silent) alert("✅ Đã bật thông báo đẩy trên máy này.");
      if(state.showNotifPanel) render();
    }
  }catch(e){ console.log("enablePush:", e&&e.message); if(!silent) alert("Lỗi bật thông báo: "+(e&&e.message||"")); }
}
function initForegroundPush(){
  try{
    if(!window.qlmsg) return;
    qlmsg.onMessage(function(payload){
      var n=(payload&&payload.notification)||{};
      if(("Notification" in window) && Notification.permission==="granted"){
        try{ new Notification(n.title||"Thông báo Thiên Ân", {body:n.body||"", icon:"icon-192.png"}); }catch(e){}
      }
    });
  }catch(e){}
  // Nếu đã cho phép trước đó → làm mới token ngầm
  try{ if(pushStatus()==="granted") enablePush(true); }catch(e){}
}

function notifTimeAgo(iso){
  var t=new Date(iso||0).getTime(); if(!t) return "";
  var s=Math.floor((Date.now()-t)/1000);
  if(s<60) return "vừa xong";
  if(s<3600) return Math.floor(s/60)+" phút trước";
  if(s<86400) return Math.floor(s/3600)+" giờ trước";
  var d=new Date(t); return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
}

window.maOpen=function(){ setState({showMyAccount:true}); };
window.maClose=function(){ setState({showMyAccount:false}); };
window.maSave=async function(btn){
  const err=document.getElementById("ma-err");
  const nu=(document.getElementById("ma-user").value||"").trim().toLowerCase();
  const np=(document.getElementById("ma-pass").value||"").trim();
  const np2=(document.getElementById("ma-pass2").value||"").trim();
  const cur=state.user||{};
  if(!nu){ err.textContent="Vui lòng nhập tên đăng nhập."; return; }
  if(/\s/.test(nu)){ err.textContent="Tên đăng nhập không được có dấu cách."; return; }
  if(np){ if(np.length<4){ err.textContent="Mật khẩu tối thiểu 4 ký tự."; return; } if(np!==np2){ err.textContent="Mật khẩu nhập lại không khớp."; return; } }
  const rec={ username:nu, password:String(np?np:(cur.password||"")), name:cur.name||"Thầy Ngọc Cương" };
  if(btn){ btn.disabled=true; btn.textContent="Đang lưu…"; }
  try{
    await qldb.collection("ql_config").doc("admin").set(rec);
    ls_set("ta_admin_override", rec);
    USERS = loadUsers();
    if(state.user){ state.user.username=rec.username; state.user.password=rec.password; }
    setState({showMyAccount:false});
    alert("✅ Đã cập nhật tài khoản.\nTên đăng nhập mới: "+nu+(np?"\nMật khẩu đã đổi.":""));
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="Lưu"; }
    err.textContent="Lỗi lưu: "+e.message+" (kiểm tra quyền ql_config trên Firebase)";
  }
};

function getKRTotal(krId){
  try{
    const plans = state.plans || [];
    const planTotal = plans
      .filter(p=>p.okrKr===krId)
      .reduce((s,p)=>s+Number(p.actual||0),0);
    const manualActual = (state.actuals||{})[krId]?.actual||0;
    return planTotal > 0 ? planTotal : manualActual;
  }catch(e){ return (state.actuals||{})[krId]?.actual||0; }
}

function renderPlan(){
  const plans=state.plans.filter(p=>!state.month||p.month===state.month);
  const statusColor={
    "Hoàn thành":"#27AE60","Đang thực hiện":"#E67E22",
    "Chưa bắt đầu":"#aaa","Bị trễ":"#E74C3C"
  };

  // Tính tổng actual cho từng KR từ các kế hoạch
  function getKRActualFromPlans(krId){
    return state.plans
      .filter(p=>p.okrKr===krId && p.actual)
      .reduce((s,p)=>s+Number(p.actual||0),0);
  }

  return`
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <select id="msel" style="border:2px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700">

    ${state.user.isAdmin?`<button class="btn-success" id="btnAddPlan" style="font-size:12px;padding:6px 14px">➕ Thêm kế hoạch</button>`:""}

    <button class="btn-sm btn-gold" id="btnRefreshTab" style="font-size:11px;padding:5px 10px">🔄 Làm mới</button>
  </div>

  <!-- Tóm tắt liên kết OKR -->
  ${OBJECTIVES.some(o=>o.krs.some(kr=>state.plans.some(p=>p.okrKr===kr.id)))?`
  <div class="card" style="margin-bottom:14px">
    <div class="card-head"><span class="card-head-title">🎯 Tiến độ KH → OKR</span></div>
    ${OBJECTIVES.map(obj=>{
      const linkedKRs = obj.krs.filter(kr=>state.plans.some(p=>p.okrKr===kr.id));
      if(!linkedKRs.length) return "";
      return`<div style="padding:10px 18px;border-bottom:1px solid #F5F5F5">
        <div style="font-size:12px;font-weight:700;color:#1A1A2E;margin-bottom:8px">${obj.icon} ${obj.title}</div>
        ${linkedKRs.map(kr=>{
          const planActual = getKRActualFromPlans(kr.id);
          const p = Math.min(Math.round((planActual/kr.target)*100),100);
          const st = stInfo(p);
          const linkedPlans = state.plans.filter(pl=>pl.okrKr===kr.id);
          return`<div style="margin-bottom:8px;padding:8px;background:#F8F9FA;border-radius:8px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-size:11px;color:#888;flex:1">KR: ${kr.text} (MT: ${kr.target} ${kr.unit})</span>
              <span style="font-size:13px;font-weight:800;color:${st.color}">${planActual}/${kr.target} ${kr.unit} (${p}%)</span>
            </div>
            <div style="background:#F0F0F0;border-radius:4px;height:6px;margin-bottom:6px">
              <div style="width:${p}%;height:100%;background:${st.color};border-radius:4px"></div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${linkedPlans.map(pl=>`<span style="font-size:10px;background:#fff;border:1px solid #ddd;border-radius:4px;padding:2px 6px;color:#555">
                ${pl.title}: <b>${pl.actual||0}</b> ${kr.unit}

            </div>
          </div>`;
        }).join("")}
      </div>`;
    }).join("")}

  <!-- Danh sách kế hoạch -->
  <div class="card">
    ${plans.length===0?`<div style="padding:32px;text-align:center;color:#aaa">Chưa có kế hoạch nào ${state.month?"cho "+state.month:""}. ${state.user.isAdmin?"Bấm ➕ Thêm kế hoạch.":""}</div>`:""}
    ${plans.map(p=>{
      // Tìm KR được gắn
      let krInfo = null;
      if(p.okrKr){
        OBJECTIVES.forEach(o=>{
          const kr=o.krs.find(k=>k.id===p.okrKr);
          if(kr) krInfo={obj:o, kr};
        });
      }
      const pct = p.target>0?Math.min(Math.round((Number(p.actual||0)/Number(p.target))*100),100):0;
      const st = stInfo(pct);
      return`<div class="plan-item card-pad" style="padding:12px 18px">
        <div class="plan-status" style="background:${statusColor[p.status]||"#aaa"}"></div>

        </div>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

// ===== THU CHI =====
function renderThuChi(){
  const isAll = !!state.txViewAll;
  // Mới nhập nhất lên đầu (id = thời điểm nhập)
  const allTxs = (isAll ? [...state.transactions] : state.transactions.filter(t=>t.month===state.month))
    .sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0));
  const totalThu=allTxs.filter(t=>t.type==="thu").reduce((s,t)=>s+Number(t.amount||0),0);
  const totalChi=allTxs.filter(t=>t.type==="chi").reduce((s,t)=>s+Number(t.amount||0),0);
  const loiNhuan=totalThu-totalChi;

  // ---- Phân trang ----
  const pageSize=20;
  const total=allTxs.length;
  const totalPages=Math.max(1,Math.ceil(total/pageSize));
  const page=Math.min(Math.max(1,state.txPage||1),totalPages);
  const pageTxs=allTxs.slice((page-1)*pageSize, page*pageSize);
  const startIdx=total===0?0:(page-1)*pageSize+1;
  const endIdx=Math.min(page*pageSize,total);

  // Nút số trang (cửa sổ quanh trang hiện tại)
  const nums=[]; const win=2;
  const wStart=Math.max(1,page-win), wEnd=Math.min(totalPages,page+win);
  if(wStart>1){ nums.push(1); if(wStart>2) nums.push("…"); }
  for(let i=wStart;i<=wEnd;i++) nums.push(i);
  if(wEnd<totalPages){ if(wEnd<totalPages-1) nums.push("…"); nums.push(totalPages); }
  const pbtn=(label,pg,disabled,active)=>`<button class="tx-page-btn" data-page="${pg}" ${disabled?"disabled":""} style="min-width:32px;padding:5px 10px;border-radius:6px;border:1px solid ${active?"#1A1A2E":"#E5E7EB"};background:${active?"#1A1A2E":"#fff"};color:${disabled?"#ccc":active?"#fff":"#333"};font-weight:700;font-size:12px;cursor:${disabled?"default":"pointer"}">${label}</button>`;
  const numBtns=nums.map(n=> n==="…" ? `<span style="padding:4px 4px;color:#aaa">…</span>` : pbtn(n,n,false,n===page)).join("");
  const pager = totalPages>1 ? `
    <div style="display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 8px">
      ${pbtn("‹ Trước",page-1,page<=1,false)}
      ${numBtns}
      ${pbtn("Sau ›",page+1,page>=totalPages,false)}
    </div>` : "";

  const title = isAll ? "Tất cả các tháng" : state.month;

  return`
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <select id="tcmsel" style="border:2px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700">
      <option value="__all__"${isAll?" selected":""}>📅 Tất cả các tháng</option>
      ${MONTHS.map(m=>`<option value="${m}"${(!isAll&&m===state.month)?" selected":""}>${m}</option>`).join("")}
    </select>
    <button class="btn-success" id="btnAddThu" style="font-size:12px;padding:6px 14px">➕ Thêm thu</button>
    <button class="btn-danger" id="btnAddChi" style="font-size:12px;padding:6px 14px;background:#FDEDEC;color:#E74C3C">➕ Thêm chi</button>
    <button class="btn-sm btn-gold" id="btnRefreshTab" style="font-size:11px;padding:5px 10px">🔄 Làm mới</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" style="color:#27AE60">${fmtM(totalThu)}</div><div class="stat-lbl">💰 Tổng thu</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#E74C3C">${fmtM(totalChi)}</div><div class="stat-lbl">💸 Tổng chi</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${loiNhuan>=0?"#27AE60":"#E74C3C"}">${fmtM(loiNhuan)}</div><div class="stat-lbl">${loiNhuan>=0?"📈 Lãi":"📉 Lỗ"}</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-head-title">📋 Chi tiết giao dịch ${title}</span>
      <span class="card-head-sub">${total>0?`${startIdx}–${endIdx} / ${total} giao dịch`:""}</span>
    </div>
    ${total===0?`<div style="padding:32px;text-align:center;color:#aaa">Chưa có giao dịch nào</div>`:""}
    <table class="tbl">
      ${total>0?`<tr><th>Ngày</th><th>Loại</th><th>Danh mục</th><th>Số tiền</th><th>Ghi chú</th>${isAll?"<th>Tháng</th>":""}<th></th></tr>`:""}
      ${pageTxs.map(t=>`<tr>
        <td style="color:#888;font-size:11px">${fmtDate(t.date)}</td>
        <td><span class="badge" style="background:${t.type==="thu"?"#E8F8F0":"#FDEDEC"};color:${t.type==="thu"?"#27AE60":"#E74C3C"}">${t.type==="thu"?"↑ Thu":"↓ Chi"}</span></td>
        <td style="font-size:12px">${t.cat}</td>
        <td style="font-weight:700;color:${t.type==="thu"?"#27AE60":"#E74C3C"}">${t.type==="thu"?"+":"−"}${fmtMoney(t.amount)}</td>
        <td style="font-size:11px;color:#888">${t.note||"-"}</td>
        ${isAll?`<td style="font-size:11px;color:#888">${t.month||"-"}</td>`:""}
        <td><div style="display:flex;gap:4px">
          <button class="btn-edit" data-edittx="${t.id}">✏️</button>
          <button class="btn-danger" data-deltx="${t.id}">🗑️</button>
        </div></td>
      </tr>`).join("")}
    </table>
    ${pager}
  </div>`;
}

function khoMoney(n){ return (Number(n)||0).toLocaleString('vi-VN')+"đ"; }
function khoDate(x){ if(!x) return ""; var p=String(x).split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):String(x); }
function khoToday(){ return new Date().toISOString().slice(0,10); }
function khoTon(spId){ var n=0; (state.kho_tx||[]).forEach(function(t){ if(t.spId===spId){ if(t.type==="nhap") n+=Number(t.qty)||0; else n-=Number(t.qty)||0; } }); return n; }
function khoLow(sp){ var min=Number(sp.tonMin)||0; return khoTon(sp.id) <= min; }
async function loadKho(showToast){
  try{ if(showToast&&window.showLoading) showLoading("Đang tải…");
    var a=await qldb.collection("ql_sanpham").get(); state.kho_sp=a.docs.map(function(d){return d.data();});
    var b=await qldb.collection("ql_khohang").get(); state.kho_tx=b.docs.map(function(d){return d.data();});
    if((state.tab==="kho"||state.tab==="home")&&!state.showSPModal&&!state.showKhoModal) render();
    if(showToast&&window.doneLoading) doneLoading("Đã cập nhật ✓");
  }catch(e){ if(window.hideLoading)hideLoading(); console.error("loadKho",e); }
}
function khoLowCount(){ return (state.kho_sp||[]).filter(khoLow).length; }
function renderKho(){
  var v=state.kho_view||"ton";
  var tb=function(id,label){ return '<button class="btn-sm" style="background:'+(v===id?'#0F3460':'#EEF1F8')+';color:'+(v===id?'#fff':'#334')+';font-weight:700;font-size:12.5px;padding:8px 15px" onclick="khoSetView(\''+id+'\')">'+label+'</button>'; };
  return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">'
    + tb("ton","📊 Tồn kho") + tb("tx","🔄 Nhập / Xuất")
    + '<div style="flex:1"></div>'
    + '<button class="btn-sm btn-gold" style="font-size:11px;padding:7px 10px" onclick="loadKho(true)">🔄</button></div>'
    + (v==="ton"?renderKhoTon():renderKhoTx());
}
function renderKhoTon(){
  var admin=state.user&&state.user.isAdmin;
  var sps=(state.kho_sp||[]).slice();
  var f=state.kho_filter||"all";
  var list = f==="all"?sps : (f==="low"?sps.filter(khoLow):sps.filter(function(s){return s.cat===f;}));
  list=list.slice().sort(function(a,b){return String(a.name||"").localeCompare(String(b.name||""));});
  var totalVal=0, totalQty=0; sps.forEach(function(s){ var t=khoTon(s.id); totalQty+=t; totalVal+=t*(Number(s.giaNhap)||0); });

function khoGuessCat(name,unit){
  var n=(name||"").toLowerCase(), u=(unit||"").toLowerCase();
  if(u==="bộ") return "Phụ kiện";
  if(n.indexOf("guitar")>=0) return "Guitar";
  if(n.indexOf("organ")>=0) return "Organ";
  if(n.indexOf("trống")>=0||n.indexOf("drum")>=0) return "Trống";
  if(n.indexOf("piano")>=0){ if(/roland|kỹ thuật số|digital|hp\d|rp-|kr\d|casio|clp|ydp|dgx|kỹ thuật|điện/.test(n)) return "Piano điện"; return "Piano cơ Nhật"; }
  if(/dây|bao|chân|ghế|adaptor|pedal|phụ kiện|thiết bị|capo|pick|tuner|máy/.test(n)) return "Phụ kiện";
  return "Khác";
}
async function khoBatchSet(coll, arr){
  for(var i=0;i<arr.length;i+=400){
    var batch=qldb.batch();
    arr.slice(i,i+400).forEach(function(o){ batch.set(qldb.collection(coll).doc(o.id), o); });
    await batch.commit();
  }
}
window.khoImportExcel=function(){
  if(typeof XLSX==="undefined"){ alert("Thư viện đọc Excel chưa tải xong, thử lại sau vài giây."); return; }
  var inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls";
  inp.onchange=async function(e){
    var file=e.target.files&&e.target.files[0]; if(!file) return;
    try{
      if(window.showLoading) showLoading("Đang đọc Excel…");
      var data=await file.arrayBuffer();
      var wb=XLSX.read(data,{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      var prods=[], txs=[], seen={};
      for(var i=0;i<aoa.length;i++){
        var r=aoa[i]||[];
        var sku=(r[1]!=null?String(r[1]):"").trim();
        var name=(r[2]!=null?String(r[2]):"").trim();
        var unit=(r[3]!=null?String(r[3]):"").trim();
        var qty=Number(r[4])||0;
        var val=Number(r[5])||0;
        if(!sku||!name) continue;
        if(sku.toLowerCase().indexOf("số dòng")>=0||name.toLowerCase().indexOf("mã hàng")>=0) continue;
        var key=sku.replace(/[^A-Za-z0-9]/g,"_"); if(seen[key]) continue; seen[key]=1;
        var cost=qty>0?Math.round(val/qty):0;
        var spId="SP_"+key;
        prods.push({id:spId,name:name,cat:khoGuessCat(name,unit),sku:sku,unit:unit||"cái",tonMin:1,giaNhap:cost,giaBan:0,created:new Date().toISOString()});
        if(qty>0) txs.push({id:"KXINIT_"+key,type:"nhap",spId:spId,spName:name,qty:qty,price:cost,date:"2026-07-26",partner:"Tồn đầu kỳ",note:"Import Excel",by:(state.user&&state.user.name)||"",created:new Date().toISOString()});
      }
      if(window.hideLoading)hideLoading();
      if(!prods.length){ alert("Không tìm thấy dòng sản phẩm hợp lệ. Đúng file 'Tổng hợp tồn kho' chưa?"); return; }
      if(!confirm("Tìm thấy "+prods.length+" sản phẩm ("+txs.length+" mã còn tồn).\nNhập vào app? Chạy lại sẽ CẬP NHẬT, không nhân đôi.")) return;
      if(window.showLoading) showLoading("Đang nhập "+prods.length+" sản phẩm…");
      await khoBatchSet("ql_sanpham",prods);
      await khoBatchSet("ql_khohang",txs);
      var spMap={}; (state.kho_sp||[]).forEach(function(x){spMap[x.id]=x;}); prods.forEach(function(p){spMap[p.id]=p;}); state.kho_sp=Object.keys(spMap).map(function(k){return spMap[k];});
      var txMap={}; (state.kho_tx||[]).forEach(function(x){txMap[x.id]=x;}); txs.forEach(function(t){txMap[t.id]=t;}); state.kho_tx=Object.keys(txMap).map(function(k){return txMap[k];});
      if(window.doneLoading) doneLoading("Đã nhập "+prods.length+" sản phẩm ✓"); render();
    }catch(err){ if(window.hideLoading)hideLoading(); alert("Lỗi đọc Excel: "+(err&&err.message?err.message:err)); }
  };
  inp.click();
};

    var wb=XLSX.utils.book_new();

function bhDate(x){ if(!x) return "—"; const d=(x instanceof Date)?x:new Date(x); if(isNaN(d)) return String(x); return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }
function bhMoney(n){ return (Number(n)||0).toLocaleString('vi-VN')+"đ"; }
function bhInfo(r){
  if(!r.ngayBan||!r.hanBH) return {status:"—", color:"#888", bg:"#F0F0F0", expDate:null, days:null};
  const d=new Date(r.ngayBan); d.setMonth(d.getMonth()+Number(r.hanBH));
  const days=Math.ceil((d-new Date())/86400000);
  if(days<0) return {status:"Hết hạn", color:"#E74C3C", bg:"#FDEDEC", expDate:d, days};
  if(days<=30) return {status:"Sắp hết ("+days+" ngày)", color:"#E67E22", bg:"#FEF9E7", expDate:d, days};
  return {status:"Còn BH", color:"#27AE60", bg:"#E8F8F0", expDate:d, days};
}
async function loadBaoHanh(showToast){

    if((state.tab==="baohanh"||state.tab==="home")&&!state.showBHModal&&!state.showBHServiceModal) render();
    if(showToast&&window.doneLoading) doneLoading("Đã cập nhật ✓");

}

async function migrateOKRToFirebase(){
  if(!(state.user&&state.user.isAdmin)) return;
  if(!confirm("Đưa toàn bộ OKR hiện tại (Objective + KR + số các quý) lên Firebase?\nGhi vào ql_objectives / ql_actuals — KHÔNG đụng app Học sinh.")) return;
  try{
    showLoading("Đang kết nối Firebase…");
    await ensureFirebase();
    showLoading("Đang đưa Objective lên Firebase…");
    for(let i=0;i<OBJECTIVES.length;i++){
      const o=OBJECTIVES[i];
      await qldb.collection("ql_objectives").doc(String(o.id)).set({
        id:o.id, icon:o.icon||"🎯", title:o.title, order:i+1,
        krs:(o.krs||[]).map(k=>({id:k.id,text:k.text,unit:k.unit||"",target:Number(k.target)||0,ownerRole:k.ownerRole||""}))
      });
    }
    showLoading("Đang đưa số thực tế…");
    let na=0;
    let all=null;
    try{ all=await apiGet({action:"getAllActuals"}); }catch(e){}
    const isMap = all && typeof all==="object" && !all.error && Object.keys(all).some(k=>/^Q\d\/\d{4}$/.test(k));
    if(isMap){
      // Backend hỗ trợ getAllActuals -> lấy hết trong 1 lần (nhanh)
      for(const q of Object.keys(all)){
        for(const krId of Object.keys(all[q])){
          const rec=all[q][krId];
          const val=(rec&&rec.actual!=null)?rec.actual:rec;
          await qldb.collection("ql_actuals").doc(q.replace(/\//g,"-")+"__"+krId).set({quarter:q,krId:krId,actual:Number(val)||0});
          na++;
        }
      }
    } else {
      // Dự phòng: chỉ quét các quý gần đây (năm nay ±1) để không gọi 36 lần
      const yr=new Date().getFullYear();
      const qs=[]; for(let y=yr-1;y<=yr+1;y++) for(let n=1;n<=4;n++) qs.push("Q"+n+"/"+y);
      for(const q of qs){
        let data={};
        try{ data=await apiGet({action:"getActuals",quarter:q})||{}; }catch(e){}
        for(const krId of Object.keys(data)){
          const rec=data[krId];
          const val=(rec&&rec.actual!=null)?rec.actual:rec;
          await qldb.collection("ql_actuals").doc(q.replace(/\//g,"-")+"__"+krId).set({quarter:q,krId:krId,actual:Number(val)||0});
          na++;
        }
      }
    }
    doneLoading("Đã đưa "+OBJECTIVES.length+" Objective + "+na+" số lên Firebase ✓");
  }catch(e){ hideLoading(); alert("Lỗi khi đưa lên Firebase: "+(e&&e.message?e.message:e)); }
}
async function loadObjectivesFromSheets(){  try{ const d=await apiGet({action:"getObjectives"}); if(d&&Array.isArray(d.objectives)&&d.objectives.length){ OBJECTIVES=d.objectives; ls_set("ta_objectives",d.objectives); if(state.tab==="okr"&&!state.showOKREditor&&!state.okr_editKR) render(); } }catch(e){}

// Làm mới dữ liệu của tab đang mở (không cần đăng xuất)
function refreshCurrentTab(){
  const t=state.tab; showLoading("Đang làm mới…");
  const jobs=[];
  if(t==="okr"){ jobs.push(loadActuals()); jobs.push(loadObjectivesFromSheets()); }
  else if(t==="plan"){ jobs.push(loadPlansFromSheets()); jobs.push(loadActuals()); }
  else if(t==="luong"){ jobs.push(loadLuongFromSheets(state.month)); }
  else if(t==="thuchi"){ jobs.push(loadThuChiFromSheets("")); }
  else if(t==="users"){ jobs.push(loadUsersFromSheets()); }
  else if(t==="lotrinh"){ jobs.push(loadLoTrinhFromSheets()); }
  else if(t==="baocao"){ jobs.push(loadActuals()); jobs.push(loadAllFromSheets()); }
  else { jobs.push(loadAllFromSheets()); }
  Promise.all(jobs.map(p=>Promise.resolve(p))).then(()=>{ render(); doneLoading("Đã cập nhật ✓"); }).catch(()=>hideLoading());
}

/* ============================================================
   MODULE: CHẤM CÔNG & BẢNG LƯƠNG (Mẫu 02-LĐTL) — ql_chamcong
   ============================================================ */
const CC_BOPHAN=["BP Dạy học","BP Quản lý"];
const CC_STATUS={X:{lb:"X",bg:"#2E7D32",fg:"#fff",cong:1},N:{lb:"",bg:"#F3F4F6",fg:"#999",cong:0},NT:{lb:"NT",bg:"#29B6F6",fg:"#fff",cong:0},P:{lb:"P",bg:"#FFB300",fg:"#fff",cong:0}};
const CC_CYCLE=["X","N","NT","P"];
function ccDaysInMonth(ym){const p=ym.split("-").map(Number);return new Date(p[0],p[1],0).getDate();}
function ccPrevYM(ym){let p=ym.split("-").map(Number);p[1]--;if(p[1]<1){p[1]=12;p[0]--;}return p[0]+"-"+String(p[1]).padStart(2,"0");}
function ccNextYM(ym){let p=ym.split("-").map(Number);p[1]++;if(p[1]>12){p[1]=1;p[0]++;}return p[0]+"-"+String(p[1]).padStart(2,"0");}
function ccMonthLabel(ym){const p=ym.split("-");return "Tháng "+String(Number(p[1])).padStart(2,"0")+" năm "+p[0];}
function ccMoney(n){return (Math.round(Number(n)||0)).toLocaleString("vi-VN");}
function ccRound1k(n){return Math.round((Number(n)||0)/1000)*1000;}
function ccDow(ym,day){const p=ym.split("-").map(Number);return new Date(p[0],p[1]-1,day).getDay();} // 0=CN
function ccDefaultDays(ym){const nd=ccDaysInMonth(ym),o={};for(let d=1;d<=nd;d++)o[d]=(ccDow(ym,d)===0)?"N":"X";return o;}
function ccDoc(ym){ym=ym||state.ccYM;return state.ccData[ym]||{month:ym,rows:[]};}
function ccNgayCong(row){let c=0;const days=row.days||{};for(const k in days){if((CC_STATUS[days[k]]||{}).cong)c++;}return c;}
function ccUID(){return "e"+Date.now()+Math.floor(Math.random()*900+100);}

async function loadChamCong(ym,showToast){
  ym=ym||state.ccYM;
  try{ if(showToast&&window.showLoading) showLoading("Đang tải…");
    const d=await qldb.collection("ql_chamcong").doc(ym).get();
    state.ccData[ym]=d.exists?d.data():{month:ym,rows:[]};
    if((state.tab==="chamcong"||state.tab==="home")&&!state.showCCEmp) render();
    if(showToast&&window.doneLoading) doneLoading("Đã cập nhật ✓");
  }catch(e){ if(window.hideLoading)hideLoading(); console.error("loadChamCong",e); }
}
async function ccSave(ym){
  ym=ym||state.ccYM; const doc=ccDoc(ym); doc.month=ym; state.ccData[ym]=doc;
  try{ await qldb.collection("ql_chamcong").doc(ym).set(JSON.parse(JSON.stringify(doc))); }
  catch(e){ console.error("ccSave",e); alert("Lỗi lưu chấm công: "+e.message); }
}

function ccCalcRow(r){
  const cong=ccNgayCong(r);
  const cb=Number(r.luongcb)||0;
  const tt=cb; // Lương thực tế = Lương cơ bản (giữ nguyên theo bảng của Thầy)
  const bhxh=tt*0.08, bhyt=tt*0.015, bhtn=tt*0.01;
  const thue=Number(r.thue)||0;
  const congkt=bhxh+bhyt+bhtn+thue;
  const linh=ccRound1k(tt-congkt);
  return {cong,cb,tt,bhxh,bhyt,bhtn,thue,congkt,linh};
}

  <div style="font-size:11px;color:#999;margin-top:8px">Sửa <b>Lương cơ bản</b> và <b>Thuế TNCN</b> trực tiếp trên bảng (tự lưu). BHXH/BHYT/BHTN và Thực lĩnh tự tính. Ngày công lấy từ tab Chấm công.</div>`;
}

/* ---------- MODAL: thêm/sửa nhân viên ---------- */
function renderCCEmpModal(){
  const opts=CC_BOPHAN.map(b=>`<option value="${b}" ${state.cc_e_bophan===b?'selected':''}>${b}</option>`).join("");
  return `<div class="modal-bg" onmousedown="if(event.target===this)ccCloseEmp()">
    <div class="modal" style="max-width:420px">
      <h3 style="margin:0 0 14px">${state.cc_e_id?'✏️ Sửa nhân viên':'➕ Thêm nhân viên'}</h3>
      <label style="font-size:12px;font-weight:700;color:#555">Họ và tên</label>
      <input id="cceName" value="${(state.cc_e_name||'').replace(/"/g,'&quot;')}" style="width:100%;border:2px solid #E5E7EB;border-radius:8px;padding:8px 10px;margin:4px 0 10px"/>
      <label style="font-size:12px;font-weight:700;color:#555">Chức vụ</label>
      <input id="cceChucvu" value="${(state.cc_e_chucvu||'').replace(/"/g,'&quot;')}" placeholder="VD: Giáo viên, NV hành chính…" style="width:100%;border:2px solid #E5E7EB;border-radius:8px;padding:8px 10px;margin:4px 0 10px"/>
      <label style="font-size:12px;font-weight:700;color:#555">Bộ phận</label>
      <select id="cceBophan" style="width:100%;border:2px solid #E5E7EB;border-radius:8px;padding:8px 10px;margin:4px 0 10px">${opts}</select>
      <label style="font-size:12px;font-weight:700;color:#555">Lương cơ bản (₫)</label>
      <input id="cceLuong" value="${ccMoney(state.cc_e_luongcb||0)}" style="width:100%;border:2px solid #E5E7EB;border-radius:8px;padding:8px 10px;margin:4px 0 14px;text-align:right"/>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-sm" style="background:#EEF1F8;color:#333;padding:8px 16px" onclick="ccCloseEmp()">Hủy</button>
        <button class="btn-success" style="padding:8px 18px" onclick="ccSaveEmp()">Lưu</button>
      </div>
    </div>
  </div>`;
}

/* ---------- WINDOW HANDLERS ---------- */
window.ccSetView=function(v){setState({ccView:v});};
window.ccGoMonth=function(dir){const ym=dir>0?ccNextYM(state.ccYM):ccPrevYM(state.ccYM);state.ccYM=ym;if(!state.ccData[ym]){loadChamCong(ym);}render();};
window.ccToggleDay=function(id,d){const doc=ccDoc(state.ccYM);const r=(doc.rows||[]).find(x=>x.id===id);if(!r)return;r.days=r.days||{};const cur=r.days[d]||"N";const i=CC_CYCLE.indexOf(cur);r.days[d]=CC_CYCLE[(i+1)%CC_CYCLE.length];state.ccData[state.ccYM]=doc;render();ccSave(state.ccYM);};
window.ccFillRow=function(id){const ym=state.ccYM,doc=ccDoc(ym),r=(doc.rows||[]).find(x=>x.id===id);if(!r)return;r.days=ccDefaultDays(ym);state.ccData[ym]=doc;render();ccSave(ym);};
window.ccOpenEmp=function(id){const doc=ccDoc(state.ccYM);const r=id?(doc.rows||[]).find(x=>x.id===id):null;setState({showCCEmp:true,cc_e_id:id||null,cc_e_name:r?r.name:"",cc_e_chucvu:r?r.chucvu:"",cc_e_bophan:r?(r.bophan||"BP Dạy học"):"BP Dạy học",cc_e_luongcb:r?r.luongcb:4730000});};
window.ccCloseEmp=function(){setState({showCCEmp:false,cc_e_id:null});};
window.ccSaveEmp=function(){
  const name=(document.getElementById("cceName").value||"").trim();
  const chucvu=(document.getElementById("cceChucvu").value||"").trim();
  const bophan=document.getElementById("cceBophan").value;
  const luongcb=Number((document.getElementById("cceLuong").value||"").replace(/[^\d]/g,""))||0;
  if(!name){alert("Nhập họ tên");return;}
  const ym=state.ccYM,doc=ccDoc(ym);doc.rows=doc.rows||[];
  if(state.cc_e_id){const r=doc.rows.find(x=>x.id===state.cc_e_id);if(r){r.name=name;r.chucvu=chucvu;r.bophan=bophan;r.luongcb=luongcb;}}
  else{doc.rows.push({id:ccUID(),name,chucvu,bophan,luongcb,thue:0,days:ccDefaultDays(ym)});}
  state.ccData[ym]=doc;setState({showCCEmp:false,cc_e_id:null});ccSave(ym);
};
window.ccDelEmp=function(id){const doc=ccDoc(state.ccYM);const r=(doc.rows||[]).find(x=>x.id===id);if(!confirm("Xóa nhân viên "+((r&&r.name)||"")+" khỏi tháng này?"))return;doc.rows=(doc.rows||[]).filter(x=>x.id!==id);state.ccData[state.ccYM]=doc;render();ccSave(state.ccYM);};
window.ccSetCB=function(id,val){const doc=ccDoc(state.ccYM);const r=(doc.rows||[]).find(x=>x.id===id);if(!r)return;r.luongcb=Number(String(val).replace(/[^\d]/g,""))||0;state.ccData[state.ccYM]=doc;render();ccSave(state.ccYM);};
window.ccSetThue=function(id,val){const doc=ccDoc(state.ccYM);const r=(doc.rows||[]).find(x=>x.id===id);if(!r)return;r.thue=Number(String(val).replace(/[^\d]/g,""))||0;state.ccData[state.ccYM]=doc;render();ccSave(state.ccYM);};
window.ccCopyPrev=function(){
  const ym=state.ccYM,prev=ccPrevYM(ym);
  const go=(prevDoc)=>{const rows=(prevDoc&&prevDoc.rows)||[];if(!rows.length){alert("Tháng trước ("+ccMonthLabel(prev)+") chưa có dữ liệu.");return;}
    if((ccDoc(ym).rows||[]).length && !confirm("Tháng này đã có dữ liệu. Ghi đè bằng danh sách nhân viên tháng trước?"))return;
    const doc={month:ym,rows:rows.map(r=>({id:ccUID(),name:r.name,chucvu:r.chucvu,bophan:r.bophan,luongcb:r.luongcb,thue:0,days:ccDefaultDays(ym)}))};
    state.ccData[ym]=doc;render();ccSave(ym);};
  if(state.ccData[prev]){go(state.ccData[prev]);}
  else{qldb.collection("ql_chamcong").doc(prev).get().then(d=>{state.ccData[prev]=d.exists?d.data():{month:prev,rows:[]};go(state.ccData[prev]);}).catch(e=>alert("Lỗi tải tháng trước: "+e.message));}
};
window.ccPrintLuong=function(){
  const ym=state.ccYM,doc=ccDoc(ym),rows=doc.rows||[];
  const groups={};CC_BOPHAN.forEach(b=>groups[b]=[]);rows.forEach(r=>{(groups[r.bophan||"BP Quản lý"]=groups[r.bophan||"BP Quản lý"]||[]).push(r);});
  let stt=0,gr={cb:0,tt:0,bhxh:0,bhyt:0,bhtn:0,thue:0,congkt:0,linh:0,cong:0},body="";
  const m=n=>n?ccMoney(n):"-";
  Object.keys(groups).forEach(bp=>{const grp=groups[bp];if(!grp.length)return;const sub={cb:0,tt:0,bhxh:0,bhyt:0,bhtn:0,thue:0,congkt:0,linh:0,cong:0};
    let tr="";grp.forEach(r=>{const c=ccCalcRow(r);["cb","tt","bhxh","bhyt","bhtn","thue","congkt","linh","cong"].forEach(k=>{sub[k]+=c[k];gr[k]+=c[k];});stt++;
      tr+=`<tr><td class=c>${String(stt).padStart(2,"0")}</td><td>${r.name||""}</td><td>${r.chucvu||""}</td><td class=c>${c.cong}</td><td class=r>${ccMoney(c.cb)}</td><td class=r>${ccMoney(c.tt)}</td><td class=r>${ccMoney(c.bhxh)}</td><td class=r>${ccMoney(c.bhyt)}</td><td class=r>${ccMoney(c.bhtn)}</td><td class=r>${m(c.thue)}</td><td class=r>${ccMoney(c.congkt)}</td><td class=r>${ccMoney(c.linh)}</td></tr>`;});
    body+=`<tr class=g><td colspan=3>${bp.toUpperCase()}</td><td class=c>${sub.cong}</td><td class=r>${ccMoney(sub.cb)}</td><td class=r>${ccMoney(sub.tt)}</td><td class=r>${ccMoney(sub.bhxh)}</td><td class=r>${ccMoney(sub.bhyt)}</td><td class=r>${ccMoney(sub.bhtn)}</td><td class=r>${m(sub.thue)}</td><td class=r>${ccMoney(sub.congkt)}</td><td class=r>${ccMoney(sub.linh)}</td></tr>`+tr;});
  const html=`<html><head><meta charset=utf-8><title>Bảng lương ${ccMonthLabel(ym)}</title>
    <style>body{font-family:'Times New Roman',serif;padding:24px;color:#000}h2,h3,p{text-align:center;margin:2px}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}th,td{border:1px solid #333;padding:4px 6px}th{background:#eee}.c{text-align:center}.r{text-align:right}.g{background:#c8e6a0;font-weight:bold}tfoot td{background:#f4d03f;font-weight:bold}
    .sign{display:flex;justify-content:space-around;margin-top:40px;font-style:italic}</style></head><body>
    <p style="text-align:left;font-size:12px">CÔNG TY TNHH GIÁO DỤC VÀ THƯƠNG MẠI THIÊN ÂN<br>Số 424 đường Bà Triệu, Phường Hạc Thành, Tỉnh Thanh Hoá</p>
    <p style="text-align:right;font-style:italic;font-size:12px">Mẫu số: 02-LĐTL</p>
    <h2>BẢNG THANH TOÁN TIỀN LƯƠNG</h2><h3><i>${ccMonthLabel(ym)}</i></h3><p style="text-align:right;font-style:italic">Đơn vị tính: Việt Nam Đồng</p>
    <table><thead><tr><th>STT</th><th>Họ và tên</th><th>Chức vụ</th><th>Ngày công</th><th>Lương cơ bản</th><th>Lương thực tế</th><th>BHXH 8%</th><th>BHYT 1,5%</th><th>BHTN 1%</th><th>Thuế TNCN</th><th>Cộng</th><th>Thực lĩnh</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan=3 class=r>TỔNG CỘNG</td><td class=c>${gr.cong}</td><td class=r>${ccMoney(gr.cb)}</td><td class=r>${ccMoney(gr.tt)}</td><td class=r>${ccMoney(gr.bhxh)}</td><td class=r>${ccMoney(gr.bhyt)}</td><td class=r>${ccMoney(gr.bhtn)}</td><td class=r>${m(gr.thue)}</td><td class=r>${ccMoney(gr.congkt)}</td><td class=r>${ccMoney(gr.linh)}</td></tr></tfoot></table>
    <div class=sign><div>Người lập</div><div>Giám đốc</div></div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`;
  const w=window.open("","_blank");if(!w){alert("Trình duyệt chặn cửa sổ in. Cho phép popup rồi thử lại.");return;}w.document.write(html);w.document.close();
};
</script>
<!-- PWA: đăng ký service worker + nút cài đặt -->
<script>
(function(){
  // 1) Đăng ký service worker (mở nhanh + chạy offline nhẹ)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('SW register failed:', err);
      });
    });
  }

  // 2) Nút "Cài đặt ứng dụng" (Android/Chrome/Edge)
  var deferred = null;
  function makeBtn(text, onClick){
    var b = document.createElement('button');
    b.textContent = text;
    b.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9999;'
      + 'background:#D4AF37;color:#1A1A2E;border:none;border-radius:24px;'
      + 'padding:11px 18px;font-size:13px;font-weight:800;cursor:pointer;'
      + 'box-shadow:0 4px 14px rgba(15,52,96,.35);font-family:inherit';
    b.onclick = onClick;
    document.body.appendChild(b);
    return b;
  }
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    var btn = makeBtn('⬇️ Cài đặt ứng dụng', async function(){
      btn.remove();
      deferred.prompt();
      try { await deferred.userChoice; } catch(_){}
      deferred = null;
    });
  });
  window.addEventListener('appinstalled', function(){ deferred = null; });

  // 3) iOS Safari: không có nút cài tự động → hiện gợi ý 1 lần
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (isIOS && !standalone && !localStorage.getItem('ta_ios_hint')) {
    var hint = makeBtn('📲 Thêm vào Màn hình chính', function(){
      alert('Trên Safari: bấm nút Chia sẻ (ô vuông có mũi tên) → "Thêm vào MH chính" (Add to Home Screen).');
      localStorage.setItem('ta_ios_hint','1');
      hint.remove();
    });
  }
})();
</script>
