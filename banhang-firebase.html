  const it=(o.items||[])[0]||{};
  closeModal();
  openWarrantyForm(null,{tenSanPham:it.ten||'',maSP:it.maSP||'',khachTen:o.khachTen||'',khachSDT:o.khachSDT||'',ngayMua:o.ngay||'',baoHanhSo:o.baoHanhSo||0,baoHanhDonVi:o.baoHanhDonVi||'thang',refOrderId:o.maDon||''});

function openWarrantyForm(id,prefill){

      <div class="field"><label>Mã SP</label><input id="fwMaSP" value="${esc(o.maSP||'')}"></div>
      <div class="field"><label>Số serial (nếu có)</label><input id="fwSerial" value="${esc(o.serial||'')}" placeholder="Số máy trên đàn"></div>
      <div class="field"><label>Khách hàng</label><input id="fwKhach" value="${esc(o.khachTen||'')}"></div>
      <div class="field"><label>Điện thoại</label><input id="fwSDT" value="${esc(o.khachSDT||'')}"></div>
      <div class="field"><label>Ngày mua</label><input id="fwNgay" type="date" value="${ngayMuaIso}"></div>
      <div class="field"><label>Thời hạn bảo hành</label><div style="display:flex;gap:6px"><input id="fwBhSo" type="number" value="${o.baoHanhSo||0}" style="flex:1" oninput="wFormHint()"><select id="fwBhDv" onchange="wFormHint()" style="width:110px"><option value="thang" ${o.baoHanhDonVi==='nam'?'':'selected'}>Tháng</option><option value="nam" ${o.baoHanhDonVi==='nam'?'selected':''}>Năm</option></select></div><div id="fwHint" class="hint" style="display:none"></div></div>
      <div class="field full"><label>Ghi chú</label><input id="fwGhiChu" value="${esc(o.ghiChu||'')}" placeholder="Điều kiện bảo hành, phụ kiện kèm theo…"></div>
    </div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="saveWBtn" onclick="saveWarranty('${edit?esc(id):''}','${esc(o.refOrderId||'')}')">${edit?'Lưu':'Tạo phiếu & QR'}</button></div>`);
  wFormHint();
}
function wFormHint(){const so=Number($('fwBhSo')?.value)||0;const dv=$('fwBhDv')?.value;const from=$('fwNgay')?.value;const hint=$('fwHint');if(!hint)return;if(so<=0){hint.style.display='none';return;}const months=dv==='nam'?so*12:so;const to=addMonthsToDate(from,months);hint.style.display='block';hint.textContent=`${so} ${dv==='nam'?'năm':'tháng'} · đến ${fmtDate(to)}`;}
async function saveWarranty(id,refOrderId){
  const ten=$('fwTen').value.trim();if(!ten){toast('Nhập tên sản phẩm','warn');return;}
  const so=Number($('fwBhSo').value)||0;const dv=$('fwBhDv').value;const months=dv==='nam'?so*12:so;
  const ngayIso=$('fwNgay').value;const [y,m,d]=ngayIso.split('-');
  const data={tenSanPham:ten,maSP:$('fwMaSP').value.trim(),serial:$('fwSerial').value.trim(),khachTen:$('fwKhach').value.trim(),khachSDT:$('fwSDT').value.trim(),ngayMua:`${d}/${m}/${y}`,baoHanhSo:so,baoHanhDonVi:dv,baoHanhThang:months,baoHanhTu:`${d}/${m}/${y}`,baoHanhDen:months>0?fmtDate(addMonthsToDate(ngayIso,months)):'',ghiChu:$('fwGhiChu').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveWBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{
    if(id){await db.collection(COL.baohanh).doc(id).set(data,{merge:true});toast('Đã cập nhật phiếu bảo hành','ok');closeModal();await loadBaoHanh();renderWarranty();}
    else{let code=genMaBaoHanh();data.maBaoHanh=code;data.refOrderId=refOrderId||'';data.lichSu=[];data.createdSort=Date.now();data.createdAt=new Date().toISOString();data.createdBy=CURRENT_USER.hoTen;
      await db.collection(COL.baohanh).doc(code).set(data);toast('Đã tạo phiếu bảo hành '+code,'ok');closeModal();await loadBaoHanh();renderWarranty();
      const rec=BAOHANH.find(x=>x.maBaoHanh===code);if(rec)openWarrantyDetail(rec._id);}
  }catch(e){console.error(e);toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent=id?'Lưu':'Tạo phiếu & QR';}
}
function openWarrantyDetail(id){
  const o=BAOHANH.find(x=>x._id===id);if(!o)return;const st=bhStatus(o);
  const lichSu=(o.lichSu&&o.lichSu.length)?o.lichSu.map(h=>`<div style="background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">${esc(h.ngay||'')}</b><span style="font-size:12px;color:var(--muted-2)">${esc(h.nguoi||'')}</span></div><div style="font-size:13px;margin-top:3px">${esc(h.noiDung||'')}</div></div>`).join(''):'<div style="color:var(--muted-2);font-size:13px;padding:6px 0">Chưa có lần bảo hành/sửa chữa nào.</div>';
  openModal(`<div class="modal-head"><h3>Phiếu bảo hành · ${esc(o.maBaoHanh)}</h3><div style="margin-left:auto;display:flex;gap:8px;align-items:center"><button class="btn btn-primary btn-sm" onclick="printWarrantyTem('${esc(id)}')">🏷 In tem QR</button><button onclick="closeModal()" style="font-size:22px;color:var(--muted-2);padding:2px 6px">×</button></div></div>
    <div class="modal-body"><div style="display:grid;grid-template-columns:1fr 240px;gap:18px;align-items:start">
      <div>
        <div class="od-box">
          <h4>Thông tin bảo hành</h4>
          <div class="od-row"><span>Mã tra cứu</span><b class="t-code">${esc(o.maBaoHanh)}</b></div>
          <div class="od-row"><span>Sản phẩm</span><b>${esc(o.tenSanPham||'')}</b></div>
          ${o.serial?`<div class="od-row"><span>Serial</span><b>${esc(o.serial)}</b></div>`:''}
          <div class="od-row"><span>Khách hàng</span><b>${esc(o.khachTen||'—')}</b></div>
          ${o.khachSDT?`<div class="od-row"><span>Điện thoại</span><b>${esc(o.khachSDT)}</b></div>`:''}

        </div>

        </div>
      </div>
      <div>
        <div class="od-box" style="text-align:center">
          <h4>Mã QR dán đàn</h4>
          <img src="${bhQrImg(o.maBaoHanh,180)}" style="width:170px;height:170px;background:#fff;border-radius:8px" alt="QR">
          <div style="font-family:ui-monospace,monospace;font-weight:800;font-size:16px;margin-top:6px;letter-spacing:1px">${esc(o.maBaoHanh)}</div>

        </div>
        <button class="btn btn-danger btn-block" onclick="deleteWarranty('${esc(id)}')" style="margin-top:12px">🗑 Xóa phiếu</button>
      </div>
    </div></div>`,'lg');

async function addWarrantyLog(id){
  const o=BAOHANH.find(x=>x._id===id);if(!o)return;const v=$('wLsInput').value.trim();if(!v)return;
  const log={ngay:new Date().toLocaleDateString('vi-VN'),noiDung:v,nguoi:CURRENT_USER.hoTen};
  const ls=(o.lichSu||[]).concat([log]);
  try{await db.collection(COL.baohanh).doc(id).update({lichSu:ls,updatedAt:new Date().toISOString()});o.lichSu=ls;toast('Đã ghi lịch sử','ok');openWarrantyDetail(id);}catch(e){toast('Lỗi: '+e.message,'err');}
}
function deleteWarranty(id){const o=BAOHANH.find(x=>x._id===id);if(!o)return;openModal(`<div class="modal-head"><h3>Xóa phiếu bảo hành</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.6">Xóa phiếu <b>${esc(o.maBaoHanh)}</b> — ${esc(o.tenSanPham||'')}?<br><span style="color:var(--muted);font-size:13px">QR đã dán sẽ không tra cứu được nữa.</span></p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delWBtn" onclick="confirmDeleteWarranty('${esc(id)}')">Xóa</button></div>`,'sm');}
async function confirmDeleteWarranty(id){const b=$('delWBtn');b.disabled=true;b.textContent='Đang xóa…';try{await db.collection(COL.baohanh).doc(id).delete();toast('Đã xóa','ok');closeModal();await loadBaoHanh();renderWarranty();}catch(e){toast('Lỗi: '+e.message,'err');b.disabled=false;b.textContent='Xóa';}}

  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tem BH ${esc(o.maBaoHanh)}</title>

    <body><div class="tem">
      <img class="logo" src="${LOGO_DATAURI}">
      <div style="font-weight:bold;font-size:13px;color:#a97e46;margin:2px 0">PHIẾU BẢO HÀNH</div>
      <div style="font-size:11px;line-height:1.35">${esc(SHOP.name)}<br>${esc(SHOP.phone)}</div>
      <img class="qr" src="${bhQrImg(o.maBaoHanh,300)}" style="margin:6px 0">
      <div style="font-family:monospace;font-weight:bold;font-size:18px;letter-spacing:2px">${esc(o.maBaoHanh)}</div>
      <div style="font-size:12px;margin-top:4px"><b>${esc(o.tenSanPham||'')}</b></div>
      <div style="font-size:11px">BH ${o.baoHanhSo||0} ${o.baoHanhDonVi==='nam'?'năm':'tháng'} · đến ${esc(o.baoHanhDen||'')}</div>
      <div style="font-size:10.5px;color:#555;margin-top:4px">📱 Quét mã QR để tra cứu bảo hành</div>
    </div>
    <div class="noprint" style="text-align:center;margin-top:12px"><button onclick="window.print()" style="padding:8px 20px;background:#a97e46;color:#fff;border:none;border-radius:8px;cursor:pointer">🖨 In tem</button></div>
    </body></html>`);
  w.document.close();
}
/* --- Trang tra cứu công khai (khách quét QR) --- */
async function renderPublicWarranty(code){
  document.body.innerHTML=`<div id="pubw" style="min-height:100vh;background:linear-gradient(160deg,#0f1626,#1a2338);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;font-family:Inter,system-ui,Arial,sans-serif"><div style="width:100%;max-width:440px"><div style="text-align:center;margin-bottom:16px"><img src="${LOGO_DATAURI}" style="width:96px;background:#fff;border-radius:14px;padding:6px"><div style="color:#f0d79a;font-weight:800;font-size:18px;margin-top:8px;letter-spacing:.5px">TRA CỨU BẢO HÀNH</div><div style="color:#9fb0cc;font-size:12.5px">Học viện Âm nhạc Thiên Ân</div></div><div id="pubwCard" style="background:#fff;border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.3)"><div style="text-align:center;color:#888;padding:20px">Đang tra cứu mã <b>${esc(code)}</b>…</div></div><div style="text-align:center;color:#8296b5;font-size:11.5px;margin-top:14px">Hotline: ${esc(SHOP.phone)}</div></div></div>`;
  try{
    if(!ready)initFirebase();
    const doc=await db.collection(COL.baohanh).doc(code).get();
    const card=document.getElementById('pubwCard');
    if(!doc.exists){card.innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:40px">❓</div><h3 style="margin:8px 0;color:#c0392b">Không tìm thấy</h3><p style="color:#666;font-size:13.5px">Mã bảo hành <b>${esc(code)}</b> không tồn tại hoặc đã bị xóa. Vui lòng liên hệ cửa hàng.</p></div>`;return;}
    const o={_id:doc.id,...doc.data()};const st=bhStatus(o);
    const stColor={ok:'#1c8a4d',vip:'#b8860b',low:'#c0392b',cn:'#666'}[st.cls];
    const stBg={ok:'#e5f5ec',vip:'#fdf3d9',low:'#fbe6e3',cn:'#eee'}[st.cls];
    const row=(l,v)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef0f4;font-size:13.5px"><span style="color:#888">${l}</span><b style="text-align:right">${v||'—'}</b></div>`;
    const ls=(o.lichSu&&o.lichSu.length)?o.lichSu.map(h=>`<div style="background:#f7f9fc;border-radius:8px;padding:8px 11px;margin-top:6px;font-size:12.5px"><b>${esc(h.ngay||'')}</b> — ${esc(h.noiDung||'')}</div>`).join(''):'<div style="color:#aaa;font-size:12.5px;padding:4px 0">Chưa có lịch sử bảo hành.</div>';
    card.innerHTML=`
      <div style="text-align:center;background:${stBg};color:${stColor};border-radius:11px;padding:12px;margin-bottom:16px"><div style="font-size:22px;font-weight:800">${st.txt}</div>${st.dl!==null&&st.dl>=0?`<div style="font-size:12.5px;margin-top:2px">Còn ${st.dl} ngày bảo hành</div>`:''}</div>
      <div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:4px">${esc(o.tenSanPham||'')}</div>
      <div style="text-align:center;font-family:monospace;color:#a97e46;font-weight:700;margin-bottom:14px">Mã: ${esc(o.maBaoHanh)}</div>
      ${o.serial?row('Số serial',esc(o.serial)):''}
      ${row('Ngày mua',esc(o.ngayMua||''))}
      ${row('Thời hạn BH',`${o.baoHanhSo||0} ${o.baoHanhDonVi==='nam'?'năm':'tháng'}`)}
      ${row('Bảo hành đến',esc(o.baoHanhDen||''))}
      ${o.khachTen?row('Khách hàng',esc(o.khachTen)):''}
      <div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Lịch sử bảo hành</div>${ls}</div>`;
  }catch(e){const card=document.getElementById('pubwCard');if(card)card.innerHTML=`<div style="text-align:center;padding:16px;color:#c0392b">Lỗi tra cứu: ${esc(e.message)}</div>`;}
}

/* ===== CẤU HÌNH TÀI KHOẢN NGÂN HÀNG ===== */
async function loadSettings(){try{const d=await db.collection(COL.settings).doc('bank').get();if(d.exists)BANK_INFO=d.data();}catch(e){BANK_INFO=null;}}
const VN_BANKS=[['VCB','Vietcombank'],['TCB','Techcombank'],['MB','MB Bank'],['BIDV','BIDV'],['ICB','VietinBank'],['VBA','Agribank'],['ACB','ACB'],['VPB','VPBank'],['STB','Sacombank'],['TPB','TPBank'],['MSB','MSB'],['HDB','HDBank'],['OCB','OCB'],['SHB','SHB'],['VIB','VIB'],['SEAB','SeABank'],['EIB','Eximbank'],['LPB','LPBank'],['NAB','Nam A Bank'],['BAB','BacABank'],['ABB','ABBANK'],['SCB','SCB'],['VAB','VietABank'],['PVCB','PVcomBank']];
function openBankSettings(){
  const b=BANK_INFO||{};
  const opts=VN_BANKS.map(([c,n])=>`<option value="${c}" ${b.bankCode===c?'selected':''}>${n}</option>`).join('');
  openModal(`<div class="modal-head"><h3>Cấu hình tài khoản chuyển khoản</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px">Nhập tài khoản nhận tiền. App sẽ tạo <b>mã QR VietQR</b> (quét bằng mọi app ngân hàng, tự điền số tiền) và in lên hóa đơn khi chọn Chuyển khoản.</p>
      <div class="field"><label>Ngân hàng <span class="req">*</span></label><select id="bkCode">${opts}</select></div>
      <div class="field"><label>Số tài khoản <span class="req">*</span></label><input id="bkAcc" value="${esc(b.accountNo||'')}" placeholder="Số TK nhận tiền"></div>
      <div class="field" style="margin:0"><label>Tên chủ tài khoản</label><input id="bkName" value="${esc(b.accountName||'')}" placeholder="VD: DO NGOC CUONG"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="saveBkBtn" onclick="saveBankSettings()">💾 Lưu tài khoản</button></div>`);
}
async function saveBankSettings(){
  const code=$('bkCode').value,acc=$('bkAcc').value.trim();
  if(!acc){toast('Nhập số tài khoản','warn');return;}
  const bankName=(VN_BANKS.find(x=>x[0]===code)||[])[1]||code;
  const data={bankCode:code,bankName,accountNo:acc,accountName:$('bkName').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveBkBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{await db.collection(COL.settings).doc('bank').set(data);BANK_INFO=data;toast('Đã lưu tài khoản','ok');closeModal();if(typeof updatePayUI==='function')updatePayUI();}catch(e){toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Lưu tài khoản';}
}

/* ===== KHỞI ĐỘNG ===== */
const _bhCode=new URLSearchParams(location.search).get('bh');
if(_bhCode){
  if(!ready)initFirebase();
  renderPublicWarranty(_bhCode.toUpperCase().trim());
}else{
  $('liBtn').onclick=doLogin;
  $('liPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  $('liUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('liPass').focus();});
  if(initFirebase()){bootLogin();try{const s=sessionStorage.getItem('bh_session');if(s)loginSuccess(JSON.parse(s));}catch(e){}}
}
</script>
