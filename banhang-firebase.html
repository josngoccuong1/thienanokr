<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiên Ân — Quản Lý Bán Hàng</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1729;--ink-2:#1c2942;--nav:#141d33;
  --gold:#c2955c;--gold-2:#a97e46;--gold-soft:#f4ecdf;
  --bg:#f5f6f8;--card:#ffffff;--line:#e6e9ef;
  --txt:#1a2233;--muted:#6b7585;--muted-2:#9aa3b2;
  --ok:#1a9d6b;--ok-bg:#e6f6ef;--warn:#c9891f;--warn-bg:#fdf3e0;
  --danger:#d0453f;--danger-bg:#fbeceb;--info:#2b6cb0;--info-bg:#e8f1fb;
  --shadow:0 1px 2px rgba(16,23,41,.04),0 4px 16px rgba(16,23,41,.06);--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd2dd;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#aeb7c5}
#configGate{position:fixed;inset:0;background:var(--ink);color:#e8ecf3;display:none;align-items:center;justify-content:center;padding:24px;z-index:9999}
#configGate .box{max-width:560px;background:var(--ink-2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px}
#configGate h2{font-size:20px;margin-bottom:8px}#configGate p{color:#aab4c5;line-height:1.6;margin-bottom:14px;font-size:13.5px}
#configGate code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px;color:var(--gold);font-size:12.5px}
#loginScreen{position:fixed;inset:0;background:radial-gradient(1200px 600px at 70% -10%,#1e2c4a 0%,var(--ink) 55%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:900}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.login-head{padding:34px 34px 22px;text-align:center;border-bottom:1px solid var(--line)}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-weight:800;font-size:24px;box-shadow:0 8px 20px rgba(194,149,92,.35)}
.login-head h1{font-size:18px;font-weight:700}.login-head span{color:var(--muted);font-size:13px}
.login-body{padding:26px 34px 34px}
.field{margin-bottom:16px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfd;transition:.15s;color:var(--txt)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(194,149,92,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#fff;box-shadow:0 4px 14px rgba(194,149,92,.3)}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-block{width:100%}.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:#cdd4df;background:#fafbfc}
.btn-danger{background:var(--danger-bg);color:var(--danger)}.btn-danger:hover{background:#f7dedc}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.login-msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none}
.login-msg.err{background:var(--danger-bg);color:var(--danger);display:block}.login-msg.info{background:var(--info-bg);color:var(--info);display:block}
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:248px;background:var(--nav);color:#c7d0e0;display:flex;flex-direction:column;z-index:100}
.sb-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0}
.sb-brand b{color:#fff;font-size:14.5px;font-weight:700;line-height:1.2}.sb-brand small{color:#7f8ba3;font-size:11px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 20px}.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-color:transparent}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5f6b83;padding:16px 12px 7px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:9px;color:#c7d0e0;font-weight:500;font-size:13.5px;transition:.13s;position:relative;width:100%;text-align:left}
.nav-item .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(194,149,92,.22),rgba(194,149,92,.05));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--gold)}
.nav-item.soon{opacity:.42;cursor:not-allowed}
.nav-item .tag{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.1);color:#9aa6bd;padding:2px 6px;border-radius:5px;font-weight:600}
.sb-user{padding:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-user .av{width:34px;height:34px;border-radius:9px;background:#26324d;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:14px}
.sb-user .info{flex:1;min-width:0}.sb-user .info b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .info small{color:#7f8ba3;font-size:11px}
.sb-user button{color:#8b96ad;padding:7px;border-radius:8px}.sb-user button:hover{background:rgba(255,255,255,.08);color:#fff}
.main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:16px;position:sticky;top:0;z-index:50}
.topbar h2{font-size:17px;font-weight:700}.topbar .sub{color:var(--muted);font-size:12.5px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{padding:24px 26px 40px;flex:1}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.stat .val{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .sub{font-size:11.5px;color:var(--muted-2);margin-top:6px}
.stat .ic{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.stat.g1 .ic{background:var(--gold-soft);color:var(--gold-2)}.stat.g1 .val{color:var(--gold-2)}
.stat.g2 .ic{background:var(--ok-bg);color:var(--ok)}.stat.g2 .val{color:var(--ok)}
.stat.g3 .ic{background:var(--warn-bg);color:var(--warn)}.stat.g3 .val{color:var(--warn)}
.stat.g4 .ic{background:var(--danger-bg);color:var(--danger)}.stat.g4 .val{color:var(--danger)}
.stat.g5 .ic{background:var(--info-bg);color:var(--info)}.stat.g5 .val{color:var(--info)}
.stat.g6 .ic{background:#eee9f7;color:#7c5cbf}.stat.g6 .val{color:#7c5cbf}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.panel-head h3{font-size:15px;font-weight:700}
.panel-head .tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.13s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--gold-2);border-bottom-color:var(--gold)}
.tab .cnt{background:#eef0f4;color:var(--muted);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
.tab.active .cnt{background:var(--gold-soft);color:var(--gold-2)}
.search{position:relative}
.search input{padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfd;width:230px;transition:.15s}
.search input:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(194,149,92,.1)}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
select.filter{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfd;color:var(--txt);cursor:pointer}
select.filter:focus{outline:none;border-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:11px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
tbody tr:hover{background:#fbfcfe}tbody tr:last-child td{border-bottom:none}
.t-code{font-weight:700;color:var(--ink-2);font-family:ui-monospace,monospace;font-size:12px}
.t-name{font-weight:600}.t-name small{display:block;color:var(--muted-2);font-weight:400;font-size:11.5px}
.t-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-price{font-weight:700;color:var(--ink-2)}
.pavatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#eef1f6,#e2e7ef);display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold-2);flex-shrink:0}
.namecell{display:flex;align-items:center;gap:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.off{background:#eef0f4;color:var(--muted)}
.chip.low{background:var(--danger-bg);color:var(--danger)}.chip.cat{background:var(--gold-soft);color:var(--gold-2)}
.chip.vip{background:#fdf0e0;color:#b8791f}.chip.dn{background:var(--info-bg);color:var(--info)}.chip.cn{background:#eef0f4;color:var(--muted)}
.chip.thu{background:var(--ok-bg);color:var(--ok)}.chip.chi{background:var(--danger-bg);color:var(--danger)}
.row-act{display:flex;gap:5px;justify-content:flex-end}
.icon-btn{width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.13s;font-size:14px}
.icon-btn:hover{background:#eef0f4;color:var(--txt)}.icon-btn.del:hover{background:var(--danger-bg);color:var(--danger)}
.tbl-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.tbl-foot .pg{margin-left:auto;display:flex;gap:6px;align-items:center}
.pg button{padding:6px 11px;border:1.5px solid var(--line);border-radius:8px;color:var(--txt);font-weight:600;font-size:13px}
.pg button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-2)}.pg button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty .em-ic{font-size:40px;margin-bottom:12px;opacity:.5}.empty h4{font-size:15px;color:var(--txt);margin-bottom:5px}
.empty p{font-size:13px;max-width:360px;margin:0 auto 16px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;background:rgba(15,23,41,.5);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:800;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s}
.modal.sm{max-width:440px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head button{margin-left:auto;color:var(--muted-2);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.modal-head button:hover{background:#eef0f4;color:var(--txt)}
.modal-body{padding:22px 24px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
#toast{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink-2);color:#fff;padding:13px 18px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;animation:slideIn .25s;min-width:240px}
.toast.ok{background:#12805a}.toast.err{background:#c0392b}.toast.warn{background:#b7791f}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.imp-drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted);transition:.15s;cursor:pointer}
.imp-drop:hover{border-color:var(--gold);background:#fdfbf7}.imp-drop .di{font-size:34px;opacity:.5;margin-bottom:10px}
.imp-bar{height:8px;background:#eef0f4;border-radius:6px;overflow:hidden;margin-top:14px}
.imp-bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));width:0;transition:width .2s}
.imp-log{margin-top:12px;font-size:12.5px;color:var(--muted);max-height:120px;overflow-y:auto;background:#fafbfc;border-radius:8px;padding:10px 12px;line-height:1.7}
.req{color:var(--danger)}
.catrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}
.catrow b{flex:1}
@media(max-width:920px){
  .sidebar{transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}.main{margin-left:0}.search input{width:150px}.grid2{grid-template-columns:1fr}#menuToggle{display:flex!important}
}
#menuToggle{display:none;width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center;font-size:20px;color:var(--txt)}
#menuToggle:hover{background:#eef0f4}
</style>
</head>
<body>
<div id="configGate"><div class="box"><h2>⚙️ Cần cấu hình Firebase</h2><p>App chưa được nối với dự án Firebase. Mở file HTML, tìm khối <code>firebaseConfig</code> và dán thông tin dự án vào.</p></div></div>
<div id="loginScreen"><div class="login-card">
  <div class="login-head"><div class="login-logo">TA</div><h1>Quản Lý Bán Hàng</h1><span id="loginSubtitle">Học viện Âm nhạc Thiên Ân</span></div>
  <div class="login-body"><div class="login-msg" id="loginMsg"></div>
    <div class="field"><label>Tên đăng nhập</label><input id="liUser" autocomplete="username" placeholder="Nhập tên đăng nhập"></div>
    <div class="field"><label id="liPassLbl">Mật khẩu</label><input id="liPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"></div>
    <div class="field" id="liNameWrap" style="display:none"><label>Họ tên hiển thị</label><input id="liName" placeholder="Ví dụ: Đỗ Ngọc Cương"></div>
    <button class="btn btn-primary btn-block" id="liBtn" style="margin-top:6px">Đăng nhập</button>
  </div>
</div></div>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="mk">TA</div><div><b>Thiên Ân</b><small>Quản lý bán hàng</small></div></div>
    <nav class="sb-nav" id="navMenu"></nav>
    <div class="sb-user"><div class="av" id="userAv">?</div><div class="info"><b id="userName">—</b><small id="userRole">—</small></div><button onclick="logout()" title="Đăng xuất">⏻</button></div>
  </aside>
  <div class="main">
    <header class="topbar"><button id="menuToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><h2 id="pageTitle">Tổng quan</h2><div class="sub" id="pageSub">Bảng điều khiển</div></div><div class="right"></div></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="toast"></div>
<div class="overlay" id="overlay"></div>
<script>
/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyC8603m7PgLadFiNWnCZiWLCnUgWYNLKwM",
  authDomain: "thien-an-bb976.firebaseapp.com",
  projectId: "thien-an-bb976",
  storageBucket: "thien-an-bb976.firebasestorage.app",
  messagingSenderId: "1065254649793",
  appId: "1:1065254649793:web:83d2fba4d40c11a2363940"
};
const P="bh_";
const COL={users:P+"users",products:P+"products",categories:P+"categories",customers:P+"customers",transactions:P+"transactions",orders:P+"orders",suppliers:P+"suppliers",purchases:P+"purchases",stockchecks:P+"stockchecks",settings:P+"settings"};
let db=null,ready=false,CURRENT_USER=null,BANK_INFO=null;
let PRODUCTS=[],CATEGORIES=[],CUSTOMERS=[],TRANSACTIONS=[],ORDERS=[],ORDER_CART=[],ORDER_PAID_EDITED=false;
let SUPPLIERS=[],PURCHASES=[],PURCHASE_CART=[],PUR_PAID_EDITED=false,STOCKCHECKS=[];

function initFirebase(){
  if(firebaseConfig.apiKey==="PASTE_API_KEY"||!firebaseConfig.apiKey){document.getElementById('configGate').style.display='flex';document.getElementById('loginScreen').style.display='none';return false;}
  try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();ready=true;return true;}catch(e){console.error(e);toast('Không kết nối được Firebase: '+e.message,'err');return false;}
}
const money=n=>(Number(n)||0).toLocaleString('vi-VN');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const slug=s=>String(s||'').trim().replace(/\s+/g,'_').replace(/[^\w\-]/g,'')||('ID'+Date.now());
function toast(msg,type='ok'){const box=$('toast');const t=document.createElement('div');t.className='toast '+type;const ic={ok:'✓',err:'✕',warn:'⚠',info:'ℹ'}[type]||'✓';t.innerHTML=`<span>${ic}</span><span>${esc(msg)}</span>`;box.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),250)},2800);}
function openModal(html,size=''){const o=$('overlay');o.innerHTML=`<div class="modal ${size}">${html}</div>`;o.classList.add('show');o.onclick=e=>{if(e.target===o)closeModal();};}
function closeModal(){$('overlay').classList.remove('show');$('overlay').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function normKey(k){return String(k||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[%()]/g,'').replace(/\s+/g,' ').trim();}
function toNum(v){if(v==null||v==='')return 0;const n=Number(String(v).replace(/[^\d.-]/g,''));return isNaN(n)?0:n;}
function cleanStr(v){if(v==null)return '';let s=String(v).trim();if(s==='nan'||s==='NaN'||s==='undefined')return '';if(/^\d+\.0$/.test(s))s=s.replace('.0','');return s;}
function parseVNDate(v){
  if(!v)return {iso:'',disp:'',sort:0};
  let s=String(v).trim();
  const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){const d=+m[1],mo=+m[2],y=+m[3];const dt=new Date(y,mo-1,d);return {iso:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,disp:`${String(d).padStart(2,'0')}/${String(mo).padStart(2,'0')}/${y}`,sort:dt.getTime()};}
  const dt=new Date(s);if(!isNaN(dt))return {iso:dt.toISOString().slice(0,10),disp:dt.toLocaleDateString('vi-VN'),sort:dt.getTime()};
  return {iso:'',disp:s,sort:0};
}

async function bootLogin(){if(!ready)return;try{const snap=await db.collection(COL.users).limit(1).get();if(snap.empty)setLoginMode('setup');}catch(e){}}
function setLoginMode(mode){if(mode==='setup'){$('loginSubtitle').textContent='Tạo tài khoản quản trị đầu tiên';$('liNameWrap').style.display='block';$('liBtn').textContent='Tạo tài khoản admin';showLoginMsg('Chưa có tài khoản nào. Hãy tạo tài khoản quản trị đầu tiên.','info');$('liBtn').dataset.mode='setup';}}
function showLoginMsg(m,cls){const el=$('loginMsg');el.textContent=m;el.className='login-msg '+cls;}
async function doLogin(){
  const u=$('liUser').value.trim(),p=$('liPass').value,mode=$('liBtn').dataset.mode||'login';
  if(!u||!p){showLoginMsg('Nhập đủ tên đăng nhập và mật khẩu.','err');return;}
  $('liBtn').textContent='Đang xử lý…';$('liBtn').disabled=true;
  try{
    if(mode==='setup'){const name=$('liName').value.trim()||u;await db.collection(COL.users).doc(u).set({username:u,password:p,hoTen:name,role:'admin',trangThai:'Active',createdAt:new Date().toISOString()});toast('Đã tạo tài khoản admin','ok');loginSuccess({username:u,hoTen:name,role:'admin'});return;}
    const doc=await db.collection(COL.users).doc(u).get();
    if(!doc.exists){showLoginMsg('Tài khoản không tồn tại.','err');return resetBtn();}
    const data=doc.data();
    if(String(data.password)!==String(p)){showLoginMsg('Sai mật khẩu.','err');return resetBtn();}
    if(data.trangThai&&data.trangThai!=='Active'){showLoginMsg('Tài khoản đã bị khóa.','err');return resetBtn();}
    loginSuccess(data);
  }catch(e){console.error(e);showLoginMsg('Lỗi: '+e.message,'err');resetBtn();}
}
function resetBtn(){const b=$('liBtn');b.disabled=false;b.textContent=(b.dataset.mode==='setup'?'Tạo tài khoản admin':'Đăng nhập');}
function loginSuccess(u){
  CURRENT_USER={username:u.username,hoTen:u.hoTen||u.username,role:u.role||'nhanvien'};
  try{sessionStorage.setItem('bh_session',JSON.stringify(CURRENT_USER));}catch(e){}
  $('loginScreen').style.display='none';$('app').style.display='block';
  $('userName').textContent=CURRENT_USER.hoTen;$('userRole').textContent=roleLabel(CURRENT_USER.role);
  $('userAv').textContent=(CURRENT_USER.hoTen||'?').trim().charAt(0).toUpperCase();
  buildNav();loadAll();
}
function roleLabel(r){return {admin:'Quản trị',quanly:'Quản lý',nhanvien:'Nhân viên',ktv:'Kỹ thuật'}[r]||r;}
function logout(){CURRENT_USER=null;try{sessionStorage.removeItem('bh_session');}catch(e){}$('app').style.display='none';$('loginScreen').style.display='flex';$('liUser').value='';$('liPass').value='';resetBtn();}

function refreshCurrent(){if(CURRENT_VIEW==='dashboard')renderDashboard();if(CURRENT_VIEW==='products')renderProducts();if(CURRENT_VIEW==='customers')renderCustomers();if(CURRENT_VIEW==='finance')renderFinance();if(CURRENT_VIEW==='orders')renderOrders();if(CURRENT_VIEW==='suppliers')renderSuppliers();if(CURRENT_VIEW==='purchases')renderPurchases();if(CURRENT_VIEW==='inventory')renderInventory();}

async function loadCustomers(){try{const s=await db.collection(COL.customers).get();CUSTOMERS=s.docs.map(d=>({_id:d.id,...d.data()}));CUSTOMERS.sort((a,b)=>String(a.maKH||'').localeCompare(String(b.maKH||''),'vi',{numeric:true}));}catch(e){console.error(e);toast('Lỗi tải khách hàng: '+e.message,'err');CUSTOMERS=[];}}
async function loadTransactions(){try{const s=await db.collection(COL.transactions).get();TRANSACTIONS=s.docs.map(d=>({_id:d.id,...d.data()}));TRANSACTIONS.sort((a,b)=>(b.ngaySort||0)-(a.ngaySort||0));}catch(e){console.error(e);TRANSACTIONS=[];}}
async function loadOrders(){try{const s=await db.collection(COL.orders).get();ORDERS=s.docs.map(d=>({_id:d.id,...d.data()}));ORDERS.sort((a,b)=>(b.ngaySort||0)-(a.ngaySort||0));}catch(e){console.error(e);ORDERS=[];}}
async function loadCategories(){try{const s=await db.collection(COL.categories).get();CATEGORIES=s.docs.map(d=>d.data().name).filter(Boolean);}catch(e){CATEGORIES=[];}const fromP=[...new Set(PRODUCTS.map(p=>p.danhMuc).filter(Boolean))];CATEGORIES=[...new Set([...CATEGORIES,...fromP])].sort((a,b)=>a.localeCompare(b,'vi'));}

let pFilter={q:'',cat:'',tab:'all',page:1,per:20};
function prodStats(){
  const total=PRODUCTS.length;
  const con=PRODUCTS.filter(p=>(Number(p.tonKho)||0)>0).length;
  const het=PRODUCTS.filter(p=>(Number(p.tonKho)||0)<=0).length;
  const sap=PRODUCTS.filter(p=>{const c=Number(p.tonKho)||0,m=Number(p.tonKhoToiThieu)||0;return m>0&&c>0&&c<=m;}).length;
  const noiBat=PRODUCTS.filter(p=>p.noiBat).length;
  const ngung=PRODUCTS.filter(p=>p.trangThai==='Ngừng').length;
  const giaTri=PRODUCTS.reduce((s,p)=>s+(Number(p.tonKho)||0)*(Number(p.giaBan)||0),0);
  return {total,con,het,sap,noiBat,ngung,giaTri};
}

      <div class="panel-head"><h3>Danh sách sản phẩm</h3>

      </div>
      <div id="pTableWrap"><div class="spin"></div></div>
    </div>`;
  $('pCat').value=pFilter.cat;
  $('pSearch').oninput=e=>{pFilter.q=e.target.value;pFilter.page=1;drawProductTable();};
  $('pCat').onchange=e=>{pFilter.cat=e.target.value;pFilter.page=1;drawProductTable();};
  drawProductTable();

function tabBtn(id,label,cnt){return `<button class="tab${pFilter.tab===id?' active':''}" onclick="pFilter.tab='${id}';pFilter.page=1;renderProducts()">${label}<span class="cnt">${money(cnt)}</span></button>`;}
function filteredProducts(){
  const q=pFilter.q.toLowerCase().trim();
  return PRODUCTS.filter(p=>{
    const c=Number(p.tonKho)||0,m=Number(p.tonKhoToiThieu)||0;
    if(pFilter.tab==='con'&&c<=0)return false;
    if(pFilter.tab==='het'&&c>0)return false;
    if(pFilter.tab==='sap'&&!(m>0&&c>0&&c<=m))return false;
    if(pFilter.tab==='noibat'&&!p.noiBat)return false;
    if(pFilter.tab==='ngung'&&p.trangThai!=='Ngừng')return false;
    if(pFilter.cat&&p.danhMuc!==pFilter.cat)return false;
    if(q){const hay=[p.maSP,p.tenSP,p.barcode,p.danhMuc,p.maNCC].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function drawProductTable(){
  const wrap=$('pTableWrap');if(!wrap)return;
  const all=filteredProducts();
  if(all.length===0){wrap.innerHTML=PRODUCTS.length===0?`<div class="empty"><div class="em-ic">♪</div><h4>Chưa có sản phẩm nào</h4><p>Nhập từ file Excel hoặc thêm thủ công.</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-ghost btn-sm" onclick="openImport()">📥 Nhập Excel</button><button class="btn btn-primary btn-sm" onclick="openProductForm()">＋ Thêm</button></div></div>`:`<div class="empty"><div class="em-ic">🔍</div><h4>Không tìm thấy</h4><p>Không có sản phẩm khớp bộ lọc.</p></div>`;return;}
  const per=pFilter.per,pages=Math.ceil(all.length/per);if(pFilter.page>pages)pFilter.page=pages;
  const start=(pFilter.page-1)*per,rows=all.slice(start,start+per);
  wrap.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Mã SP</th><th>Tên sản phẩm</th><th>Danh mục</th><th class="t-num">Giá bán</th><th class="t-num">Giá VIP</th><th class="t-num">Giá sỉ</th><th class="t-num">Tồn</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>${rows.map(prodRow).join('')}</tbody></table></div>
    <div class="tbl-foot"><span>Hiển thị ${start+1}–${Math.min(start+per,all.length)} / <b>${money(all.length)}</b> sản phẩm</span><div class="pg"><button ${pFilter.page<=1?'disabled':''} onclick="pFilter.page--;drawProductTable()">‹ Trước</button><span style="padding:0 6px">Trang ${pFilter.page}/${pages}</span><button ${pFilter.page>=pages?'disabled':''} onclick="pFilter.page++;drawProductTable()">Sau ›</button></div></div>`;
}
function prodRow(p){
  const st=p.trangThai||'Active',min=Number(p.tonKhoToiThieu)||0,cur=Number(p.tonKho)||0,low=min>0&&cur<=min;
  const stChip=st==='Active'?'<span class="chip ok">● Đang bán</span>':'<span class="chip off">Ngừng bán</span>';
  const stockChip=cur<=0?'<span class="chip low">Hết</span>':(low?`<span class="chip low">${money(cur)}</span>`:`<b>${money(cur)}</b>`);
  const icon=p.laDichVu?'🛠':'♪';
  return `<tr style="cursor:pointer" onclick="openProductDetail('${esc(p._id)}')">
    <td class="t-code">${esc(p.maSP||'')}</td>
    <td><div class="namecell"><span class="pavatar">${icon}</span><div class="t-name">${esc(p.tenSP||'—')}${p.donVi?`<small>ĐVT: ${esc(p.donVi)}${p.noiBat?' · ★ Nổi bật':''}</small>`:(p.noiBat?'<small>★ Nổi bật</small>':'')}</div></div></td>
    <td>${p.danhMuc?`<span class="chip cat">${esc(p.danhMuc)}</span>`:'<span style="color:var(--muted-2)">—</span>'}</td>
    <td class="t-num t-price">${money(p.giaBan)}</td>
    <td class="t-num">${p.giaVIP?money(p.giaVIP):'<span style="color:var(--muted-2)">—</span>'}</td>
    <td class="t-num">${p.giaBanBuon?money(p.giaBanBuon):'<span style="color:var(--muted-2)">—</span>'}</td>
    <td class="t-num">${stockChip}</td>
    <td>${stChip}</td>
    <td><div class="row-act"><button class="icon-btn" title="Xem" onclick="event.stopPropagation();openProductDetail('${esc(p._id)}')">👁</button><button class="icon-btn" title="Sửa" onclick="event.stopPropagation();openProductForm('${esc(p._id)}')">✎</button><button class="icon-btn del" title="Xóa" onclick="event.stopPropagation();deleteProduct('${esc(p._id)}')">🗑</button></div></td>
  </tr>`;
}
function openProductDetail(id){
  const p=PRODUCTS.find(x=>x._id===id);if(!p)return;
  const st=p.trangThai||'Active',min=Number(p.tonKhoToiThieu)||0,cur=Number(p.tonKho)||0,low=min>0&&cur<=min;
  const margin=(Number(p.giaBan)||0)-(Number(p.giaNhap)||0);
  const stChip=st==='Active'?'<span class="chip ok">● Đang bán</span>':'<span class="chip off">Ngừng bán</span>';
  const warn=(low||cur<=0)?`<div style="background:var(--danger-bg);color:var(--danger);padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px">⚠ ${cur<=0?'Sản phẩm đã hết hàng':'Sản phẩm sắp hết hàng'} (tồn tối thiểu: ${money(min)})</div>`:'';
  const info=(l,v)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f2f6"><span style="color:var(--muted);font-size:13px">${l}</span><span style="font-weight:600;font-size:13.5px;text-align:right">${v||'<span style=\"color:var(--muted-2);font-weight:400\">—</span>'}</span></div>`;
  const badges=[];if(p.laDichVu)badges.push('<span class="chip cn">Dịch vụ</span>');if(p.noiBat)badges.push('<span class="chip vip">★ Nổi bật</span>');
  openModal(`<div class="modal-head"><h3>Chi tiết sản phẩm</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">${warn}

function genericImport(kind,title,idLabel,cols){
  openModal(`<div class="modal-head"><h3>${title}</h3><button onclick="closeModal()">×</button></div><div class="modal-body">
    <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px">Chọn file .xlsx/.csv. App tự nhận cột: <b>${cols}</b>. Trùng <b>${idLabel}</b> sẽ cập nhật.</p>
    <div class="imp-drop" id="impDrop" onclick="$('impFile').click()"><div class="di">📄</div><div><b>Bấm để chọn file</b> hoặc kéo thả vào đây</div><div style="font-size:12px;color:var(--muted-2);margin-top:5px">.xlsx, .xls, .csv</div></div>
    <input type="file" id="impFile" accept=".xlsx,.xls,.csv" style="display:none">
    <div id="impProgress" style="display:none"><div class="imp-bar"><div id="impBar"></div></div><div class="imp-log" id="impLog"></div></div>
  </div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button></div>`);
  const drop=$('impDrop');
  $('impFile').onchange=e=>{if(e.target.files[0])handleImportFile(e.target.files[0],kind);};
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='var(--gold)';}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='';}));
  drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])handleImportFile(e.dataTransfer.files[0],kind);});
}
async function handleImportFile(file,kind){
  $('impProgress').style.display='block';const log=$('impLog'),bar=$('impBar');log.innerHTML='Đang đọc file…';
  try{
    const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    if(raw.length===0){log.innerHTML='⚠ File không có dữ liệu.';return;}
    const map=kind==='prod'?COLMAP_PROD:(kind==='cust'?COLMAP_CUST:COLMAP_TX);
    const idField=kind==='prod'?'maSP':(kind==='cust'?'maKH':'maGD');
    const idLabel=kind==='prod'?'Mã SP':(kind==='cust'?'Mã KH':'Mã GD');
    const keyMap={};Object.keys(raw[0]).forEach(k=>{const f=map[normKey(k)];if(f)keyMap[k]=f;});
    if(!Object.values(keyMap).includes(idField)){log.innerHTML=`⚠ Không tìm thấy cột <b>${idLabel}</b>. Kiểm tra tiêu đề cột.`;return;}
    const items=[];
    raw.forEach((r,idx)=>{
      const o={};Object.keys(keyMap).forEach(k=>{o[keyMap[k]]=r[k];});
      let idv=cleanStr(o[idField]);
      if(kind==='tx'&&!idv)idv='TRX-'+Date.now()+'-'+idx;
      if(!idv)return;
      if(kind==='prod'){items.push({maSP:cleanStr(o.maSP),tenSP:cleanStr(o.tenSP),danhMuc:cleanStr(o.danhMuc),giaNhap:toNum(o.giaNhap),giaBan:toNum(o.giaBan),giaVIP:toNum(o.giaVIP),giaBanBuon:toNum(o.giaBanBuon),tonKho:toNum(o.tonKho),tonKhoToiThieu:toNum(o.tonKhoToiThieu),donVi:cleanStr(o.donVi),vatPercent:toNum(o.vatPercent),barcode:cleanStr(o.barcode),maNCC:cleanStr(o.maNCC),thuongHieu:cleanStr(o.thuongHieu),tags:cleanStr(o.tags),trangThai:cleanStr(o.trangThai)||'Active',moTa:cleanStr(o.moTa),updatedAt:new Date().toISOString()});}
      else if(kind==='cust'){items.push({maKH:cleanStr(o.maKH),ten:cleanStr(o.ten),dienThoai:cleanStr(o.dienThoai),email:cleanStr(o.email),diaChi:cleanStr(o.diaChi),nhom:cleanStr(o.nhom),hang:cleanStr(o.hang),loai:cleanStr(o.loai)||'Cá nhân',congTy:cleanStr(o.congTy),maSoThue:cleanStr(o.maSoThue),congNo:toNum(o.congNo),ghiChu:cleanStr(o.ghiChu),updatedAt:new Date().toISOString()});}
      else{const rawLoai=cleanStr(o.loai).toLowerCase();const loai=(rawLoai==='income'||rawLoai==='thu')?'Thu':((rawLoai==='expense'||rawLoai==='chi')?'Chi':(rawLoai?cleanStr(o.loai):'Thu'));const d=parseVNDate(o.ngay);items.push({maGD:idv,ngay:d.iso,ngayHienThi:d.disp,ngaySort:d.sort,loai:loai,danhMuc:cleanStr(o.danhMuc),moTa:cleanStr(o.moTa),soTien:toNum(o.soTien),phuongThuc:cleanStr(o.phuongThuc),thamChieu:cleanStr(o.thamChieu),ghiChu:cleanStr(o.ghiChu),updatedAt:new Date().toISOString()});}
    });
    if(items.length===0){log.innerHTML=`⚠ Không có dòng hợp lệ.`;return;}
    log.innerHTML=`Đọc được <b>${items.length}</b> dòng. Đang ghi lên Firebase…`;
    const collection=kind==='prod'?COL.products:(kind==='cust'?COL.customers:COL.transactions);
    const idKey=idField;let done=0,err=0;
    for(let i=0;i<items.length;i+=400){
      const chunk=items.slice(i,i+400),batch=db.batch();
      chunk.forEach(it=>{batch.set(db.collection(collection).doc(slug(it[idKey])),it,{merge:true});});
      try{await batch.commit();done+=chunk.length;}catch(e){err+=chunk.length;console.error(e);}
      bar.style.width=Math.round((i+chunk.length)/items.length*100)+'%';log.innerHTML=`Đã ghi <b>${done}</b>/${items.length}…`;
    }
    bar.style.width='100%';log.innerHTML=`✅ Hoàn tất: <b>${done}</b> dòng đã lưu${err?` · ${err} lỗi`:''}.`;
    toast(`Đã nhập ${done} dòng`,'ok');
    if(kind==='prod'){await loadProducts();await loadCategories();setTimeout(()=>{closeModal();renderProducts();},1200);}
    else if(kind==='cust'){await loadCustomers();setTimeout(()=>{closeModal();renderCustomers();},1200);}
    else{await loadTransactions();setTimeout(()=>{closeModal();renderFinance();},1200);}
  }catch(e){console.error(e);log.innerHTML='✕ Lỗi đọc file: '+e.message;toast('Lỗi nhập file: '+e.message,'err');}
}

async function saveCustomer(id){
  const ma=$('fcMa').value.trim(),ten=$('fcTen').value.trim();if(!ma){toast('Nhập Mã KH','warn');return;}if(!ten){toast('Nhập tên khách hàng','warn');return;}
  const data={maKH:ma,ten:ten,loai:$('fcLoai').value,dienThoai:$('fcDt').value.trim(),email:$('fcEmail').value.trim(),diaChi:$('fcDiaChi').value.trim(),nhom:$('fcNhom').value.trim(),hang:$('fcHang').value.trim(),congTy:$('fcCongTy').value.trim(),maSoThue:$('fcMst').value.trim(),congNo:Number($('fcNo').value)||0,ghiChu:$('fcGhiChu').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveCustBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{if(id){await db.collection(COL.customers).doc(id).set(data,{merge:true});toast('Đã cập nhật','ok');}else{const docId=slug(ma);const ex=await db.collection(COL.customers).doc(docId).get();if(ex.exists){toast('Mã KH đã tồn tại','err');btn.disabled=false;btn.textContent='Thêm khách hàng';return;}data.createdAt=new Date().toISOString();await db.collection(COL.customers).doc(docId).set(data);toast('Đã thêm','ok');}closeModal();await loadCustomers();renderCustomers();}catch(e){console.error(e);toast('Lỗi lưu: '+e.message,'err');btn.disabled=false;btn.textContent='Lưu';}
}

async function confirmDeleteCustomer(id){const b=$('delCustBtn');b.disabled=true;b.textContent='Đang xóa…';try{await db.collection(COL.customers).doc(id).delete();toast('Đã xóa','ok');closeModal();await loadCustomers();renderCustomers();}catch(e){toast('Lỗi xóa: '+e.message,'err');b.disabled=false;b.textContent='Xóa vĩnh viễn';}}
function exportCustomers(){const rows=filteredCustomers().map(c=>({'Mã KH':c.maKH||'','Tên':c.ten||'','Số điện thoại':c.dienThoai||'','Email':c.email||'','Địa chỉ':c.diaChi||'','Nhóm':c.nhom||'','Hạng':c.hang||'','Loại':c.loai||'','Công ty':c.congTy||'','Mã số thuế':c.maSoThue||'','Công nợ':c.congNo||0,'Ghi chú':c.ghiChu||''}));if(rows.length===0){toast('Không có dữ liệu','warn');return;}const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Khách hàng');XLSX.writeFile(wb,'KhachHang_ThienAn_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Đã xuất '+rows.length+' khách hàng','ok');}

async function saveTx(id){
  const tien=Number($('ftTien').value)||0;if(tien<=0){toast('Nhập số tiền','warn');return;}
  const d=parseVNDate($('ftNgay').value);
  let ma=$('ftMa').value.trim();if(!ma)ma='TRX-'+Date.now();
  const data={maGD:ma,loai:$('ftLoai').value,ngay:$('ftNgay').value,ngayHienThi:d.disp||$('ftNgay').value,ngaySort:d.sort||Date.now(),soTien:tien,danhMuc:$('ftDanhMuc').value.trim(),phuongThuc:$('ftPttt').value.trim(),moTa:$('ftMoTa').value.trim(),ghiChu:$('ftGhiChu').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveTxBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{if(id){await db.collection(COL.transactions).doc(id).set(data,{merge:true});toast('Đã cập nhật','ok');}else{data.createdAt=new Date().toISOString();await db.collection(COL.transactions).doc(slug(ma)).set(data);toast('Đã thêm giao dịch','ok');}closeModal();await loadTransactions();renderFinance();}catch(e){console.error(e);toast('Lỗi lưu: '+e.message,'err');btn.disabled=false;btn.textContent='Lưu';}
}
function deleteTx(id){const t=TRANSACTIONS.find(x=>x._id===id);if(!t)return;openModal(`<div class="modal-head"><h3>Xóa giao dịch</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.6">Xóa giao dịch <b>${esc(t.maGD)}</b> (${money(t.soTien)}₫)?<br><span style="color:var(--muted);font-size:13px">Không thể hoàn tác.</span></p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delTxBtn" onclick="confirmDeleteTx('${esc(id)}')">Xóa</button></div>`,'sm');}
async function confirmDeleteTx(id){const b=$('delTxBtn');b.disabled=true;b.textContent='Đang xóa…';try{await db.collection(COL.transactions).doc(id).delete();toast('Đã xóa','ok');closeModal();await loadTransactions();renderFinance();}catch(e){toast('Lỗi xóa: '+e.message,'err');b.disabled=false;b.textContent='Xóa';}}
function exportTx(){const rows=filteredTx().map(t=>({'Mã GD':t.maGD||'','Ngày':t.ngayHienThi||'','Loại':t.loai||'','Danh Mục':t.danhMuc||'','Mô Tả':t.moTa||'','Số Tiền':t.soTien||0,'Phương Thức TT':t.phuongThuc||'','Ghi Chú':t.ghiChu||''}));if(rows.length===0){toast('Không có dữ liệu','warn');return;}const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Giao dịch');XLSX.writeFile(wb,'ThuChi_ThienAn_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Đã xuất '+rows.length+' giao dịch','ok');}

function addFirstMatch(){

function setPaid(mode){

function updateOrderTotals(){
  let sub=0;ORDER_CART.forEach((it,i)=>{const tt=(Number(it.donGia)||0)*(Number(it.qty)||0);sub+=tt;const c=$('cartTt'+i);if(c)c.textContent=money(tt);});
  const ck=Number($('ordDiscount')?.value)||0;const phi=Number($('ordPhi')?.value)||0;const total=Math.max(0,sub-ck+phi);
  if($('ordSubtotal'))$('ordSubtotal').textContent=money(sub);
  if($('ordTotal'))$('ordTotal').textContent=money(total);
  if(!ORDER_PAID_EDITED&&$('ordPaid'))$('ordPaid').value=total;
  const paid=Number($('ordPaid')?.value)||0;
  if($('ordConNo'))$('ordConNo').textContent=money(Math.max(0,total-paid));

}
function addMonthsToDate(iso,months){if(!iso||!months)return null;const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,(m-1)+Number(months),d);return dt;}
function fmtDate(dt){if(!dt)return '';return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;}
function updateWarrantyHint(){
  const thang=Number($('ordBaoHanh')?.value)||0;const hint=$('ordBhHint');if(!hint)return;
  if(thang<=0){hint.style.display='none';return;}
  const from=$('ordDate')?.value;const to=addMonthsToDate(from,thang);
  hint.style.display='block';hint.textContent=`Từ ${fmtDate(new Date(from))} đến ${fmtDate(to)}`;
}
function buildQrUrl(amount,info){
  if(!BANK_INFO||!BANK_INFO.accountNo||!BANK_INFO.bankCode)return '';
  const base=`https://img.vietqr.io/image/${encodeURIComponent(BANK_INFO.bankCode)}-${encodeURIComponent(BANK_INFO.accountNo)}-compact2.png`;
  const p=new URLSearchParams();if(amount>0)p.set('amount',String(Math.round(amount)));if(info)p.set('addInfo',info);if(BANK_INFO.accountName)p.set('accountName',BANK_INFO.accountName);
  return base+'?'+p.toString();
}

function genOrderCode(){const d=new Date();const ymd=`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;const r=Math.random().toString(36).slice(2,6).toUpperCase();return 'DH'+ymd+'-'+r;}
async function saveOrder(){
  if(ORDER_CART.length===0){toast('Chưa có sản phẩm trong đơn','warn');return;}
  const custId=$('ordCust').value;const cust=custId==='le'?null:CUSTOMERS.find(c=>c._id===custId);
  const d=parseVNDate($('ordDate').value);
  const items=ORDER_CART.map(it=>({maSP:it.maSP,ten:it.ten,donGia:Number(it.donGia)||0,qty:Number(it.qty)||0,thanhTien:(Number(it.donGia)||0)*(Number(it.qty)||0),laDichVu:!!it.laDichVu,prodId:it.id}));
  const sub=items.reduce((s,it)=>s+it.thanhTien,0);
  const ck=Number($('ordDiscount').value)||0;
  const phi=Number($('ordPhi').value)||0;
  const phiLabel=$('ordPhiLabel').value.trim();
  const total=Math.max(0,sub-ck+phi);
  const paid=Number($('ordPaid').value)||0;
  const conNo=Math.max(0,total-paid);
  if(conNo>0&&!cust){toast('Khách lẻ phải thanh toán đủ. Chọn khách hàng nếu muốn ghi nợ.','warn');return;}
  const bhThang=Number($('ordBaoHanh').value)||0;
  const bhDen=bhThang>0?fmtDate(addMonthsToDate($('ordDate').value,bhThang)):'';
  const maDon=genOrderCode();
  const order={maDon,ngay:$('ordDate').value,ngayHienThi:d.disp||$('ordDate').value,ngaySort:d.sort||Date.now(),khachId:cust?cust._id:'',khachTen:cust?cust.ten:'Khách lẻ',khachSDT:cust?(cust.dienThoai||''):'',items,tongHang:sub,chietKhau:ck,phiVanChuyen:phi,phiLabel:phiLabel||'Phí vận chuyển/cẩu',tongCong:total,daTra:paid,conNo,phuongThuc:$('ordPttt').value||'Tiền mặt',baoHanhThang:bhThang,baoHanhTu:bhThang>0?(d.disp||$('ordDate').value):'',baoHanhDen:bhDen,ghiChu:$('ordNote').value.trim(),createdBy:CURRENT_USER.hoTen,createdAt:new Date().toISOString()};
  const btn=$('saveOrdBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{
    // 1) ghi đơn
    await db.collection(COL.orders).doc(slug(maDon)).set(order);
    // 2) trừ tồn kho (bỏ qua dịch vụ)
    const batch=db.batch();
    items.forEach(it=>{if(!it.laDichVu&&it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(-it.qty)});}});
    // 3) cộng công nợ khách
    if(conNo>0&&cust){batch.update(db.collection(COL.customers).doc(cust._id),{congNo:FV().increment(conNo)});}
    await batch.commit();
    // 4) ghi khoản Thu vào sổ thu chi (nếu có tiền)
    if(paid>0){const txId='TRX-'+slug(maDon);await db.collection(COL.transactions).doc(txId).set({maGD:txId,loai:'Thu',ngay:order.ngay,ngayHienThi:order.ngayHienThi,ngaySort:order.ngaySort,soTien:paid,danhMuc:'Bán hàng',moTa:'Thu tiền đơn '+maDon+(cust?' - '+cust.ten:''),phuongThuc:order.phuongThuc,thamChieu:maDon,refOrderId:maDon,ghiChu:'',createdAt:new Date().toISOString()});}
    toast('Đã tạo đơn '+maDon,'ok');
    closeModal();
    await Promise.all([loadOrders(),loadProducts(),loadCustomers(),loadTransactions()]);
    renderOrders();
  }catch(e){console.error(e);toast('Lỗi tạo đơn: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Lưu đơn & thu tiền';}
}

function deleteOrder(id){

async function confirmDeleteOrder(id){
  const o=ORDERS.find(x=>x._id===id);if(!o)return;
  const btn=$('delOrdBtn');btn.disabled=true;btn.textContent='Đang xử lý…';
  try{
    const batch=db.batch();
    // hoàn tồn kho
    (o.items||[]).forEach(it=>{if(!it.laDichVu&&it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(Number(it.qty)||0)});}});
    // trừ công nợ đã cộng
    if((Number(o.conNo)||0)>0&&o.khachId){batch.update(db.collection(COL.customers).doc(o.khachId),{congNo:FV().increment(-(Number(o.conNo)||0))});}
    await batch.commit();
    // xóa khoản thu liên quan
    try{const txSnap=await db.collection(COL.transactions).where('refOrderId','==',o.maDon).get();const b2=db.batch();txSnap.forEach(d=>b2.delete(d.ref));await b2.commit();}catch(e){console.warn('Xóa thu liên quan:',e);}
    // xóa đơn
    await db.collection(COL.orders).doc(id).delete();
    toast('Đã xóa đơn & hoàn tác','ok');
    closeModal();
    await Promise.all([loadOrders(),loadProducts(),loadCustomers(),loadTransactions()]);
    renderOrders();
  }catch(e){console.error(e);toast('Lỗi xóa đơn: '+e.message,'err');btn.disabled=false;btn.textContent='Xóa & hoàn tác';}
}

}
function supRow(x){

      ${no>0?`<div style="background:var(--danger-bg);border-radius:11px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center"><span style="color:var(--danger);font-weight:600;font-size:13px">Nợ phải trả</span><span style="color:var(--danger);font-weight:800;font-size:20px">${money(no)}₫</span></div>`:`<div style="background:var(--ok-bg);border-radius:11px;padding:12px 16px;margin-bottom:16px;color:var(--ok);font-weight:600;font-size:13px;text-align:center">✓ Không nợ</div>`}
      <div>${info('Điện thoại',x.dienThoai?esc(x.dienThoai):'')}${info('Email',x.email?esc(x.email):'')}${info('Địa chỉ',x.diaChi?esc(x.diaChi):'')}${info('Người liên hệ',x.nguoiLienHe?esc(x.nguoiLienHe):'')}${info('Số phiếu nhập',purs.length?money(purs.length):'')}${x.ghiChu?`<div style="padding:12px 0"><div style="color:var(--muted);font-size:13px;margin-bottom:6px">Ghi chú</div><div style="font-size:13.5px;background:#fafbfc;border-radius:9px;padding:11px 13px">${esc(x.ghiChu)}</div></div>`:''}</div>
    </div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button><button class="btn btn-primary" onclick="openSupplierForm('${esc(id)}')">✎ Sửa</button></div>`);
}

async function saveSupplier(id){
  const ma=$('fsMa').value.trim(),ten=$('fsTen').value.trim();
  if(!ma){toast('Nhập Mã NCC','warn');return;}if(!ten){toast('Nhập tên NCC','warn');return;}
  const data={maNCC:ma,tenNCC:ten,dienThoai:$('fsDt').value.trim(),email:$('fsEmail').value.trim(),nguoiLienHe:$('fsLH').value.trim(),diaChi:$('fsDiaChi').value.trim(),congNo:Number($('fsNo').value)||0,ghiChu:$('fsGhiChu').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveSupBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{if(id){await db.collection(COL.suppliers).doc(id).set(data,{merge:true});toast('Đã cập nhật','ok');}else{const docId=slug(ma);const ex=await db.collection(COL.suppliers).doc(docId).get();if(ex.exists){toast('Mã NCC đã tồn tại','err');btn.disabled=false;btn.textContent='Thêm NCC';return;}data.createdAt=new Date().toISOString();await db.collection(COL.suppliers).doc(docId).set(data);toast('Đã thêm NCC','ok');}closeModal();await loadSuppliers();renderSuppliers();}catch(e){toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent='Lưu';}
}
function deleteSupplier(id){const x=SUPPLIERS.find(s=>s._id===id);if(!x)return;openModal(`<div class="modal-head"><h3>Xóa nhà cung cấp</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.6">Xóa <b>${esc(x.tenNCC)}</b> (${esc(x.maNCC)})?</p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delSupBtn" onclick="confirmDeleteSupplier('${esc(id)}')">Xóa</button></div>`,'sm');}
async function confirmDeleteSupplier(id){const b=$('delSupBtn');b.disabled=true;b.textContent='Đang xóa…';try{await db.collection(COL.suppliers).doc(id).delete();toast('Đã xóa','ok');closeModal();await loadSuppliers();renderSuppliers();}catch(e){toast('Lỗi: '+e.message,'err');b.disabled=false;b.textContent='Xóa';}}

/* ===== NHẬP HÀNG ===== */
async function loadPurchases(){try{const s=await db.collection(COL.purchases).get();PURCHASES=s.docs.map(d=>({_id:d.id,...d.data()}));PURCHASES.sort((a,b)=>(b.ngaySort||0)-(a.ngaySort||0));}catch(e){console.error(e);PURCHASES=[];}}
let purFilter={q:'',page:1,per:20};
function purchaseStats(){const count=PURCHASES.length,tong=PURCHASES.reduce((s,p)=>s+(Number(p.tongTien)||0),0),daTra=PURCHASES.reduce((s,p)=>s+(Number(p.daTra)||0),0),conNo=PURCHASES.reduce((s,p)=>s+(Number(p.conNo)||0),0);return {count,tong,daTra,conNo};}
function renderPurchases(){
  const st=purchaseStats();
  $('view').innerHTML=`
    <div class="stat-grid">
      <div class="stat g1"><div class="ic">📥</div><div class="lbl">Tổng phiếu nhập</div><div class="val">${money(st.count)}</div></div>
      <div class="stat g3"><div class="ic">💰</div><div class="lbl">Tổng tiền nhập</div><div class="val" style="font-size:19px">${money(st.tong)}<span style="font-size:12px"> ₫</span></div></div>
      <div class="stat g2"><div class="ic">✓</div><div class="lbl">Đã trả NCC</div><div class="val" style="font-size:19px">${money(st.daTra)}<span style="font-size:12px"> ₫</span></div></div>
      <div class="stat g4"><div class="ic">⏳</div><div class="lbl">Còn nợ NCC</div><div class="val" style="font-size:19px">${money(st.conNo)}<span style="font-size:12px"> ₫</span></div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Danh sách phiếu nhập</h3><div class="tools"><div class="search"><span class="si">🔍</span><input id="purSearch" placeholder="Tìm mã phiếu, NCC…" value="${esc(purFilter.q)}"></div><button class="btn btn-primary btn-sm" onclick="openPurchaseForm()">＋ Tạo phiếu nhập</button></div></div><div id="purTableWrap"><div class="spin"></div></div></div>`;
  $('purSearch').oninput=e=>{purFilter.q=e.target.value;purFilter.page=1;drawPurchaseTable();};
  drawPurchaseTable();
}
function filteredPurchases(){const q=purFilter.q.toLowerCase().trim();return PURCHASES.filter(p=>{if(q){const hay=[p.maPhieu,p.nccTen].join(' ').toLowerCase();if(!hay.includes(q))return false;}return true;});}
function drawPurchaseTable(){
  const wrap=$('purTableWrap');if(!wrap)return;const all=filteredPurchases();
  if(all.length===0){wrap.innerHTML=PURCHASES.length===0?`<div class="empty"><div class="em-ic">📥</div><h4>Chưa có phiếu nhập</h4><p>Tạo phiếu nhập để cộng tồn kho và ghi công nợ nhà cung cấp.</p><button class="btn btn-primary btn-sm" onclick="openPurchaseForm()">＋ Tạo phiếu nhập</button></div>`:`<div class="empty"><div class="em-ic">🔍</div><h4>Không tìm thấy</h4></div>`;return;}
  const per=purFilter.per,pages=Math.ceil(all.length/per);if(purFilter.page>pages)purFilter.page=pages;const st=(purFilter.page-1)*per,rows=all.slice(st,st+per);
  wrap.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Mã phiếu</th><th>Ngày</th><th>Nhà cung cấp</th><th class="t-num">Số món</th><th class="t-num">Tổng tiền</th><th class="t-num">Còn nợ</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>${rows.map(purRow).join('')}</tbody></table></div>
    <div class="tbl-foot"><span>Hiển thị ${st+1}–${Math.min(st+per,all.length)} / <b>${money(all.length)}</b> phiếu</span><div class="pg"><button ${purFilter.page<=1?'disabled':''} onclick="purFilter.page--;drawPurchaseTable()">‹ Trước</button><span style="padding:0 6px">Trang ${purFilter.page}/${pages}</span><button ${purFilter.page>=pages?'disabled':''} onclick="purFilter.page++;drawPurchaseTable()">Sau ›</button></div></div>`;
}
function purRow(p){
  const conNo=Number(p.conNo)||0;const paid=Number(p.daTra)||0,total=Number(p.tongTien)||0;
  const stt=paid>=total&&total>0?'<span class="chip ok">● Đã trả đủ</span>':(paid<=0?'<span class="chip low">○ Chưa trả</span>':'<span class="chip vip">◐ Trả một phần</span>');
  const noCell=conNo>0?`<span style="color:var(--danger);font-weight:700">${money(conNo)}</span>`:'<span style="color:var(--muted-2)">—</span>';
  return `<tr style="cursor:pointer" onclick="openPurchaseDetail('${esc(p._id)}')"><td class="t-code">${esc(p.maPhieu||'')}</td><td style="white-space:nowrap">${esc(p.ngayHienThi||'—')}</td><td class="t-name">${esc(p.nccTen||'—')}</td><td class="t-num">${(p.items||[]).length}</td><td class="t-num t-price">${money(p.tongTien)}</td><td class="t-num">${noCell}</td><td>${stt}</td><td><div class="row-act"><button class="icon-btn" onclick="event.stopPropagation();openPurchaseDetail('${esc(p._id)}')">👁</button><button class="icon-btn del" onclick="event.stopPropagation();deletePurchase('${esc(p._id)}')">🗑</button></div></td></tr>`;
}
function genPurCode(){const d=new Date();const ymd=`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;return 'PN'+ymd+'-'+Math.random().toString(36).slice(2,6).toUpperCase();}
function openPurchaseForm(){
  PURCHASE_CART=[];PUR_PAID_EDITED=false;
  const nccOpts='<option value="">— Chọn nhà cung cấp —</option>'+SUPPLIERS.map(x=>`<option value="${esc(x._id)}">${esc(x.maNCC)} — ${esc(x.tenNCC)}</option>`).join('');
  const prodList=PRODUCTS.map(p=>`<option value="${esc(p.maSP)} — ${esc(p.tenSP)}">`).join('');
  const today=new Date();const defDate=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  openModal(`<div class="modal-head"><h3>Tạo phiếu nhập hàng</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="grid2" style="margin-bottom:14px">
        <div class="field" style="margin:0"><label>Nhà cung cấp</label><select id="purNcc">${nccOpts}</select></div>
        <div class="field" style="margin:0"><label>Ngày nhập</label><input id="purDate" type="date" value="${defDate}"></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="purProdInput" list="purProdList" placeholder="Gõ tên/mã sản phẩm để thêm…" style="flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px">
        <datalist id="purProdList">${prodList}</datalist>
        <button class="btn btn-primary btn-sm" onclick="addPurItem()">＋ Thêm</button>
      </div>
      <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:10px;margin-bottom:16px"><table><thead><tr><th>Sản phẩm</th><th style="width:130px">Giá nhập</th><th style="width:70px;text-align:center">SL</th><th class="t-num" style="width:120px">Thành tiền</th><th style="width:40px"></th></tr></thead><tbody id="purCartBody"></tbody></table></div>
      <div class="grid2">
        <div>
          <div class="field"><label>Phương thức TT</label><input id="purPttt" value="Tiền mặt"></div>
          <div class="field" style="margin:0"><label>Ghi chú</label><input id="purNote" placeholder="Ghi chú phiếu nhập"></div>
        </div>
        <div style="background:#fafbfc;border-radius:11px;padding:16px">
          <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:16px;border-bottom:1px solid var(--line)"><b>Tổng tiền nhập</b><b id="purTotal" style="color:var(--gold-2)">0</b></div>
          <div class="field" style="margin:10px 0 6px"><label>Đã trả NCC (₫)</label><input id="purPaid" type="number" placeholder="0" oninput="PUR_PAID_EDITED=true;updatePurTotals()"></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px"><span style="color:var(--muted)">Còn nợ NCC</span><b id="purConNo" style="color:var(--danger)">0</b></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="savePurBtn" onclick="savePurchase()">💾 Lưu phiếu nhập</button></div>`);
  $('purProdInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addPurItem();}});
  renderPurCart();
}
function addPurItem(){
  const val=$('purProdInput').value.trim();if(!val)return;
  const maSP=val.split(' — ')[0].trim();
  const p=PRODUCTS.find(x=>String(x.maSP)===maSP)||PRODUCTS.find(x=>x.tenSP===val);
  if(!p){toast('Không tìm thấy sản phẩm. Chọn từ gợi ý.','warn');return;}
  const ex=PURCHASE_CART.find(it=>it.id===p._id);
  if(ex)ex.qty++;else PURCHASE_CART.push({id:p._id,maSP:p.maSP,ten:p.tenSP,gia:Number(p.giaNhap)||0,qty:1});
  $('purProdInput').value='';renderPurCart();
}
function removePurItem(i){PURCHASE_CART.splice(i,1);renderPurCart();}
function renderPurCart(){
  const body=$('purCartBody');if(!body)return;
  if(PURCHASE_CART.length===0){body.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--muted-2);padding:22px">Chưa có sản phẩm. Gõ tên rồi bấm Thêm.</td></tr>';updatePurTotals();return;}
  body.innerHTML=PURCHASE_CART.map((it,i)=>`<tr>
    <td><div style="font-weight:600;font-size:13.5px">${esc(it.ten)}</div><small style="color:var(--muted-2)">${esc(it.maSP)}</small></td>
    <td><input type="number" value="${it.gia}" oninput="PURCHASE_CART[${i}].gia=Number(this.value)||0;PUR_PAID_EDITED=false;updatePurTotals()" style="width:118px;padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;text-align:right"></td>
    <td><input type="number" min="1" value="${it.qty}" oninput="PURCHASE_CART[${i}].qty=Number(this.value)||0;PUR_PAID_EDITED=false;updatePurTotals()" style="width:56px;padding:7px;border:1.5px solid var(--line);border-radius:7px;text-align:center"></td>
    <td class="t-num t-price" id="purTt${i}">${money(it.gia*it.qty)}</td>
    <td><button class="icon-btn del" onclick="removePurItem(${i})">🗑</button></td>
  </tr>`).join('');
  updatePurTotals();
}
function updatePurTotals(){
  let sub=0;PURCHASE_CART.forEach((it,i)=>{const tt=(Number(it.gia)||0)*(Number(it.qty)||0);sub+=tt;const c=$('purTt'+i);if(c)c.textContent=money(tt);});
  if($('purTotal'))$('purTotal').textContent=money(sub);
  if(!PUR_PAID_EDITED&&$('purPaid'))$('purPaid').value=sub;
  const paid=Number($('purPaid')?.value)||0;
  if($('purConNo'))$('purConNo').textContent=money(Math.max(0,sub-paid));
}
async function savePurchase(){
  if(PURCHASE_CART.length===0){toast('Chưa có sản phẩm trong phiếu','warn');return;}
  const nccId=$('purNcc').value;const ncc=nccId?SUPPLIERS.find(s=>s._id===nccId):null;
  const d=parseVNDate($('purDate').value);
  const items=PURCHASE_CART.map(it=>({maSP:it.maSP,ten:it.ten,gia:Number(it.gia)||0,qty:Number(it.qty)||0,thanhTien:(Number(it.gia)||0)*(Number(it.qty)||0),prodId:it.id}));
  const total=items.reduce((s,it)=>s+it.thanhTien,0);
  const paid=Number($('purPaid').value)||0;
  const conNo=Math.max(0,total-paid);
  if(conNo>0&&!ncc){toast('Còn nợ NCC — hãy chọn nhà cung cấp để ghi công nợ.','warn');return;}
  const maPhieu=genPurCode();
  const pur={maPhieu,ngay:$('purDate').value,ngayHienThi:d.disp||$('purDate').value,ngaySort:d.sort||Date.now(),nccId:ncc?ncc._id:'',nccTen:ncc?ncc.tenNCC:'(Không chọn NCC)',items,tongTien:total,daTra:paid,conNo,phuongThuc:$('purPttt').value.trim()||'Tiền mặt',ghiChu:$('purNote').value.trim(),createdBy:CURRENT_USER.hoTen,createdAt:new Date().toISOString()};
  const btn=$('savePurBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{
    await db.collection(COL.purchases).doc(slug(maPhieu)).set(pur);
    const batch=db.batch();
    items.forEach(it=>{if(it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(it.qty),giaNhap:it.gia});}});
    if(conNo>0&&ncc){batch.update(db.collection(COL.suppliers).doc(ncc._id),{congNo:FV().increment(conNo)});}
    await batch.commit();
    if(paid>0){const txId='TRX-'+slug(maPhieu);await db.collection(COL.transactions).doc(txId).set({maGD:txId,loai:'Chi',ngay:pur.ngay,ngayHienThi:pur.ngayHienThi,ngaySort:pur.ngaySort,soTien:paid,danhMuc:'Nhập hàng',moTa:'Trả tiền nhập '+maPhieu+(ncc?' - '+ncc.tenNCC:''),phuongThuc:pur.phuongThuc,thamChieu:maPhieu,refPurchaseId:maPhieu,ghiChu:'',createdAt:new Date().toISOString()});}
    toast('Đã tạo phiếu nhập '+maPhieu,'ok');
    closeModal();
    await Promise.all([loadPurchases(),loadProducts(),loadSuppliers(),loadTransactions()]);
    renderPurchases();
  }catch(e){console.error(e);toast('Lỗi tạo phiếu: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Lưu phiếu nhập';}
}
function openPurchaseDetail(id){
  const p=PURCHASES.find(x=>x._id===id);if(!p)return;
  const rows=(p.items||[]).map((it,i)=>`<tr><td style="color:var(--muted)">${i+1}</td><td class="t-name">${esc(it.ten)}<small>${esc(it.maSP)}</small></td><td class="t-num">${money(it.gia)}</td><td class="t-num">${money(it.qty)}</td><td class="t-num t-price">${money(it.thanhTien)}</td></tr>`).join('');
  openModal(`<div class="modal-head"><h3>Phiếu nhập ${esc(p.maPhieu)}</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px"><div><div style="font-size:13px;color:var(--muted)">Nhà cung cấp</div><div style="font-size:16px;font-weight:700">${esc(p.nccTen||'')}</div></div><div style="text-align:right;color:var(--muted);font-size:13px">${esc(p.ngayHienThi||'')}</div></div>
      <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:10px;margin-bottom:16px"><table><thead><tr><th>#</th><th>Sản phẩm</th><th class="t-num">Giá nhập</th><th class="t-num">SL</th><th class="t-num">Thành tiền</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="background:#fafbfc;border-radius:11px;padding:16px">
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:16px"><b>Tổng tiền</b><b style="color:var(--gold-2)">${money(p.tongTien)}₫</b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px"><span style="color:var(--ok)">Đã trả</span><b style="color:var(--ok)">${money(p.daTra)}₫</b></div>
        ${p.conNo>0?`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px"><span style="color:var(--danger)">Còn nợ NCC</span><b style="color:var(--danger)">${money(p.conNo)}₫</b></div>`:''}
      </div>
      ${p.ghiChu?`<div style="margin-top:12px;font-size:13px;color:var(--muted)">📝 ${esc(p.ghiChu)}</div>`:''}
      <div style="margin-top:8px;font-size:12px;color:var(--muted-2)">Người tạo: ${esc(p.createdBy||'')} · PTTT: ${esc(p.phuongThuc||'')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button><button class="btn btn-danger" onclick="deletePurchase('${esc(id)}')">🗑 Xóa phiếu</button></div>`);
}
function deletePurchase(id){const p=PURCHASES.find(x=>x._id===id);if(!p)return;openModal(`<div class="modal-head"><h3>Xóa phiếu nhập</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.7">Xóa phiếu <b>${esc(p.maPhieu)}</b> (${money(p.tongTien)}₫)?<br><span style="color:var(--muted);font-size:13px">Hệ thống sẽ tự <b>trừ lại tồn kho</b>, <b>giảm nợ NCC</b> và <b>xóa khoản chi</b> liên quan.</span></p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delPurBtn" onclick="confirmDeletePurchase('${esc(id)}')">Xóa & hoàn tác</button></div>`,'sm');}
async function confirmDeletePurchase(id){
  const p=PURCHASES.find(x=>x._id===id);if(!p)return;const btn=$('delPurBtn');btn.disabled=true;btn.textContent='Đang xử lý…';
  try{
    const batch=db.batch();
    (p.items||[]).forEach(it=>{if(it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(-(Number(it.qty)||0))});}});
    if((Number(p.conNo)||0)>0&&p.nccId){batch.update(db.collection(COL.suppliers).doc(p.nccId),{congNo:FV().increment(-(Number(p.conNo)||0))});}
    await batch.commit();
    try{const s=await db.collection(COL.transactions).where('refPurchaseId','==',p.maPhieu).get();const b2=db.batch();s.forEach(d=>b2.delete(d.ref));await b2.commit();}catch(e){}
    await db.collection(COL.purchases).doc(id).delete();
    toast('Đã xóa phiếu & hoàn tác','ok');closeModal();
    await Promise.all([loadPurchases(),loadProducts(),loadSuppliers(),loadTransactions()]);renderPurchases();
  }catch(e){console.error(e);toast('Lỗi xóa: '+e.message,'err');btn.disabled=false;btn.textContent='Xóa & hoàn tác';}
}

/* ===== KIỂM KHO ===== */
let invFilter={q:''};
async function loadStockChecks(){try{const s=await db.collection(COL.stockchecks).orderBy('ngaySort','desc').limit(30).get();STOCKCHECKS=s.docs.map(d=>({_id:d.id,...d.data()}));}catch(e){STOCKCHECKS=[];}}
function renderInventory(){
  $('view').innerHTML=`
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head"><h3>Kiểm kho — đối chiếu & điều chỉnh tồn</h3><div class="tools"><div class="search"><span class="si">🔍</span><input id="invSearch" placeholder="Tìm sản phẩm cần kiểm…" value="${esc(invFilter.q)}"></div></div></div>
      <div style="padding:12px 20px;background:#fafbfc;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)">💡 Nhập <b>tồn thực tế đếm được</b> vào ô, hệ thống hiện chênh lệch. Bấm <b>Cập nhật</b> để chỉnh tồn về đúng thực tế (có ghi lịch sử).</div>
      <div id="invTableWrap"></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Lịch sử điều chỉnh gần đây</h3></div><div id="invHistWrap"><div class="spin"></div></div></div>`;
  $('invSearch').oninput=e=>{invFilter.q=e.target.value;drawInventory();};
  drawInventory();
  loadStockChecks().then(drawStockHistory);
}
function drawInventory(){
  const wrap=$('invTableWrap');if(!wrap)return;const q=invFilter.q.toLowerCase().trim();
  if(!q){wrap.innerHTML='<div class="empty" style="padding:34px"><div class="em-ic">🔍</div><h4>Gõ tên sản phẩm để kiểm kho</h4><p>Để tránh tải nặng, hãy tìm sản phẩm cần kiểm thay vì hiện toàn bộ.</p></div>';return;}
  const list=PRODUCTS.filter(p=>[p.maSP,p.tenSP,p.barcode].join(' ').toLowerCase().includes(q)).slice(0,50);
  if(list.length===0){wrap.innerHTML='<div class="empty" style="padding:34px"><div class="em-ic">🔍</div><h4>Không tìm thấy</h4></div>';return;}
  wrap.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Mã SP</th><th>Tên sản phẩm</th><th class="t-num">Tồn hệ thống</th><th style="width:120px;text-align:center">Tồn thực tế</th><th class="t-num">Chênh lệch</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>${list.map(invRow).join('')}</tbody></table></div>`;
}
function invRow(p){
  const cur=Number(p.tonKho)||0;
  return `<tr><td class="t-code">${esc(p.maSP||'')}</td><td class="t-name">${esc(p.tenSP||'')}</td><td class="t-num"><b>${money(cur)}</b> ${esc(p.donVi||'')}</td>
    <td><input type="number" id="inv_${esc(p._id)}" value="${cur}" oninput="invDiff('${esc(p._id)}',${cur})" style="width:100px;padding:7px;border:1.5px solid var(--line);border-radius:7px;text-align:center"></td>
    <td class="t-num" id="invd_${esc(p._id)}"><span style="color:var(--muted-2)">0</span></td>
    <td><div class="row-act"><button class="btn btn-ghost btn-sm" id="invb_${esc(p._id)}" onclick="adjustStock('${esc(p._id)}',${cur})" disabled style="opacity:.5">Cập nhật</button></div></td></tr>`;
}
function invDiff(id,cur){
  const val=Number($('inv_'+id).value)||0;const diff=val-cur;
  const cell=$('invd_'+id),btn=$('invb_'+id);
  if(cell)cell.innerHTML=diff===0?'<span style="color:var(--muted-2)">0</span>':`<b style="color:${diff>0?'var(--ok)':'var(--danger)'}">${diff>0?'+':''}${money(diff)}</b>`;
  if(btn){btn.disabled=diff===0;btn.style.opacity=diff===0?'.5':'1';}
}
async function adjustStock(id,cur){
  const p=PRODUCTS.find(x=>x._id===id);if(!p)return;
  const val=Number($('inv_'+id).value)||0;const diff=val-cur;if(diff===0)return;
  const btn=$('invb_'+id);btn.disabled=true;btn.textContent='…';
  try{
    await db.collection(COL.products).doc(id).update({tonKho:val,updatedAt:new Date().toISOString()});
    const now=new Date();
    await db.collection(COL.stockchecks).add({maSP:p.maSP,ten:p.tenSP,tonTruoc:cur,tonSau:val,chenhLech:diff,ngayHienThi:now.toLocaleDateString('vi-VN'),ngaySort:now.getTime(),nguoi:CURRENT_USER.hoTen,createdAt:now.toISOString()});
    toast(`Đã cập nhật tồn ${p.maSP}: ${money(cur)} → ${money(val)}`,'ok');
    await loadProducts();drawInventory();loadStockChecks().then(drawStockHistory);
  }catch(e){console.error(e);toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent='Cập nhật';}
}
function drawStockHistory(){
  const wrap=$('invHistWrap');if(!wrap)return;
  if(STOCKCHECKS.length===0){wrap.innerHTML='<div class="empty" style="padding:30px"><p>Chưa có điều chỉnh nào.</p></div>';return;}
  wrap.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Mã SP</th><th>Sản phẩm</th><th class="t-num">Trước</th><th class="t-num">Sau</th><th class="t-num">Chênh lệch</th><th>Người</th></tr></thead><tbody>${STOCKCHECKS.map(h=>`<tr><td style="white-space:nowrap">${esc(h.ngayHienThi||'')}</td><td class="t-code">${esc(h.maSP||'')}</td><td class="t-name">${esc(h.ten||'')}</td><td class="t-num">${money(h.tonTruoc)}</td><td class="t-num"><b>${money(h.tonSau)}</b></td><td class="t-num"><b style="color:${h.chenhLech>0?'var(--ok)':'var(--danger)'}">${h.chenhLech>0?'+':''}${money(h.chenhLech)}</b></td><td>${esc(h.nguoi||'')}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ===== CẤU HÌNH TÀI KHOẢN NGÂN HÀNG ===== */
async function loadSettings(){try{const d=await db.collection(COL.settings).doc('bank').get();if(d.exists)BANK_INFO=d.data();}catch(e){BANK_INFO=null;}}
const VN_BANKS=[['VCB','Vietcombank'],['TCB','Techcombank'],['MB','MB Bank'],['BIDV','BIDV'],['ICB','VietinBank'],['VBA','Agribank'],['ACB','ACB'],['VPB','VPBank'],['STB','Sacombank'],['TPB','TPBank'],['MSB','MSB'],['HDB','HDBank'],['OCB','OCB'],['SHB','SHB'],['VIB','VIB'],['SEAB','SeABank'],['EIB','Eximbank'],['LPB','LPBank'],['NAB','Nam A Bank'],['BAB','BacABank'],['ABB','ABBANK'],['SCB','SCB'],['VAB','VietABank'],['PVCB','PVcomBank']];
function openBankSettings(){
  const b=BANK_INFO||{};
  const opts=VN_BANKS.map(([c,n])=>`<option value="${c}" ${b.bankCode===c?'selected':''}>${n}</option>`).join('');
  openModal(`<div class="modal-head"><h3>Cấu hình tài khoản chuyển khoản</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px">Nhập tài khoản nhận tiền. App sẽ tạo <b>mã QR VietQR</b> (quét bằng mọi app ngân hàng, tự điền số tiền) và in lên hóa đơn khi chọn Chuyển khoản.</p>
      <div class="field"><label>Ngân hàng <span class="req">*</span></label><select id="bkCode">${opts}</select></div>
      <div class="field"><label>Số tài khoản <span class="req">*</span></label><input id="bkAcc" value="${esc(b.accountNo||'')}" placeholder="Số TK nhận tiền"></div>
      <div class="field" style="margin:0"><label>Tên chủ tài khoản</label><input id="bkName" value="${esc(b.accountName||'')}" placeholder="VD: DO NGOC CUONG"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="saveBkBtn" onclick="saveBankSettings()">💾 Lưu tài khoản</button></div>`);
}
async function saveBankSettings(){
  const code=$('bkCode').value,acc=$('bkAcc').value.trim();
  if(!acc){toast('Nhập số tài khoản','warn');return;}
  const bankName=(VN_BANKS.find(x=>x[0]===code)||[])[1]||code;
  const data={bankCode:code,bankName,accountNo:acc,accountName:$('bkName').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveBkBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{await db.collection(COL.settings).doc('bank').set(data);BANK_INFO=data;toast('Đã lưu tài khoản','ok');closeModal();if(typeof updatePayUI==='function')updatePayUI();}catch(e){toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Lưu tài khoản';}
}

/* ===== KHỞI ĐỘNG ===== */
$('liBtn').onclick=doLogin;
$('liPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('liUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('liPass').focus();});
if(initFirebase()){bootLogin();try{const s=sessionStorage.getItem('bh_session');if(s)loginSuccess(JSON.parse(s));}catch(e){}}
</script>
