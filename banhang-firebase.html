<style>
:root{
  --ink:#0f1729;--ink-2:#1c2942;--nav:#141d33;
  --gold:#c2955c;--gold-2:#a97e46;--gold-soft:#f4ecdf;
  --bg:#f5f6f8;--card:#ffffff;--line:#e6e9ef;
  --txt:#1a2233;--muted:#6b7585;--muted-2:#9aa3b2;
  --ok:#1a9d6b;--ok-bg:#e6f6ef;--warn:#c9891f;--warn-bg:#fdf3e0;
  --danger:#d0453f;--danger-bg:#fbeceb;--info:#2b6cb0;--info-bg:#e8f1fb;
  --shadow:0 1px 2px rgba(16,23,41,.04),0 4px 16px rgba(16,23,41,.06);--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd2dd;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#aeb7c5}
#configGate{position:fixed;inset:0;background:var(--ink);color:#e8ecf3;display:none;align-items:center;justify-content:center;padding:24px;z-index:9999}
#configGate .box{max-width:560px;background:var(--ink-2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px}
#configGate h2{font-size:20px;margin-bottom:8px}#configGate p{color:#aab4c5;line-height:1.6;margin-bottom:14px;font-size:13.5px}
#configGate code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px;color:var(--gold);font-size:12.5px}
#loginScreen{position:fixed;inset:0;background:radial-gradient(1200px 600px at 70% -10%,#1e2c4a 0%,var(--ink) 55%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:900}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.login-head{padding:34px 34px 22px;text-align:center;border-bottom:1px solid var(--line)}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-weight:800;font-size:24px;box-shadow:0 8px 20px rgba(194,149,92,.35)}
.login-head h1{font-size:18px;font-weight:700}.login-head span{color:var(--muted);font-size:13px}
.login-body{padding:26px 34px 34px}
.field{margin-bottom:16px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfd;transition:.15s;color:var(--txt)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(194,149,92,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#fff;box-shadow:0 4px 14px rgba(194,149,92,.3)}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-block{width:100%}.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:#cdd4df;background:#fafbfc}
.btn-danger{background:var(--danger-bg);color:var(--danger)}.btn-danger:hover{background:#f7dedc}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.login-msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none}
.login-msg.err{background:var(--danger-bg);color:var(--danger);display:block}.login-msg.info{background:var(--info-bg);color:var(--info);display:block}
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:248px;background:var(--nav);color:#c7d0e0;display:flex;flex-direction:column;z-index:100}
.sb-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0}
.sb-brand b{color:#fff;font-size:14.5px;font-weight:700;line-height:1.2}.sb-brand small{color:#7f8ba3;font-size:11px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 20px}.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-color:transparent}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5f6b83;padding:16px 12px 7px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:9px;color:#c7d0e0;font-weight:500;font-size:13.5px;transition:.13s;position:relative;width:100%;text-align:left}
.nav-item .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(194,149,92,.22),rgba(194,149,92,.05));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--gold)}
.nav-item.soon{opacity:.42;cursor:not-allowed}
.nav-item .tag{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.1);color:#9aa6bd;padding:2px 6px;border-radius:5px;font-weight:600}
.sb-user{padding:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-user .av{width:34px;height:34px;border-radius:9px;background:#26324d;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:14px}
.sb-user .info{flex:1;min-width:0}.sb-user .info b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .info small{color:#7f8ba3;font-size:11px}
.sb-user button{color:#8b96ad;padding:7px;border-radius:8px}.sb-user button:hover{background:rgba(255,255,255,.08);color:#fff}
.main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:16px;position:sticky;top:0;z-index:50}
.topbar h2{font-size:17px;font-weight:700}.topbar .sub{color:var(--muted);font-size:12.5px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{padding:24px 26px 40px;flex:1}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.stat .val{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .sub{font-size:11.5px;color:var(--muted-2);margin-top:6px}
.stat .ic{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.stat.g1 .ic{background:var(--gold-soft);color:var(--gold-2)}.stat.g1 .val{color:var(--gold-2)}
.stat.g2 .ic{background:var(--ok-bg);color:var(--ok)}.stat.g2 .val{color:var(--ok)}
.stat.g3 .ic{background:var(--warn-bg);color:var(--warn)}.stat.g3 .val{color:var(--warn)}
.stat.g4 .ic{background:var(--danger-bg);color:var(--danger)}.stat.g4 .val{color:var(--danger)}
.stat.g5 .ic{background:var(--info-bg);color:var(--info)}.stat.g5 .val{color:var(--info)}
.stat.g6 .ic{background:#eee9f7;color:#7c5cbf}.stat.g6 .val{color:#7c5cbf}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.panel-head h3{font-size:15px;font-weight:700}
.panel-head .tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.13s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--gold-2);border-bottom-color:var(--gold)}
.tab .cnt{background:#eef0f4;color:var(--muted);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
.tab.active .cnt{background:var(--gold-soft);color:var(--gold-2)}
.search{position:relative}
.search input{padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfd;width:230px;transition:.15s}
.search input:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(194,149,92,.1)}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
select.filter{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfd;color:var(--txt);cursor:pointer}
select.filter:focus{outline:none;border-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:6px 14px;border-bottom:1px solid #f0f2f6;vertical-align:middle;font-size:13px;line-height:1.35}
tbody tr:hover{background:#fbfcfe}tbody tr:last-child td{border-bottom:none}
.t-code{font-weight:700;color:var(--ink-2);font-family:ui-monospace,monospace;font-size:12px}
.t-name{font-weight:600}.t-name small{display:block;color:var(--muted-2);font-weight:400;font-size:11.5px}
.t-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-price{font-weight:700;color:var(--ink-2)}
.pavatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#eef1f6,#e2e7ef);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold-2);flex-shrink:0}
.namecell{display:flex;align-items:center;gap:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.off{background:#eef0f4;color:var(--muted)}
.chip.low{background:var(--danger-bg);color:var(--danger)}.chip.cat{background:var(--gold-soft);color:var(--gold-2)}
.chip.vip{background:#fdf0e0;color:#b8791f}.chip.dn{background:var(--info-bg);color:var(--info)}.chip.cn{background:#eef0f4;color:var(--muted)}
.chip.thu{background:var(--ok-bg);color:var(--ok)}.chip.chi{background:var(--danger-bg);color:var(--danger)}
.row-act{display:flex;gap:5px;justify-content:flex-end}
.icon-btn{width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.13s;font-size:14px}
.icon-btn:hover{background:#eef0f4;color:var(--txt)}.icon-btn.del:hover{background:var(--danger-bg);color:var(--danger)}
.tbl-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.tbl-foot .pg{margin-left:auto;display:flex;gap:6px;align-items:center}
.pg button{padding:6px 11px;border:1.5px solid var(--line);border-radius:8px;color:var(--txt);font-weight:600;font-size:13px}
.pg button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-2)}.pg button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty .em-ic{font-size:40px;margin-bottom:12px;opacity:.5}.empty h4{font-size:15px;color:var(--txt);margin-bottom:5px}
.empty p{font-size:13px;max-width:360px;margin:0 auto 16px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;background:rgba(15,23,41,.5);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:800;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s}
.modal.sm{max-width:440px}
.modal.lg{max-width:900px}
.od-box{background:#fbfcfd;border:1px solid var(--line);border-radius:11px;padding:15px 16px;margin-bottom:14px}
.od-box h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:11px}
.od-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;gap:12px}
.od-row span{color:var(--muted)}.od-row b{text-align:right}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head button{margin-left:auto;color:var(--muted-2);font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.modal-head button:hover{background:#eef0f4;color:var(--txt)}
.modal-body{padding:22px 24px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
#toast{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink-2);color:#fff;padding:13px 18px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;animation:slideIn .25s;min-width:240px}
.toast.ok{background:#12805a}.toast.err{background:#c0392b}.toast.warn{background:#b7791f}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.imp-drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted);transition:.15s;cursor:pointer}
.imp-drop:hover{border-color:var(--gold);background:#fdfbf7}.imp-drop .di{font-size:34px;opacity:.5;margin-bottom:10px}
.imp-bar{height:8px;background:#eef0f4;border-radius:6px;overflow:hidden;margin-top:14px}
.imp-bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));width:0;transition:width .2s}
.imp-log{margin-top:12px;font-size:12.5px;color:var(--muted);max-height:120px;overflow-y:auto;background:#fafbfc;border-radius:8px;padding:10px 12px;line-height:1.7}
.req{color:var(--danger)}
.catrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}
.catrow b{flex:1}
@media(max-width:920px){
  .sidebar{transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}.main{margin-left:0}.search input{width:150px}.grid2{grid-template-columns:1fr}#menuToggle{display:flex!important}
}
#menuToggle{display:none;width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center;font-size:20px;color:var(--txt)}
#menuToggle:hover{background:#eef0f4}

function initFirebase(){
  if(firebaseConfig.apiKey==="PASTE_API_KEY"||!firebaseConfig.apiKey){document.getElementById('configGate').style.display='flex';document.getElementById('loginScreen').style.display='none';return false;}
  try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();ready=true;return true;}catch(e){console.error(e);toast('Không kết nối được Firebase: '+e.message,'err');return false;}
}
const money=n=>(Number(n)||0).toLocaleString('vi-VN');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const slug=s=>String(s||'').trim().replace(/\s+/g,'_').replace(/[^\w\-]/g,'')||('ID'+Date.now());
function toast(msg,type='ok'){const box=$('toast');const t=document.createElement('div');t.className='toast '+type;const ic={ok:'✓',err:'✕',warn:'⚠',info:'ℹ'}[type]||'✓';t.innerHTML=`<span>${ic}</span><span>${esc(msg)}</span>`;box.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),250)},2800);}
function openModal(html,size=''){const o=$('overlay');o.innerHTML=`<div class="modal ${size}">${html}</div>`;o.classList.add('show');o.onclick=e=>{if(e.target===o)closeModal();};}
function closeModal(){$('overlay').classList.remove('show');$('overlay').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function normKey(k){return String(k||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[%()]/g,'').replace(/\s+/g,' ').trim();}
function toNum(v){if(v==null||v==='')return 0;const n=Number(String(v).replace(/[^\d.-]/g,''));return isNaN(n)?0:n;}
function cleanStr(v){if(v==null)return '';let s=String(v).trim();if(s==='nan'||s==='NaN'||s==='undefined')return '';if(/^\d+\.0$/.test(s))s=s.replace('.0','');return s;}
function parseVNDate(v){
  if(!v)return {iso:'',disp:'',sort:0};
  let s=String(v).trim();
  const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){const d=+m[1],mo=+m[2],y=+m[3];const dt=new Date(y,mo-1,d);return {iso:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,disp:`${String(d).padStart(2,'0')}/${String(mo).padStart(2,'0')}/${y}`,sort:dt.getTime()};}
  const dt=new Date(s);if(!isNaN(dt))return {iso:dt.toISOString().slice(0,10),disp:dt.toLocaleDateString('vi-VN'),sort:dt.getTime()};
  return {iso:'',disp:s,sort:0};
}

async function bootLogin(){if(!ready)return;try{const snap=await db.collection(COL.users).limit(1).get();if(snap.empty)setLoginMode('setup');}catch(e){}}
function setLoginMode(mode){if(mode==='setup'){$('loginSubtitle').textContent='Tạo tài khoản quản trị đầu tiên';$('liNameWrap').style.display='block';$('liBtn').textContent='Tạo tài khoản admin';showLoginMsg('Chưa có tài khoản nào. Hãy tạo tài khoản quản trị đầu tiên.','info');$('liBtn').dataset.mode='setup';}}
function showLoginMsg(m,cls){const el=$('loginMsg');el.textContent=m;el.className='login-msg '+cls;}
async function doLogin(){
  const u=$('liUser').value.trim(),p=$('liPass').value,mode=$('liBtn').dataset.mode||'login';
  if(!u||!p){showLoginMsg('Nhập đủ tên đăng nhập và mật khẩu.','err');return;}
  $('liBtn').textContent='Đang xử lý…';$('liBtn').disabled=true;
  try{
    if(mode==='setup'){const name=$('liName').value.trim()||u;await db.collection(COL.users).doc(u).set({username:u,password:p,hoTen:name,role:'admin',coSo:'all',trangThai:'Active',createdAt:new Date().toISOString()});toast('Đã tạo tài khoản admin','ok');loginSuccess({username:u,hoTen:name,role:'admin',coSo:'all'});return;}
    const doc=await db.collection(COL.users).doc(u).get();
    if(!doc.exists){showLoginMsg('Tài khoản không tồn tại.','err');return resetBtn();}
    const data=doc.data();
    if(String(data.password)!==String(p)){showLoginMsg('Sai mật khẩu.','err');return resetBtn();}
    if(data.trangThai&&data.trangThai!=='Active'){showLoginMsg('Tài khoản đã bị khóa.','err');return resetBtn();}
    loginSuccess(data);
  }catch(e){console.error(e);showLoginMsg('Lỗi: '+e.message,'err');resetBtn();}
}
function resetBtn(){const b=$('liBtn');b.disabled=false;b.textContent=(b.dataset.mode==='setup'?'Tạo tài khoản admin':'Đăng nhập');}
function loginSuccess(u){
  CURRENT_USER={username:u.username,hoTen:u.hoTen||u.username,role:u.role||'nhanvien',coSo:u.coSo||'all'};
  try{sessionStorage.setItem('bh_session',JSON.stringify(CURRENT_USER));}catch(e){}
  const wrap=document.getElementById('csSelectWrap');
  if(CURRENT_USER.coSo&&CURRENT_USER.coSo!=='all'){ACTIVE_CS=CURRENT_USER.coSo;try{sessionStorage.setItem('bh_cs',ACTIVE_CS);}catch(e){}COL=buildCOL();if(wrap)wrap.style.display='none';}
  else{if(wrap)wrap.style.display='';}
  $('loginScreen').style.display='none';$('app').style.display='block';
  $('userName').textContent=CURRENT_USER.hoTen;$('userRole').textContent=roleLabel(CURRENT_USER.role)+(CURRENT_USER.coSo&&CURRENT_USER.coSo!=='all'?' · '+CS_NAME[CURRENT_USER.coSo]:'');
  $('userAv').textContent=(CURRENT_USER.hoTen||'?').trim().charAt(0).toUpperCase();
  buildNav();loadAll();
}
function roleLabel(r){return {admin:'Quản trị',quanly:'Quản lý',nhanvien:'Nhân viên',ktv:'Kỹ thuật'}[r]||r;}
function logout(){CURRENT_USER=null;try{sessionStorage.removeItem('bh_session');}catch(e){}$('app').style.display='none';$('loginScreen').style.display='flex';$('liUser').value='';$('liPass').value='';resetBtn();}

let CURRENT_VIEW='dashboard';
function buildNav(){
  const wrap=$('navMenu');wrap.innerHTML='';
  NAV.forEach(g=>{const h=document.createElement('div');h.className='nav-group';h.textContent=g.group;wrap.appendChild(h);
    g.items.forEach(it=>{const b=document.createElement('button');b.className='nav-item'+(it.soon?' soon':'')+(it.id===CURRENT_VIEW?' active':'');b.innerHTML=`<span class="ic">${it.ic}</span><span>${it.label}</span>`+(it.soon?'<span class="tag">Sắp có</span>':'');if(!it.soon)b.onclick=()=>navigate(it.id);else b.onclick=()=>toast('Module "'+it.label+'" sẽ được xây ở giai đoạn tiếp theo','info');wrap.appendChild(b);});
  });
}
function navigate(id){
  CURRENT_VIEW=id;buildNav();document.getElementById('sidebar').classList.remove('open');
  const titles={dashboard:['Tổng quan','Bảng điều khiển'],products:['Sản phẩm','Quản lý kho hàng & danh mục sản phẩm'],customers:['Khách hàng','Danh bạ & công nợ khách hàng'],finance:['Thu chi','Quản lý thu chi & dòng tiền'],orders:['Đơn hàng','Bán hàng & hóa đơn'],suppliers:['Nhà cung cấp','Đối tác cung cấp hàng'],purchases:['Nhập hàng','Phiếu nhập & công nợ nhà cung cấp'],inventory:['Kiểm kho','Đối chiếu & điều chỉnh tồn kho'],warranty:['Bảo hành','Phiếu bảo hành & mã QR dán đàn'],users:['Người dùng','Tài khoản & phân quyền cơ sở']};
  const [t,s]=titles[id]||[id,''];$('pageTitle').textContent=t;$('pageSub').textContent=s;

/* ===== DASHBOARD ===== */
function setDashPeriod(p){DASH.period=p;DASH.anchor=new Date();renderDashboard();}
function shiftDash(dir){const a=new Date(DASH.anchor);if(DASH.period==='day')a.setDate(a.getDate()+dir);else if(DASH.period==='month')a.setMonth(a.getMonth()+dir);else if(DASH.period==='quarter')a.setMonth(a.getMonth()+dir*3);else a.setFullYear(a.getFullYear()+dir);DASH.anchor=a;renderDashboard();}
function periodRange(period,anchor){const a=new Date(anchor);let from,to,label,prevA;
  if(period==='day'){from=new Date(a.getFullYear(),a.getMonth(),a.getDate());to=new Date(a.getFullYear(),a.getMonth(),a.getDate(),23,59,59,999);label=`${['CN','T2','T3','T4','T5','T6','T7'][a.getDay()]}, ${String(a.getDate()).padStart(2,'0')}/${String(a.getMonth()+1).padStart(2,'0')}/${a.getFullYear()}`;prevA=new Date(a.getFullYear(),a.getMonth(),a.getDate()-1);}
  else if(period==='month'){from=new Date(a.getFullYear(),a.getMonth(),1);to=new Date(a.getFullYear(),a.getMonth()+1,0,23,59,59,999);label=`Tháng ${a.getMonth()+1}/${a.getFullYear()}`;prevA=new Date(a.getFullYear(),a.getMonth()-1,1);}
  else if(period==='quarter'){const q=Math.floor(a.getMonth()/3);from=new Date(a.getFullYear(),q*3,1);to=new Date(a.getFullYear(),q*3+3,0,23,59,59,999);label=`Quý ${q+1}/${a.getFullYear()}`;prevA=new Date(a.getFullYear(),q*3-1,1);}
  else{from=new Date(a.getFullYear(),0,1);to=new Date(a.getFullYear(),11,31,23,59,59,999);label=`Năm ${a.getFullYear()}`;prevA=new Date(a.getFullYear()-1,5,1);}
  return {from,to,label,prevA};}
function periodBuckets(period,anchor){const a=new Date(anchor),bk=[];
  if(period==='day'){for(let h=0;h<24;h+=2)bk.push({label:h+'h',thu:0,chi:0});}
  else if(period==='month'){const days=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();for(let d=1;d<=days;d++)bk.push({label:String(d),thu:0,chi:0});}
  else if(period==='quarter'){const q=Math.floor(a.getMonth()/3);for(let i=0;i<3;i++)bk.push({label:'T'+(q*3+i+1),thu:0,chi:0});}
  else{for(let mm=0;mm<12;mm++)bk.push({label:'T'+(mm+1),thu:0,chi:0});}
  return bk;}
function bucketIndex(period,anchor,d){const a=new Date(anchor);
  if(period==='day')return Math.floor(d.getHours()/2);
  if(period==='month')return d.getDate()-1;
  if(period==='quarter')return d.getMonth()-Math.floor(a.getMonth()/3)*3;
  return d.getMonth();}
function sumThuChi(from,to){let thu=0,chi=0;const f=from.getTime(),t=to.getTime();TRANSACTIONS.forEach(x=>{const ts=x.ngaySort||0;if(ts>=f&&ts<=t){if(x.loai==='Thu')thu+=Number(x.soTien)||0;else if(x.loai==='Chi')chi+=Number(x.soTien)||0;}});return {thu,chi};}
function renderDashboard(){
  const P=PRODUCTS,C=CUSTOMERS,O=ORDERS;
  const {from,to,label,prevA}=periodRange(DASH.period,DASH.anchor);
  const {thu,chi}=sumThuChi(from,to);const loiNhuan=thu-chi;
  const pr=periodRange(DASH.period,prevA);const prev=sumThuChi(pr.from,pr.to);
  const growth=prev.thu>0?((thu-prev.thu)/prev.thu*100):(thu>0?100:0);
  const f=from.getTime(),t=to.getTime();
  const ordersIn=O.filter(o=>{const ts=o.ngaySort||0;return ts>=f&&ts<=t;});
  const doanhThuDon=ordersIn.reduce((s,o)=>s+(Number(o.tongCong)||0),0);
  const donNo=ordersIn.filter(o=>(Number(o.conNo)||0)>0);
  const phaiThu=C.reduce((s,c)=>s+(Number(c.congNo)||0),0);
  // buckets
  const bk=periodBuckets(DASH.period,DASH.anchor);
  TRANSACTIONS.forEach(x=>{const ts=x.ngaySort||0;if(ts<f||ts>t)return;const d=new Date(ts);const i=bucketIndex(DASH.period,DASH.anchor,d);if(i>=0&&i<bk.length){if(x.loai==='Thu')bk[i].thu+=Number(x.soTien)||0;else if(x.loai==='Chi')bk[i].chi+=Number(x.soTien)||0;}});
  const maxV=Math.max(1,...bk.map(b=>Math.max(b.thu,b.chi)));
  const n=bk.length,cw=640,base=168;const gw=cw/n;let bars='';
  bk.forEach((b,i)=>{const x=i*gw+gw/2;const bw=Math.max(3,Math.min(13,gw*0.34));const th=b.thu/maxV*138,chh=b.chi/maxV*138;
    bars+=`<rect x="${x-bw-1}" y="${base-th}" width="${bw}" height="${Math.max(th,.5)}" rx="2.5" fill="url(#gThu)"/><rect x="${x+1}" y="${base-chh}" width="${bw}" height="${Math.max(chh,.5)}" rx="2.5" fill="url(#gChi)"/>`;
    const show=DASH.period==='month'?(i%4===0||i===n-1):true;
    if(show)bars+=`<text x="${x}" y="${base+18}" text-anchor="middle" font-size="10.5" fill="#8a93a6">${b.label}</text>`;});
  const gBadge=growth>=0?`<span style="color:var(--ok);font-weight:700">▲ ${Math.abs(growth).toFixed(0)}%</span>`:`<span style="color:var(--danger);font-weight:700">▼ ${Math.abs(growth).toFixed(0)}%</span>`;

  const topDebt=C.filter(c=>(Number(c.congNo)||0)>0).sort((a,b)=>(b.congNo||0)-(a.congNo||0)).slice(0,5);
  const debtList=topDebt.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f6"><div style="min-width:0"><div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.ten)}</div><div style="font-size:11.5px;color:var(--muted-2)">${esc(c.dienThoai||'')}</div></div><div style="color:var(--danger);font-weight:700;font-size:13.5px;white-space:nowrap">${money(c.congNo)}₫</div></div>`).join('')||'<div style="color:var(--ok);padding:16px;text-align:center;font-size:13px">✓ Không có khách nợ</div>';
  const lowStock=P.filter(p=>!p.laDichVu&&(Number(p.tonToiThieu)||0)>0&&(Number(p.tonKho)||0)<=(Number(p.tonToiThieu)||0)).slice(0,6);

  const bhSoon=BAOHANH.map(o=>({o,dl:bhDaysLeft(o)})).filter(x=>x.dl!==null&&x.dl>=0&&x.dl<=60).sort((a,b)=>a.dl-b.dl).slice(0,5);
  const bhList=bhSoon.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f6;cursor:pointer" onclick="navigate('warranty');setTimeout(()=>openWarrantyDetail('${esc(x.o._id)}'),60)"><div style="min-width:0"><div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.o.tenSanPham||'')}</div><div style="font-size:11.5px;color:var(--muted-2)">${esc(x.o.khachTen||'')} · ${esc(x.o.baoHanhDen||'')}</div></div><span class="chip ${x.dl<=30?'low':'vip'}" style="font-size:10.5px;white-space:nowrap">Còn ${x.dl} ngày</span></div>`).join('')||'<div style="color:var(--muted-2);padding:16px;text-align:center;font-size:13px">Không có bảo hành sắp hết</div>';

  $('pSearch').oninput=e=>{pFilter.q=e.target.value;pFilter.page=1;drawProductTable();};
  $('pCat').onchange=e=>{pFilter.cat=e.target.value;pFilter.page=1;drawProductTable();};

}
function tabBtn(id,label,cnt){return `<button class="tab${pFilter.tab===id?' active':''}" onclick="pFilter.tab='${id}';pFilter.page=1;renderProducts()">${label}<span class="cnt">${money(cnt)}</span></button>`;}
function filteredProducts(){
  const q=pFilter.q.toLowerCase().trim();
  return PRODUCTS.filter(p=>{
    const c=Number(p.tonKho)||0,m=Number(p.tonKhoToiThieu)||0;
    if(pFilter.tab==='con'&&c<=0)return false;
    if(pFilter.tab==='het'&&c>0)return false;
    if(pFilter.tab==='sap'&&!(m>0&&c>0&&c<=m))return false;
    if(pFilter.tab==='noibat'&&!p.noiBat)return false;
    if(pFilter.tab==='ngung'&&p.trangThai!=='Ngừng')return false;
    if(pFilter.cat&&p.danhMuc!==pFilter.cat)return false;
    if(q){const hay=[p.maSP,p.tenSP,p.barcode,p.danhMuc,p.maNCC].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function drawProductTable(){
  const wrap=$('pTableWrap');if(!wrap)return;
  const all=filteredProducts();
  if(all.length===0){wrap.innerHTML=PRODUCTS.length===0?`<div class="empty"><div class="em-ic">♪</div><h4>Chưa có sản phẩm nào</h4><p>Nhập từ file Excel hoặc thêm thủ công.</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-ghost btn-sm" onclick="openImport()">📥 Nhập Excel</button><button class="btn btn-primary btn-sm" onclick="openProductForm()">＋ Thêm</button></div></div>`:`<div class="empty"><div class="em-ic">🔍</div><h4>Không tìm thấy</h4><p>Không có sản phẩm khớp bộ lọc.</p></div>`;return;}
  const per=pFilter.per,pages=Math.ceil(all.length/per);if(pFilter.page>pages)pFilter.page=pages;
  const start=(pFilter.page-1)*per,rows=all.slice(start,start+per);

}

async function saveProduct(id){
  const ma=$('fMa').value.trim(),ten=$('fTen').value.trim();
  if(!ma){toast('Nhập Mã SP','warn');return;}if(!ten){toast('Nhập tên sản phẩm','warn');return;}
  const data={maSP:ma,tenSP:ten,danhMuc:$('fCat').value.trim(),giaNhap:Number($('fGiaNhap').value)||0,giaBan:Number($('fGiaBan').value)||0,giaVIP:Number($('fGiaVip').value)||0,giaBanBuon:Number($('fGiaBuon').value)||0,tonKho:Number($('fTon').value)||0,tonKhoToiThieu:Number($('fTonMin').value)||0,donVi:$('fDvt').value.trim(),vatPercent:Number($('fVat').value)||0,barcode:$('fBarcode').value.trim(),maNCC:$('fNcc').value.trim(),thuongHieu:$('fBrand').value.trim(),tags:$('fTags').value.trim(),laDichVu:$('fService').checked,noiBat:$('fFeatured').checked,trangThai:$('fStatus').value,moTa:$('fMoTa').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveProdBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{
    if(id){await db.collection(COL.products).doc(id).set(data,{merge:true});toast('Đã cập nhật sản phẩm','ok');}
    else{const docId=slug(ma);const ex=await db.collection(COL.products).doc(docId).get();if(ex.exists){toast('Mã SP đã tồn tại','err');btn.disabled=false;btn.textContent='Thêm sản phẩm';return;}data.createdAt=new Date().toISOString();await db.collection(COL.products).doc(docId).set(data);toast('Đã thêm sản phẩm','ok');}
    closeModal();await loadProducts();await loadCategories();renderProducts();
  }catch(e){console.error(e);toast('Lỗi lưu: '+e.message,'err');btn.disabled=false;btn.textContent='Lưu';}
}
function deleteProduct(id){const p=PRODUCTS.find(x=>x._id===id);if(!p)return;openModal(`<div class="modal-head"><h3>Xóa sản phẩm</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.6">Xóa vĩnh viễn <b>${esc(p.tenSP)}</b> (${esc(p.maSP)})?<br><span style="color:var(--muted);font-size:13px">Không thể hoàn tác.</span></p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delBtn" onclick="confirmDeleteProduct('${esc(id)}')">Xóa vĩnh viễn</button></div>`,'sm');}

async function handleImportFile(file,kind){
  $('impProgress').style.display='block';const log=$('impLog'),bar=$('impBar');log.innerHTML='Đang đọc file…';
  try{
    const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    if(raw.length===0){log.innerHTML='⚠ File không có dữ liệu.';return;}
    const map=kind==='prod'?COLMAP_PROD:(kind==='cust'?COLMAP_CUST:COLMAP_TX);
    const idField=kind==='prod'?'maSP':(kind==='cust'?'maKH':'maGD');
    const idLabel=kind==='prod'?'Mã SP':(kind==='cust'?'Mã KH':'Mã GD');
    const keyMap={};Object.keys(raw[0]).forEach(k=>{const f=map[normKey(k)];if(f)keyMap[k]=f;});
    if(!Object.values(keyMap).includes(idField)){log.innerHTML=`⚠ Không tìm thấy cột <b>${idLabel}</b>. Kiểm tra tiêu đề cột.`;return;}
    const items=[];
    raw.forEach((r,idx)=>{
      const o={};Object.keys(keyMap).forEach(k=>{o[keyMap[k]]=r[k];});
      let idv=cleanStr(o[idField]);
      if(kind==='tx'&&!idv)idv='TRX-'+Date.now()+'-'+idx;
      if(!idv)return;
      if(kind==='prod'){items.push({maSP:cleanStr(o.maSP),tenSP:cleanStr(o.tenSP),danhMuc:cleanStr(o.danhMuc),giaNhap:toNum(o.giaNhap),giaBan:toNum(o.giaBan),giaVIP:toNum(o.giaVIP),giaBanBuon:toNum(o.giaBanBuon),tonKho:toNum(o.tonKho),tonKhoToiThieu:toNum(o.tonKhoToiThieu),donVi:cleanStr(o.donVi),vatPercent:toNum(o.vatPercent),barcode:cleanStr(o.barcode),maNCC:cleanStr(o.maNCC),thuongHieu:cleanStr(o.thuongHieu),tags:cleanStr(o.tags),trangThai:cleanStr(o.trangThai)||'Active',moTa:cleanStr(o.moTa),updatedAt:new Date().toISOString()});}
      else if(kind==='cust'){items.push({maKH:cleanStr(o.maKH),ten:cleanStr(o.ten),dienThoai:cleanStr(o.dienThoai),email:cleanStr(o.email),diaChi:cleanStr(o.diaChi),nhom:cleanStr(o.nhom),hang:cleanStr(o.hang),loai:cleanStr(o.loai)||'Cá nhân',congTy:cleanStr(o.congTy),maSoThue:cleanStr(o.maSoThue),congNo:toNum(o.congNo),ghiChu:cleanStr(o.ghiChu),updatedAt:new Date().toISOString()});}
      else{const rawLoai=cleanStr(o.loai).toLowerCase();const loai=(rawLoai==='income'||rawLoai==='thu')?'Thu':((rawLoai==='expense'||rawLoai==='chi')?'Chi':(rawLoai?cleanStr(o.loai):'Thu'));const d=parseVNDate(o.ngay);items.push({maGD:idv,ngay:d.iso,ngayHienThi:d.disp,ngaySort:d.sort,loai:loai,danhMuc:cleanStr(o.danhMuc),moTa:cleanStr(o.moTa),soTien:toNum(o.soTien),phuongThuc:cleanStr(o.phuongThuc),thamChieu:cleanStr(o.thamChieu),ghiChu:cleanStr(o.ghiChu),updatedAt:new Date().toISOString()});}
    });
    if(items.length===0){log.innerHTML=`⚠ Không có dòng hợp lệ.`;return;}
    log.innerHTML=`Đọc được <b>${items.length}</b> dòng. Đang ghi lên Firebase…`;
    const collection=kind==='prod'?COL.products:(kind==='cust'?COL.customers:COL.transactions);
    const idKey=idField;let done=0,err=0;
    for(let i=0;i<items.length;i+=400){
      const chunk=items.slice(i,i+400),batch=db.batch();
      chunk.forEach(it=>{batch.set(db.collection(collection).doc(slug(it[idKey])),it,{merge:true});});
      try{await batch.commit();done+=chunk.length;}catch(e){err+=chunk.length;console.error(e);}
      bar.style.width=Math.round((i+chunk.length)/items.length*100)+'%';log.innerHTML=`Đã ghi <b>${done}</b>/${items.length}…`;
    }
    bar.style.width='100%';log.innerHTML=`✅ Hoàn tất: <b>${done}</b> dòng đã lưu${err?` · ${err} lỗi`:''}.`;
    toast(`Đã nhập ${done} dòng`,'ok');
    if(kind==='prod'){await loadProducts();await loadCategories();setTimeout(()=>{closeModal();renderProducts();},1200);}
    else if(kind==='cust'){await loadCustomers();setTimeout(()=>{closeModal();renderCustomers();},1200);}
    else{await loadTransactions();setTimeout(()=>{closeModal();renderFinance();},1200);}
  }catch(e){console.error(e);log.innerHTML='✕ Lỗi đọc file: '+e.message;toast('Lỗi nhập file: '+e.message,'err');}
}

function parseWarrantyFromNote(note){
  const m=String(note||'').match(/B[ảa]o h[àa]nh\s+(\d+)\s*(n[ăa]m|th[áa]ng)\s*t[ừu]\s*([\d/]+)\s*đ[ếe]n\s*([\d/]+)/i);
  if(!m)return {baoHanhSo:0,baoHanhDonVi:'thang',baoHanhThang:0,baoHanhTu:'',baoHanhDen:''};
  const so=Number(m[1])||0,dv=/n[ăa]m/i.test(m[2])?'nam':'thang';
  return {baoHanhSo:so,baoHanhDonVi:dv,baoHanhThang:dv==='nam'?so*12:so,baoHanhTu:m[3],baoHanhDen:m[4]};
}
async function handleImportOrders(file){
  $('impProgress').style.display='block';const log=$('impLog'),bar=$('impBar');log.innerHTML='Đang đọc file…';
  try{
    const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    if(raw.length===0){log.innerHTML='⚠ File không có dữ liệu.';return;}
    const get=(r,keys)=>{for(const k of keys){if(r[k]!==undefined&&r[k]!=='')return r[k];}return '';};
    const groups={};
    raw.forEach(r=>{
      const maDon=cleanStr(get(r,['Mã Đơn','Ma Don','maDon','Mã đơn']));if(!maDon)return;
      if(!groups[maDon])groups[maDon]={rows:[],first:r};
      groups[maDon].rows.push(r);
    });
    const stMap={completed:'Hoàn thành',cancelled:'Đã hủy',pending:'Mới'};
    const orders=Object.keys(groups).map(maDon=>{
      const g=groups[maDon],f=g.first;
      const items=g.rows.map(r=>{const dg=toNum(get(r,['Đơn Giá','Don Gia'])),qty=toNum(get(r,['Số Lượng','So Luong']))||1,tt=toNum(get(r,['Thành Tiền','Thanh Tien']))||dg*qty;
        return {maSP:cleanStr(get(r,['Mã SP','Ma SP'])),ten:cleanStr(get(r,['Tên Sản Phẩm','Ten San Pham'])),donGia:dg,qty,thanhTien:tt,laDichVu:false,prodId:''};});
      const tongHang=items.reduce((s,it)=>s+it.thanhTien,0);
      const d=parseVNDate(get(f,['Ngày','Ngay']));
      const rawPt=cleanStr(get(f,['PT Thanh Toán','PT Thanh Toan']));const pttt=/chuy|ck/i.test(rawPt)?'Chuyển khoản':'Tiền mặt';
      const rawSt=cleanStr(get(f,['Trạng Thái','Trang Thai'])).toLowerCase();
      const ghiChu=cleanStr(get(f,['Ghi Chú','Ghi Chu'])).replace(/\\n/g,' · ');

      const tongCong=toNum(get(f,['Tổng Đơn','Tong Don']))||tongHang;

      const conNo=toNum(get(f,['Còn Nợ','Con No']));
      return {maDon,ngay:d.iso,ngayHienThi:d.disp,ngaySort:d.sort,khachId:'',khachTen:cleanStr(get(f,['Khách Hàng','Khach Hang']))||'Khách lẻ',khachSDT:'',khachDiaChi:'',items,tongHang,chietKhau:0,phiItems:[],phiVanChuyen:0,tongCong,daTra,conNo,phuongThuc:pttt,baoHanhSo:bh.baoHanhSo,baoHanhDonVi:bh.baoHanhDonVi,baoHanhThang:bh.baoHanhThang,baoHanhTu:bh.baoHanhTu,baoHanhDen:bh.baoHanhDen,trangThai:stMap[rawSt]||'Hoàn thành',ghiChu,createdBy:cleanStr(get(f,['Nhân Viên','Nhan Vien']))||'Nhập Excel',createdAt:new Date().toISOString(),importHistory:true};
    });
    if(orders.length===0){log.innerHTML='⚠ Không tìm thấy cột Mã Đơn hợp lệ.';return;}
    log.innerHTML=`Đọc được <b>${orders.length}</b> đơn (${raw.length} dòng SP). Đang ghi lên Firebase…`;
    let done=0,err=0;
    for(let i=0;i<orders.length;i+=400){
      const chunk=orders.slice(i,i+400),batch=db.batch();
      chunk.forEach(o=>{batch.set(db.collection(COL.orders).doc(slug(o.maDon)),o,{merge:true});});
      try{await batch.commit();done+=chunk.length;}catch(e){err+=chunk.length;console.error(e);}
      bar.style.width=Math.round((i+chunk.length)/orders.length*100)+'%';log.innerHTML=`Đã ghi <b>${done}</b>/${orders.length} đơn…`;
    }
    bar.style.width='100%';log.innerHTML=`✅ Hoàn tất: <b>${done}</b> đơn đã lưu${err?` · ${err} lỗi`:''}. (Chỉ lưu bản ghi, không đụng tồn/thu/nợ)`;
    toast(`Đã nhập ${done} đơn hàng`,'ok');
    await loadOrders();setTimeout(()=>{closeModal();renderOrders();},1400);
  }catch(e){console.error(e);log.innerHTML='✕ Lỗi đọc file: '+e.message;toast('Lỗi nhập file: '+e.message,'err');}

function syncCustomersFromOrders(){
  const byPhone={},byName={};
  CUSTOMERS.forEach(c=>{const p=(c.dienThoai||'').replace(/\D/g,'');if(p)byPhone[p]=1;const n=(c.ten||'').trim().toLowerCase();if(n)byName[n]=1;});
  const toCreate=[],seen={};
  ORDERS.forEach(o=>{
    const ten=(o.khachTen||'').trim();if(!ten||ten==='Khách lẻ')return;
    const phone=(o.khachSDT||'').replace(/\D/g,'');const nameKey=ten.toLowerCase();
    if(phone&&byPhone[phone])return;if(byName[nameKey])return;
    const sk=phone||nameKey;if(seen[sk])return;seen[sk]=true;
    toCreate.push({ten,dienThoai:o.khachSDT||'',diaChi:o.khachDiaChi||''});
  });
  if(toCreate.length===0){toast('Tất cả khách trong đơn đã có trong danh bạ ✓','info');return;}
  openModal(`<div class="modal-head"><h3>Đồng bộ khách từ đơn hàng</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="line-height:1.7">Tìm thấy <b style="font-size:18px;color:var(--gold-2)">${toCreate.length}</b> khách có trong đơn hàng <b>chưa có</b> trong danh bạ.<br><span style="color:var(--muted);font-size:13px">Hệ thống sẽ thêm họ vào Khách hàng (chống trùng theo SĐT/tên). Chỉ thêm danh bạ — không đụng công nợ.</span></p>
    <div id="syncLog" style="display:none;margin-top:10px"><div class="imp-bar"><div id="syncBar"></div></div><div class="imp-log" id="syncMsg"></div></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="syncBtn" onclick='confirmSyncCustomers(${JSON.stringify(toCreate).replace(/'/g,"&#39;")})'>Thêm ${toCreate.length} khách</button></div>`);
}
async function confirmSyncCustomers(list){
  const btn=$('syncBtn');btn.disabled=true;btn.textContent='Đang thêm…';$('syncLog').style.display='block';
  const bar=$('syncBar'),msg=$('syncMsg');let done=0,err=0;const base=Date.now();
  for(let i=0;i<list.length;i+=400){
    const chunk=list.slice(i,i+400),batch=db.batch();
    chunk.forEach((c,j)=>{const maKH='KH'+(base+i+j).toString(36).toUpperCase().slice(-7);const ref=db.collection(COL.customers).doc();batch.set(ref,{maKH,ten:c.ten,dienThoai:c.dienThoai,diaChi:c.diaChi,congNo:0,loai:'Cá nhân',hang:'',nhom:'',ghiChu:'Thêm từ đơn hàng',createdAt:new Date().toISOString()});});
    try{await batch.commit();done+=chunk.length;}catch(e){err+=chunk.length;console.error(e);}
    bar.style.width=Math.round((i+chunk.length)/list.length*100)+'%';msg.innerHTML=`Đã thêm <b>${done}</b>/${list.length}…`;
  }
  msg.innerHTML=`✅ Đã thêm <b>${done}</b> khách vào danh bạ${err?` · ${err} lỗi`:''}.`;
  toast(`Đã đồng bộ ${done} khách từ đơn`,'ok');
  await loadCustomers();setTimeout(()=>{closeModal();renderCustomers();},1300);
}
function exportCustomers(){const rows=filteredCustomers().map(c=>({'Mã KH':c.maKH||'','Tên':c.ten||'','Số điện thoại':c.dienThoai||'','Email':c.email||'','Địa chỉ':c.diaChi||'','Nhóm':c.nhom||'','Hạng':c.hang||'','Loại':c.loai||'','Công ty':c.congTy||'','Mã số thuế':c.maSoThue||'','Công nợ':c.congNo||0,'Ghi chú':c.ghiChu||''}));if(rows.length===0){toast('Không có dữ liệu','warn');return;}const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Khách hàng');XLSX.writeFile(wb,'KhachHang_ThienAn_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Đã xuất '+rows.length+' khách hàng','ok');}

function exportTx(){const rows=filteredTx().map(t=>({'Mã GD':t.maGD||'','Ngày':t.ngayHienThi||'','Loại':t.loai||'','Danh Mục':t.danhMuc||'','Mô Tả':t.moTa||'','Số Tiền':t.soTien||0,'Phương Thức TT':t.phuongThuc||'','Ghi Chú':t.ghiChu||''}));if(rows.length===0){toast('Không có dữ liệu','warn');return;}const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Giao dịch');XLSX.writeFile(wb,'ThuChi_ThienAn_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Đã xuất '+rows.length+' giao dịch','ok');}

let oFilter={q:'',status:'',page:1,per:20};
const FV=()=>firebase.firestore.FieldValue;
function orderStats(){
  const count=ORDERS.length;
  const doanhThu=ORDERS.reduce((s,o)=>s+(Number(o.tongCong)||0),0);
  const daThu=ORDERS.reduce((s,o)=>s+(Number(o.daTra)||0),0);
  const conNo=ORDERS.reduce((s,o)=>s+(Number(o.conNo)||0),0);
  const today=new Date();const key=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const donHomNay=ORDERS.filter(o=>o.ngay===key).length;
  return {count,doanhThu,daThu,conNo,donHomNay};
}

function orderPayStatus(o){const total=Number(o.tongCong)||0,paid=Number(o.daTra)||0;if(paid>=total&&total>0)return 'paid';if(paid<=0)return 'unpaid';return 'partial';}
function filteredOrders(){
  const q=oFilter.q.toLowerCase().trim();
  return ORDERS.filter(o=>{
    if(oFilter.status==='_no'){if((Number(o.conNo)||0)<=0)return false;}
    else if(oFilter.status&&(o.trangThai||'Hoàn thành')!==oFilter.status)return false;
    if(q){const hay=[o.maDon,o.khachTen,o.khachSDT].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;});
}
function drawOrderTable(){
  const wrap=$('oTableWrap');if(!wrap)return;const all=filteredOrders();
  if(all.length===0){wrap.innerHTML=ORDERS.length===0?`<div class="empty"><div class="em-ic">🧾</div><h4>Chưa có đơn hàng nào</h4><p>Tạo đơn bán hàng đầu tiên — chọn khách, thêm sản phẩm, thu tiền.</p><button class="btn btn-primary btn-sm" onclick="openOrderForm()">＋ Tạo đơn hàng</button></div>`:`<div class="empty"><div class="em-ic">🔍</div><h4>Không tìm thấy</h4><p>Không có đơn khớp bộ lọc.</p></div>`;return;}
  const per=oFilter.per,pages=Math.ceil(all.length/per);if(oFilter.page>pages)oFilter.page=pages;const start=(oFilter.page-1)*per,rows=all.slice(start,start+per);
  wrap.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Mã đơn</th><th>Ngày</th><th>Khách hàng</th><th>Nhân viên</th><th class="t-num">Tổng tiền</th><th class="t-num">Đã TT</th><th class="t-num">Còn nợ</th><th>Trạng thái</th><th>Ghi chú / Bảo hành</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>${rows.map(orderRow).join('')}</tbody></table></div>
    <div class="tbl-foot"><span>Hiển thị ${start+1}–${Math.min(start+per,all.length)} / <b>${money(all.length)}</b> đơn</span><div class="pg"><button ${oFilter.page<=1?'disabled':''} onclick="oFilter.page--;drawOrderTable()">‹ Trước</button><span style="padding:0 6px">Trang ${oFilter.page}/${pages}</span><button ${oFilter.page>=pages?'disabled':''} onclick="oFilter.page++;drawOrderTable()">Sau ›</button></div></div>`;
}
function orderRow(o){
  const tt=o.trangThai||'Hoàn thành';

  const stChip=`<span class="chip ${stMap[tt]||'cn'}">${esc(tt)}</span>`;
  const conNo=Number(o.conNo)||0;
  const noCell=conNo>0?`<span style="color:var(--danger);font-weight:700">${money(conNo)}</span>`:'<span style="color:var(--muted-2)">—</span>';
  const bhTxt=o.baoHanhThang>0?`🛡 BH ${warrantyText(o)}`:'';
  const note=[bhTxt,o.ghiChu].filter(Boolean).join(' · ');
  const noteCell=note?`<div style="max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted)" title="${esc(note)}">${esc(note)}</div>`:'<span style="color:var(--muted-2)">—</span>';
  const printSvg='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>';
  return `<tr style="cursor:pointer" onclick="openOrderDetail('${esc(o._id)}')"><td class="t-code">${esc(o.maDon||'')}</td><td style="white-space:nowrap">${esc(o.ngayHienThi||'—')}</td><td class="t-name">${esc(o.khachTen||'Khách lẻ')}</td><td style="white-space:nowrap;font-size:12.5px">${esc(o.createdBy||'—')}</td><td class="t-num t-price">${money(o.tongCong)}</td><td class="t-num" style="color:var(--ok)">${money(o.daTra)}</td><td class="t-num">${noCell}</td><td>${stChip}</td><td>${noteCell}</td><td><div class="row-act"><button class="icon-btn" title="Xem" onclick="event.stopPropagation();openOrderDetail('${esc(o._id)}')">👁</button><button class="icon-btn" title="In hóa đơn" onclick="event.stopPropagation();printInvoice('${esc(o._id)}')">${printSvg}</button><button class="icon-btn del" title="Xóa" onclick="event.stopPropagation();deleteOrder('${esc(o._id)}')">🗑</button></div></td></tr>`;
}

function addFirstMatch(){
  const q=($('posSearch').value||'').toLowerCase().trim();if(!q)return;
  const f=PRODUCTS.filter(p=>(p.trangThai||'Active')==='Active').filter(p=>[p.maSP,p.tenSP,p.barcode,p.danhMuc].join(' ').toLowerCase().includes(q));
  if(f.length===0){toast('Không tìm thấy sản phẩm','warn');return;}
  addCartById(f[0]._id);$('posSearch').value='';$('posSearch').focus();renderPosProducts('');
}
function fillCustFromSelect(){
  const v=$('ordCust').value;if(v==='le')return;
  const c=CUSTOMERS.find(x=>x._id===v);
  if(c){$('ordCustName').value=c.ten||'';$('ordCustPhone').value=c.dienThoai||'';$('ordCustAddr').value=c.diaChi||'';}
}
function renderPosProducts(q){
  const el=$('posProdList');if(!el)return;q=(q||'').toLowerCase().trim();
  let list=PRODUCTS.filter(p=>(p.trangThai||'Active')==='Active');
  if(q)list=list.filter(p=>[p.maSP,p.tenSP,p.barcode,p.danhMuc].join(' ').toLowerCase().includes(q));
  const show=list.slice(0,80);
  if(show.length===0){el.innerHTML='<div class="empty" style="padding:34px"><div class="em-ic">🔍</div><h4>Không tìm thấy</h4><p>Thử từ khóa khác.</p></div>';return;}

    return `<div onclick="addCartById('${esc(p._id)}')" style="display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid #f0f2f6;cursor:pointer;transition:.1s" onmouseover="this.style.background='#fbfcfe'" onmouseout="this.style.background=''">

      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.tenSP)}</div><small style="color:var(--muted-2)">${esc(p.maSP)} · ${esc(p.donVi||'—')} · ${p.laDichVu?'dịch vụ':(cur<=0?'<span style="color:var(--danger)">hết hàng</span>':'tồn '+money(cur))}</small></div>
      <div style="text-align:right"><div class="t-price" style="font-size:14px">${money(p.giaBan)}₫</div><div style="font-size:11px;color:${inCart?'var(--ok)':'var(--gold-2)'};font-weight:600">${inCart?'✓ trong giỏ ('+inCart.qty+')':'+ Thêm'}</div></div>
    </div>`;}).join('')+(list.length>80?`<div style="padding:12px;text-align:center;color:var(--muted-2);font-size:12px">Hiển thị 80/${money(list.length)} — gõ để lọc thêm</div>`:'');
}
function addCartById(id){
  const p=PRODUCTS.find(x=>x._id===id);if(!p)return;
  const ex=ORDER_CART.find(it=>it.id===p._id);
  if(ex)ex.qty++;else ORDER_CART.push({id:p._id,maSP:p.maSP,ten:p.tenSP,donGia:Number(p.giaBan)||0,qty:1,laDichVu:!!p.laDichVu,tonKho:Number(p.tonKho)||0});
  renderCart();if($('posSearch'))renderPosProducts($('posSearch').value);
}
function removeCartItem(i){ORDER_CART.splice(i,1);renderCart();if($('posSearch'))renderPosProducts($('posSearch').value);}

  const body=$('ordCartBody');if(!body)return;

function setPaid(mode){

function updateOrderTotals(){
  let sub=0;ORDER_CART.forEach((it,i)=>{const tt=(Number(it.donGia)||0)*(Number(it.qty)||0);sub+=tt;const c=$('cartTt'+i);if(c)c.textContent=money(tt);});
  const ck=Number($('ordDiscount')?.value)||0;const phi=feesTotal();const total=Math.max(0,sub-ck+phi);

function addMonthsToDate(iso,months){if(!iso||!months)return null;const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,(m-1)+Number(months),d);return dt;}

async function saveOrder(){
  if(ORDER_CART.length===0){toast('Chưa có sản phẩm trong đơn','warn');return;}
  const custId=$('ordCust').value;let cust=custId==='le'?null:CUSTOMERS.find(c=>c._id===custId);

      else{const maKH='KH'+Date.now().toString(36).toUpperCase();const newC={maKH,ten:inName,dienThoai:inPhone,diaChi:inAddr,congNo:0,loai:'Cá nhân',hang:'',nhom:'',createdAt:new Date().toISOString()};const ref=await db.collection(COL.customers).add(newC);cust={_id:ref.id,...newC};toast('Đã thêm "'+inName+'" vào danh bạ khách hàng','info');}

    if(oldOrder)order.updatedAt=new Date().toISOString();

      (oldOrder.items||[]).forEach(it=>{if(!it.laDichVu&&it.prodId){rb.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(Number(it.qty)||0)});}});

      await rb.commit();

    EDITING_ORDER_ID=null;

  }catch(e){console.error(e);toast('Lỗi lưu đơn: '+e.message,'err');btn.disabled=false;btn.textContent=EDITING_ORDER_ID?'💾 Cập nhật đơn':'💾 Lưu đơn & thu tiền';}
}

function docTienBangChu(number){
  number=Math.round(Number(number)||0);if(number===0)return 'Không đồng';
  const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function doc3(baso,full){let tram=Math.floor(baso/100),chuc=Math.floor((baso%100)/10),dv=baso%10,kq='';
    if(full||tram>0)kq+=ch[tram]+' trăm';
    if(chuc>1){kq+=' '+ch[chuc]+' mươi';if(dv===1)kq+=' mốt';else if(dv===5)kq+=' lăm';else if(dv>0)kq+=' '+ch[dv];}
    else if(chuc===1){kq+=' mười';if(dv===5)kq+=' lăm';else if(dv>0)kq+=' '+ch[dv];}
    else if(dv>0){if(full||tram>0)kq+=' lẻ';kq+=' '+ch[dv];}
    return kq.trim();}
  const lg=['','nghìn','triệu','tỷ'];let s=String(number),g=[];
  while(s.length>0){g.unshift(Number(s.slice(-3)));s=s.slice(0,-3);}
  let kq='',n=g.length;
  for(let i=0;i<n;i++){if(g[i]===0)continue;kq+=doc3(g[i],i>0)+' '+lg[(n-1-i)%4]+' ';}
  kq=kq.trim().replace(/\s+/g,' ');return kq.charAt(0).toUpperCase()+kq.slice(1)+' đồng chẵn';
}

function deleteOrder(id){

async function confirmDeleteOrder(id){
  const o=ORDERS.find(x=>x._id===id);if(!o)return;
  const btn=$('delOrdBtn');btn.disabled=true;btn.textContent='Đang xử lý…';
  try{
    const batch=db.batch();
    // hoàn tồn kho
    (o.items||[]).forEach(it=>{if(!it.laDichVu&&it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(Number(it.qty)||0)});}});
    // trừ công nợ đã cộng
    if((Number(o.conNo)||0)>0&&o.khachId){batch.update(db.collection(COL.customers).doc(o.khachId),{congNo:FV().increment(-(Number(o.conNo)||0))});}
    await batch.commit();
    // xóa khoản thu liên quan
    try{const txSnap=await db.collection(COL.transactions).where('refOrderId','==',o.maDon).get();const b2=db.batch();txSnap.forEach(d=>b2.delete(d.ref));await b2.commit();}catch(e){console.warn('Xóa thu liên quan:',e);}
    // xóa đơn
    await db.collection(COL.orders).doc(id).delete();
    toast('Đã xóa đơn & hoàn tác','ok');
    closeModal();
    await Promise.all([loadOrders(),loadProducts(),loadCustomers(),loadTransactions()]);
    renderOrders();
  }catch(e){console.error(e);toast('Lỗi xóa đơn: '+e.message,'err');btn.disabled=false;btn.textContent='Xóa & hoàn tác';}
}

function genPurCode(){const d=new Date();const ymd=`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;return 'PN'+ymd+'-'+Math.random().toString(36).slice(2,6).toUpperCase();}

function addPurItem(){
  const val=$('purProdInput').value.trim();if(!val)return;
  const maSP=val.split(' — ')[0].trim();

  if(!p){toast('Không tìm thấy sản phẩm. Chọn từ gợi ý.','warn');return;}
  const ex=PURCHASE_CART.find(it=>it.id===p._id);
  if(ex)ex.qty++;else PURCHASE_CART.push({id:p._id,maSP:p.maSP,ten:p.tenSP,gia:Number(p.giaNhap)||0,qty:1});
  $('purProdInput').value='';renderPurCart();
}
function removePurItem(i){PURCHASE_CART.splice(i,1);renderPurCart();}

  body.innerHTML=PURCHASE_CART.map((it,i)=>`<tr>

function updatePurTotals(){
  let sub=0;PURCHASE_CART.forEach((it,i)=>{const tt=(Number(it.gia)||0)*(Number(it.qty)||0);sub+=tt;const c=$('purTt'+i);if(c)c.textContent=money(tt);});
  if($('purTotal'))$('purTotal').textContent=money(sub);
  if(!PUR_PAID_EDITED&&$('purPaid'))$('purPaid').value=sub;
  const paid=Number($('purPaid')?.value)||0;
  if($('purConNo'))$('purConNo').textContent=money(Math.max(0,sub-paid));
}
async function savePurchase(){
  if(PURCHASE_CART.length===0){toast('Chưa có sản phẩm trong phiếu','warn');return;}
  const nccId=$('purNcc').value;const ncc=nccId?SUPPLIERS.find(s=>s._id===nccId):null;
  const d=parseVNDate($('purDate').value);
  const items=PURCHASE_CART.map(it=>({maSP:it.maSP,ten:it.ten,gia:Number(it.gia)||0,qty:Number(it.qty)||0,thanhTien:(Number(it.gia)||0)*(Number(it.qty)||0),prodId:it.id}));
  const total=items.reduce((s,it)=>s+it.thanhTien,0);
  const paid=Number($('purPaid').value)||0;
  const conNo=Math.max(0,total-paid);
  if(conNo>0&&!ncc){toast('Còn nợ NCC — hãy chọn nhà cung cấp để ghi công nợ.','warn');return;}
  const maPhieu=genPurCode();
  const pur={maPhieu,ngay:$('purDate').value,ngayHienThi:d.disp||$('purDate').value,ngaySort:d.sort||Date.now(),nccId:ncc?ncc._id:'',nccTen:ncc?ncc.tenNCC:'(Không chọn NCC)',items,tongTien:total,daTra:paid,conNo,phuongThuc:$('purPttt').value.trim()||'Tiền mặt',ghiChu:$('purNote').value.trim(),createdBy:CURRENT_USER.hoTen,createdAt:new Date().toISOString()};
  const btn=$('savePurBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{
    await db.collection(COL.purchases).doc(slug(maPhieu)).set(pur);
    const batch=db.batch();
    items.forEach(it=>{if(it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(it.qty),giaNhap:it.gia});}});
    if(conNo>0&&ncc){batch.update(db.collection(COL.suppliers).doc(ncc._id),{congNo:FV().increment(conNo)});}
    await batch.commit();
    if(paid>0){const txId='TRX-'+slug(maPhieu);await db.collection(COL.transactions).doc(txId).set({maGD:txId,loai:'Chi',ngay:pur.ngay,ngayHienThi:pur.ngayHienThi,ngaySort:pur.ngaySort,soTien:paid,danhMuc:'Nhập hàng',moTa:'Trả tiền nhập '+maPhieu+(ncc?' - '+ncc.tenNCC:''),phuongThuc:pur.phuongThuc,thamChieu:maPhieu,refPurchaseId:maPhieu,ghiChu:'',createdAt:new Date().toISOString()});}
    toast('Đã tạo phiếu nhập '+maPhieu,'ok');
    closeModal();
    await Promise.all([loadPurchases(),loadProducts(),loadSuppliers(),loadTransactions()]);
    renderPurchases();
  }catch(e){console.error(e);toast('Lỗi tạo phiếu: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Lưu phiếu nhập';}
}

function deletePurchase(id){const p=PURCHASES.find(x=>x._id===id);if(!p)return;openModal(`<div class="modal-head"><h3>Xóa phiếu nhập</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.7">Xóa phiếu <b>${esc(p.maPhieu)}</b> (${money(p.tongTien)}₫)?<br><span style="color:var(--muted);font-size:13px">Hệ thống sẽ tự <b>trừ lại tồn kho</b>, <b>giảm nợ NCC</b> và <b>xóa khoản chi</b> liên quan.</span></p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delPurBtn" onclick="confirmDeletePurchase('${esc(id)}')">Xóa & hoàn tác</button></div>`,'sm');}
async function confirmDeletePurchase(id){
  const p=PURCHASES.find(x=>x._id===id);if(!p)return;const btn=$('delPurBtn');btn.disabled=true;btn.textContent='Đang xử lý…';
  try{
    const batch=db.batch();
    (p.items||[]).forEach(it=>{if(it.prodId){batch.update(db.collection(COL.products).doc(it.prodId),{tonKho:FV().increment(-(Number(it.qty)||0))});}});
    if((Number(p.conNo)||0)>0&&p.nccId){batch.update(db.collection(COL.suppliers).doc(p.nccId),{congNo:FV().increment(-(Number(p.conNo)||0))});}
    await batch.commit();
    try{const s=await db.collection(COL.transactions).where('refPurchaseId','==',p.maPhieu).get();const b2=db.batch();s.forEach(d=>b2.delete(d.ref));await b2.commit();}catch(e){}
    await db.collection(COL.purchases).doc(id).delete();
    toast('Đã xóa phiếu & hoàn tác','ok');closeModal();
    await Promise.all([loadPurchases(),loadProducts(),loadSuppliers(),loadTransactions()]);renderPurchases();
  }catch(e){console.error(e);toast('Lỗi xóa: '+e.message,'err');btn.disabled=false;btn.textContent='Xóa & hoàn tác';}
}

function invDiff(id,cur){

async function adjustStock(id,cur){
  const p=PRODUCTS.find(x=>x._id===id);if(!p)return;
  const val=Number($('inv_'+id).value)||0;const diff=val-cur;if(diff===0)return;
  const btn=$('invb_'+id);btn.disabled=true;btn.textContent='…';
  try{

function genMaBaoHanh(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function bhLookupUrl(code){return location.origin+location.pathname+'?bh='+code;}
function bhQrImg(code,size){return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=8&data=${encodeURIComponent(bhLookupUrl(code))}`;}
function bhDaysLeft(o){if(!o.baoHanhDen)return null;const [d,m,y]=o.baoHanhDen.split('/').map(Number);const end=new Date(y,m-1,d,23,59,59);const now=new Date();return Math.ceil((end-now)/86400000);}

    const doc=await db.collection(COL.baohanh).doc(code).get();
    const card=document.getElementById('pubwCard');
    if(!doc.exists){card.innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:40px">❓</div><h3 style="margin:8px 0;color:#c0392b">Không tìm thấy</h3><p style="color:#666;font-size:13.5px">Mã bảo hành <b>${esc(code)}</b> không tồn tại hoặc đã bị xóa. Vui lòng liên hệ cửa hàng.</p></div>`;return;}
    const o={_id:doc.id,...doc.data()};const st=bhStatus(o);
    const stColor={ok:'#1c8a4d',vip:'#b8860b',low:'#c0392b',cn:'#666'}[st.cls];
    const stBg={ok:'#e5f5ec',vip:'#fdf3d9',low:'#fbe6e3',cn:'#eee'}[st.cls];
    const row=(l,v)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef0f4;font-size:13.5px"><span style="color:#888">${l}</span><b style="text-align:right">${v||'—'}</b></div>`;
    const ls=(o.lichSu&&o.lichSu.length)?o.lichSu.map(h=>`<div style="background:#f7f9fc;border-radius:8px;padding:8px 11px;margin-top:6px;font-size:12.5px"><b>${esc(h.ngay||'')}</b> — ${esc(h.noiDung||'')}</div>`).join(''):'<div style="color:#aaa;font-size:12.5px;padding:4px 0">Chưa có lịch sử bảo hành.</div>';
    card.innerHTML=`
      <div style="text-align:center;background:${stBg};color:${stColor};border-radius:11px;padding:12px;margin-bottom:16px"><div style="font-size:22px;font-weight:800">${st.txt}</div>${st.dl!==null&&st.dl>=0?`<div style="font-size:12.5px;margin-top:2px">Còn ${st.dl} ngày bảo hành</div>`:''}</div>
      <div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:4px">${esc(o.tenSanPham||'')}</div>
      <div style="text-align:center;font-family:monospace;color:#a97e46;font-weight:700;margin-bottom:14px">Mã: ${esc(o.maBaoHanh)}</div>
      ${o.serial?row('Số serial',esc(o.serial)):''}
      ${row('Ngày mua',esc(o.ngayMua||''))}
      ${row('Thời hạn BH',`${o.baoHanhSo||0} ${o.baoHanhDonVi==='nam'?'năm':'tháng'}`)}
      ${row('Bảo hành đến',esc(o.baoHanhDen||''))}
      ${o.khachTen?row('Khách hàng',esc(o.khachTen)):''}
      <div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Lịch sử bảo hành</div>${ls}</div>`;
  }catch(e){const card=document.getElementById('pubwCard');if(card)card.innerHTML=`<div style="text-align:center;padding:16px;color:#c0392b">Lỗi tra cứu: ${esc(e.message)}</div>`;}
}

/* ===== CẤU HÌNH TÀI KHOẢN NGÂN HÀNG ===== */
async function loadSettings(){try{const d=await db.collection(COL.settings).doc('bank').get();if(d.exists)BANK_INFO=d.data();}catch(e){BANK_INFO=null;}}
const VN_BANKS=[['VCB','Vietcombank'],['TCB','Techcombank'],['MB','MB Bank'],['BIDV','BIDV'],['ICB','VietinBank'],['VBA','Agribank'],['ACB','ACB'],['VPB','VPBank'],['STB','Sacombank'],['TPB','TPBank'],['MSB','MSB'],['HDB','HDBank'],['OCB','OCB'],['SHB','SHB'],['VIB','VIB'],['SEAB','SeABank'],['EIB','Eximbank'],['LPB','LPBank'],['NAB','Nam A Bank'],['BAB','BacABank'],['ABB','ABBANK'],['SCB','SCB'],['VAB','VietABank'],['PVCB','PVcomBank']];
function openBankSettings(){
  const b=BANK_INFO||{};
  const opts=VN_BANKS.map(([c,n])=>`<option value="${c}" ${b.bankCode===c?'selected':''}>${n}</option>`).join('');
  openModal(`<div class="modal-head"><h3>Cấu hình tài khoản chuyển khoản</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p style="color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px">Nhập tài khoản nhận tiền. App sẽ tạo <b>mã QR VietQR</b> (quét bằng mọi app ngân hàng, tự điền số tiền) và in lên hóa đơn khi chọn Chuyển khoản.</p>
      <div class="field"><label>Ngân hàng <span class="req">*</span></label><select id="bkCode">${opts}</select></div>
      <div class="field"><label>Số tài khoản <span class="req">*</span></label><input id="bkAcc" value="${esc(b.accountNo||'')}" placeholder="Số TK nhận tiền"></div>
      <div class="field" style="margin:0"><label>Tên chủ tài khoản</label><input id="bkName" value="${esc(b.accountName||'')}" placeholder="VD: DO NGOC CUONG"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="saveBkBtn" onclick="saveBankSettings()">💾 Lưu tài khoản</button></div>`);
}
async function saveBankSettings(){
  const code=$('bkCode').value,acc=$('bkAcc').value.trim();
  if(!acc){toast('Nhập số tài khoản','warn');return;}
  const bankName=(VN_BANKS.find(x=>x[0]===code)||[])[1]||code;
  const data={bankCode:code,bankName,accountNo:acc,accountName:$('bkName').value.trim(),updatedAt:new Date().toISOString()};
  const btn=$('saveBkBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{await db.collection(COL.settings).doc('bank').set(data);BANK_INFO=data;toast('Đã lưu tài khoản','ok');closeModal();if(typeof updatePayUI==='function')updatePayUI();}catch(e){toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent='💾 Lưu tài khoản';}
}

/* ===== NGƯỜI DÙNG ===== */
let USERS=[];
async function loadUsers(){try{const s=await db.collection(COL.users).get();USERS=s.docs.map(d=>({_id:d.id,...d.data()}));USERS.sort((a,b)=>(a.username||'').localeCompare(b.username||''));}catch(e){console.error(e);USERS=[];}}
function renderUsers(){
  if(!(CURRENT_USER.role==='admin'||CURRENT_USER.role==='quanly')){$('view').innerHTML='<div class="empty" style="padding:60px"><div class="em-ic">🔒</div><h4>Không có quyền</h4><p>Chỉ Quản trị / Quản lý mới xem được mục Người dùng.</p></div>';return;}
  $('view').innerHTML=`<div class="panel"><div class="panel-head"><h3>Tài khoản người dùng</h3><button class="btn btn-primary btn-sm" onclick="openUserForm()">＋ Thêm người dùng</button></div><div id="uTableWrap"><div class="spin"></div></div></div>
    <div class="panel" style="margin-top:16px"><div style="padding:16px 20px;font-size:13px;color:var(--muted);line-height:1.7">💡 <b>Phân quyền cơ sở:</b> tài khoản gán <b>"Cả 2 cơ sở"</b> (thầy/quản lý) mới thấy nút chuyển cơ sở và xem được cả hai. Tài khoản gán <b>Cơ sở 1</b> hoặc <b>Cơ sở 2</b> sẽ bị <b>khóa cứng</b> ở cơ sở đó — đăng nhập vào chỉ thấy dữ liệu cơ sở của mình, không xem được cơ sở kia.</div></div>`;
  loadUsers().then(drawUserTable);
}
function drawUserTable(){
  const wrap=$('uTableWrap');if(!wrap)return;
  if(USERS.length===0){wrap.innerHTML='<div class="empty"><div class="em-ic">⚙</div><h4>Chưa có người dùng</h4></div>';return;}
  wrap.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Cơ sở</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>${USERS.map(userRow).join('')}</tbody></table></div>`;
}
function userRow(u){
  const csTxt=u.coSo==='cs1'?'Cơ sở 1':u.coSo==='cs2'?'Cơ sở 2':'Cả 2 cơ sở';
  const csCls=u.coSo==='all'?'ok':'vip';
  const active=(u.trangThai||'Active')==='Active';
  const isMe=u.username===CURRENT_USER.username;
  return `<tr><td class="t-code">${esc(u.username)}${isMe?' <span style="color:var(--gold-2);font-size:11px">(bạn)</span>':''}</td><td class="t-name">${esc(u.hoTen||'')}</td><td>${esc(roleLabel(u.role))}</td><td><span class="chip ${csCls}">${csTxt}</span></td><td>${active?'<span class="chip ok">● Hoạt động</span>':'<span class="chip low">○ Đã khóa</span>'}</td><td><div class="row-act"><button class="icon-btn" title="Sửa" onclick="openUserForm('${esc(u._id)}')">✎</button>${isMe?'':`<button class="icon-btn del" title="Xóa" onclick="deleteUser('${esc(u._id)}')">🗑</button>`}</div></td></tr>`;
}
function openUserForm(id){
  const u=id?USERS.find(x=>x._id===id):{},edit=!!id;
  openModal(`<div class="modal-head"><h3>${edit?'Sửa người dùng':'Thêm người dùng'}</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body"><div class="grid2">
      <div class="field"><label>Tên đăng nhập <span class="req">*</span></label><input id="fuUser" value="${esc(u.username||'')}" placeholder="VD: nhanvien_cs2">${edit?'<small class="hint">Đổi tên sẽ cập nhật lại tài khoản (an toàn)</small>':''}</div>
      <div class="field"><label>Họ tên</label><input id="fuName" value="${esc(u.hoTen||'')}"></div>
      <div class="field"><label>Mật khẩu <span class="req">*</span></label><input id="fuPass" value="${esc(u.password||'')}" placeholder="Mật khẩu đăng nhập"></div>
      <div class="field"><label>Vai trò</label><select id="fuRole"><option value="admin" ${u.role==='admin'?'selected':''}>Quản trị</option><option value="quanly" ${u.role==='quanly'?'selected':''}>Quản lý</option><option value="nhanvien" ${(!u.role||u.role==='nhanvien')?'selected':''}>Nhân viên</option><option value="ktv" ${u.role==='ktv'?'selected':''}>Kỹ thuật</option></select></div>
      <div class="field"><label>Cơ sở làm việc <span class="req">*</span></label><select id="fuCoSo"><option value="all" ${(!u.coSo||u.coSo==='all')?'selected':''}>Cả 2 cơ sở (quản lý)</option><option value="cs1" ${u.coSo==='cs1'?'selected':''}>Chỉ Cơ sở 1 — Bà Triệu</option><option value="cs2" ${u.coSo==='cs2'?'selected':''}>Chỉ Cơ sở 2 — Lam Kinh</option></select></div>
      <div class="field"><label>Trạng thái</label><select id="fuStatus"><option value="Active" ${(!u.trangThai||u.trangThai==='Active')?'selected':''}>Hoạt động</option><option value="Locked" ${u.trangThai==='Locked'?'selected':''}>Khóa</option></select></div>
    </div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="saveUserBtn" onclick="saveUser('${edit?esc(id):''}')">${edit?'Lưu':'Thêm'}</button></div>`);
}
async function saveUser(id){
  const user=$('fuUser').value.trim(),pass=$('fuPass').value;
  if(!user){toast('Nhập tên đăng nhập','warn');return;}if(!pass){toast('Nhập mật khẩu','warn');return;}
  const data={username:user,hoTen:$('fuName').value.trim()||user,password:pass,role:$('fuRole').value,coSo:$('fuCoSo').value,trangThai:$('fuStatus').value,updatedAt:new Date().toISOString()};
  const btn=$('saveUserBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{if(id){
      if(user!==id){const ex=await db.collection(COL.users).doc(user).get();if(ex.exists){toast('Tên đăng nhập mới đã tồn tại','err');btn.disabled=false;btn.textContent='Lưu';return;}data.createdAt=(USERS.find(x=>x._id===id)||{}).createdAt||new Date().toISOString();await db.collection(COL.users).doc(user).set(data);await db.collection(COL.users).doc(id).delete();if(CURRENT_USER.username===id){CURRENT_USER.username=user;try{sessionStorage.setItem('bh_session',JSON.stringify(CURRENT_USER));}catch(e){}}toast('Đã đổi tên đăng nhập & cập nhật','ok');}
      else{await db.collection(COL.users).doc(id).set(data,{merge:true});toast('Đã cập nhật','ok');}}
    else{const ex=await db.collection(COL.users).doc(user).get();if(ex.exists){toast('Tên đăng nhập đã tồn tại','err');btn.disabled=false;btn.textContent='Thêm';return;}data.createdAt=new Date().toISOString();await db.collection(COL.users).doc(user).set(data);toast('Đã thêm người dùng','ok');}
    closeModal();await loadUsers();drawUserTable();}catch(e){toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent=id?'Lưu':'Thêm';}
}
function deleteUser(id){const u=USERS.find(x=>x._id===id);if(!u)return;openModal(`<div class="modal-head"><h3>Xóa người dùng</h3><button onclick="closeModal()">×</button></div><div class="modal-body"><p style="line-height:1.6">Xóa tài khoản <b>${esc(u.username)}</b> (${esc(u.hoTen||'')})?</p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="delUserBtn" onclick="confirmDeleteUser('${esc(id)}')">Xóa</button></div>`,'sm');}
async function confirmDeleteUser(id){const b=$('delUserBtn');b.disabled=true;b.textContent='Đang xóa…';try{await db.collection(COL.users).doc(id).delete();toast('Đã xóa','ok');closeModal();await loadUsers();drawUserTable();}catch(e){toast('Lỗi: '+e.message,'err');b.disabled=false;b.textContent='Xóa';}}

function openMyAccount(){
  const u=CURRENT_USER;
  openModal(`<div class="modal-head"><h3>Tài khoản của tôi</h3><button onclick="closeModal()">×</button></div>
    <div class="modal-body"><div class="grid2">
      <div class="field"><label>Họ tên</label><input id="maName" value="${esc(u.hoTen||'')}"></div>
      <div class="field"><label>Tên đăng nhập</label><input id="maUser" value="${esc(u.username||'')}"></div>
      <div class="field full"><label>Mật khẩu hiện tại <span class="req">*</span></label><input id="maCur" type="password" placeholder="Nhập để xác nhận thay đổi"></div>
      <div class="field"><label>Mật khẩu mới</label><input id="maNew" type="password" placeholder="Để trống nếu không đổi"></div>
      <div class="field"><label>Nhập lại mật khẩu mới</label><input id="maNew2" type="password"></div>
    </div><div class="hint" style="margin-top:6px">Phải nhập đúng <b>mật khẩu hiện tại</b> mới lưu được. Vai trò & cơ sở do quản trị viên quản lý.</div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="maBtn" onclick="saveMyAccount()">Lưu thay đổi</button></div>`);
}
async function saveMyAccount(){
  const cur=$('maCur').value;if(!cur){toast('Nhập mật khẩu hiện tại','warn');return;}
  const newName=$('maUser').value.trim();if(!newName){toast('Tên đăng nhập không được trống','warn');return;}
  const np=$('maNew').value,np2=$('maNew2').value;
  if(np&&np!==np2){toast('Mật khẩu mới nhập lại không khớp','warn');return;}
  const btn=$('maBtn');btn.disabled=true;btn.textContent='Đang lưu…';
  try{
    const oldId=CURRENT_USER.username;const doc=await db.collection(COL.users).doc(oldId).get();
    if(!doc.exists){toast('Không tìm thấy tài khoản','err');btn.disabled=false;btn.textContent='Lưu thay đổi';return;}
    const d=doc.data();
    if(String(d.password)!==String(cur)){toast('Mật khẩu hiện tại không đúng','err');btn.disabled=false;btn.textContent='Lưu thay đổi';return;}
    const data={username:newName,hoTen:$('maName').value.trim()||newName,password:np||d.password,role:d.role||'nhanvien',coSo:d.coSo||'all',trangThai:d.trangThai||'Active',createdAt:d.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
    if(newName!==oldId){
      const ex=await db.collection(COL.users).doc(newName).get();
      if(ex.exists){toast('Tên đăng nhập đã có người khác dùng','err');btn.disabled=false;btn.textContent='Lưu thay đổi';return;}
      await db.collection(COL.users).doc(newName).set(data);await db.collection(COL.users).doc(oldId).delete();
    }else{await db.collection(COL.users).doc(oldId).set(data,{merge:true});}
    CURRENT_USER.username=newName;CURRENT_USER.hoTen=data.hoTen;
    try{sessionStorage.setItem('bh_session',JSON.stringify(CURRENT_USER));}catch(e){}
    $('userName').textContent=CURRENT_USER.hoTen;$('userAv').textContent=(CURRENT_USER.hoTen||'?').trim().charAt(0).toUpperCase();
    toast('Đã cập nhật tài khoản'+(np?' & mật khẩu':''),'ok');closeModal();
  }catch(e){toast('Lỗi: '+e.message,'err');btn.disabled=false;btn.textContent='Lưu thay đổi';}
}

/* ===== KHỞI ĐỘNG ===== */
const _bhCode=new URLSearchParams(location.search).get('bh');
if(_bhCode){
  if(!ready)initFirebase();
  renderPublicWarranty(_bhCode.toUpperCase().trim());
}else{
  $('liBtn').onclick=doLogin;
  $('liPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  $('liUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('liPass').focus();});
  if(initFirebase()){bootLogin();try{const s=sessionStorage.getItem('bh_session');if(s)loginSuccess(JSON.parse(s));}catch(e){}}
}
</script>
